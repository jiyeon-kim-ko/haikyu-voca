    function makeWhiteTransparent(imgEl, threshold = 242) {
      try {
        if (!imgEl || !imgEl.naturalWidth || !imgEl.naturalHeight) return;
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = imgEl.naturalWidth;
        canvas.height = imgEl.naturalHeight;
        ctx.drawImage(imgEl, 0, 0);
        const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = image.data;

        // Remove only near-white pixels that are visually background-like.
        // Soft alpha around the threshold keeps anti-aliased hair edges cleaner.
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i], g = d[i+1], b = d[i+2];
          const min = Math.min(r,g,b), max = Math.max(r,g,b);
          const isNeutral = (max - min) < 18;
          if (isNeutral && min >= threshold) {
            const fade = Math.max(0, Math.min(1, (255 - min) / (255 - threshold)));
            d[i+3] = Math.round(255 * fade);
          }
        }
        ctx.putImageData(image, 0, 0);
        const url = canvas.toDataURL('image/png');
        CUTOUT_CACHE.set(imgEl.getAttribute('src'), url);
        imgEl.src = url;
      } catch (e) {
        console.warn('캐릭터 배경 제거 실패:', e);
      }
    }

    // WORD3 같은 파일이 CP949로 저장되어 있어도 품사/Day 글자가 깨지지 않게 하기 위함.
    async function fetchCSVText(fileName) {
      const res = await fetch(fileName);
      if (!res.ok) throw new Error(`${fileName} HTTP ${res.status}`);

      const bytes = await res.arrayBuffer();
      let text = '';

      // 1순위: 정상 UTF-8
      try {
        text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      } catch (utf8Error) {
        // 2순위: Windows 한글 CSV에서 흔한 CP949/EUC-KR
        try {
          text = new TextDecoder('euc-kr').decode(bytes);
          console.info(`${fileName}: CP949/EUC-KR 인코딩으로 읽었습니다.`);
        } catch (krError) {
          // 최후 백업
          text = new TextDecoder('utf-8').decode(bytes);
        }
      }

      // UTF-8 BOM 제거
      return text.replace(/^\uFEFF/, '');
    }

    // CSV 파일 자동 로드 및 파싱 함수
    async function loadAllCSVData() {
      BUILTIN_EN = [];
      BUILTIN_JA = [];

      // 1. 영어 CSV 로드
      const enFiles = ['toeic_vocab.csv', 'WORD2.csv', 'WORD3.csv'];
      for (const fn of enFiles) {
        try {
          const text = await fetchCSVText(fn);
          const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
          parsed.data.forEach((row, i) => {
            const w = String(row['word'] || row[' 단어'] || row['단어'] || '').trim();
            const m = String(row['meaning'] || row[' 뜻'] || row['의미'] || '').trim();
            const d = String(row['day'] || row['Day'] || '1').trim();
            if (w && m) {
              BUILTIN_EN.push({
                id: `${fn}_${i}`,
                day: d,
                word: w,
                raw_word: w,
                meaning: m
              });
            }
          });
        } catch (e) {
          console.warn(`Error loading ${fn}:`, e);
        }
      }

      // 2. 일본어 CSV 로드
      const jaFiles = ['japanese_vocabulary.csv', 'japanese_vocabulary2.csv'];
      for (const fn of jaFiles) {
        try {
          const text = await fetchCSVText(fn);
          const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
          parsed.data.forEach((row, i) => {
            const cat = String(row['품사'] || row['분류'] || '명사').trim();
            const kanji = String(row['표기'] || '').trim();
            const yomi = String(row['요미가나'] || '').trim();
            const mean = String(row['한국어 뜻'] || row['뜻'] || '').trim();
            if (kanji && mean) {
              const disp = (yomi && yomi !== kanji) ? `${kanji} (${yomi})` : kanji;
              BUILTIN_JA.push({
                id: `${fn}_${i}`,
                day: cat,
                word: disp,
                raw_word: kanji,
                // 발음은 한자보다 요미가나를 우선 사용
                speech_word: yomi || kanji,
                meaning: mean
              });
            }
          });
        } catch (e) {
          console.warn(`Error loading ${fn}:`, e);
        }
      }
    }

    function saveLocalBackup(userKey, data) {
      try {
        localStorage.setItem(userKey, JSON.stringify(data));
      } catch (e) {
        console.warn('Local backup save failed:', e);
      }
    }

    function loadLocalBackup(userKey) {
      try {
        const saved = localStorage.getItem(userKey);
        return saved ? normalizeUserData(JSON.parse(saved)) : null;
      } catch (e) {
        console.warn('Local backup load failed:', e);
        return null;
      }
    }

    async function loadUserData() {
      const requestedUser = state.user;
      const requestedLang = state.lang;
      const requestedChar = state.char;
      const userKey = getUserKey();

      const localBackup = loadLocalBackup(userKey);

      // Supabase가 로드되지 않았거나 네트워크 연결이 실패하면 로컬 백업 사용
      if (!supabaseClient) {
        state.userData = localBackup || getDefaultUserData();
        recordAttendance();
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from('haikyu_voca_data')
          .select('*')
          .eq('user_name', requestedUser)
          .eq('lang', requestedLang)
          .eq('character', requestedChar)
          .maybeSingle();

        // 기다리는 동안 사용자가 다른 계정/언어/캐릭터로 이동했다면 결과 무시
        if (
          state.user !== requestedUser ||
          state.lang !== requestedLang ||
          state.char !== requestedChar
        ) {
          return;
        }

        if (error) throw error;

        if (data) {
          state.userData = normalizeUserData(data);
          saveLocalBackup(userKey, state.userData);
        } else {
          // Supabase에 아직 데이터가 없으면 기존 기기의 localStorage 데이터를
          // 첫 클라우드 데이터로 자동 이전한다.
          state.userData = localBackup || getDefaultUserData();
          await saveUserDataToCloud(requestedUser, requestedLang, requestedChar, state.userData);
        }
      } catch (e) {
        console.warn('Supabase load failed. Using local backup:', e);
        state.userData = localBackup || getDefaultUserData();
      }

      recordAttendance();
    }

    async function saveUserDataToCloud(userName, lang, character, data) {
      if (!supabaseClient || !userName || !lang || !character) return false;

      const payload = {
        user_name: userName,
        lang,
        character,
        exp: Number(data.exp || 0),
        coins: Number(data.coins ?? 200),
        satisfaction: Number(data.satisfaction ?? 3),
        stamina: Number(data.stamina ?? 3),
        my_vocab_ids: Array.isArray(data.myVocabIds) ? data.myVocabIds : [],
        attendance_dates: Array.isArray(data.attendanceDates) ? data.attendanceDates : [],
        study_history: Array.isArray(data.studyHistory) ? data.studyHistory : [],
        spaced_rep_data: { ...(data.spacedRepData && typeof data.spacedRepData === 'object' ? data.spacedRepData : {}), __shop: normalizeShopData(data.shop) },
        custom_words: Array.isArray(data.customWords) ? data.customWords : [],
        updated_at: new Date().toISOString()
      };

      const { error } = await supabaseClient
        .from('haikyu_voca_data')
        .upsert(payload, {
          onConflict: 'user_name,lang,character'
        });

      if (error) {
        console.warn('Supabase save failed:', error);
        return false;
      }
      return true;
    }

    function saveUserData() {
      // 저장 버튼을 누르거나 보상을 받을 때 UI를 기다리게 하지 않도록
      // localStorage는 즉시 저장하고 Supabase는 비동기로 동기화한다.
      const userName = state.user;
      const lang = state.lang;
      const character = state.char;
      const userKey = getUserKey();
      const snapshot = normalizeUserData(JSON.parse(JSON.stringify(state.userData)));

      saveLocalBackup(userKey, snapshot);

      saveUserDataToCloud(userName, lang, character, snapshot).catch(e => {
        console.warn('Background Supabase sync failed:', e);
      });
    }

      const db = getCombinedVocab();

      return ['all', ...numericDays, ...strDays];
    }

    function getCharInfo() {
      const exp = state.userData.exp;
      let lvl = 1;
      for (let i = 0; i < EXP_THRESHOLDS.length; i++) {
        if (exp >= EXP_THRESHOLDS[i]) lvl = i + 1;
      }
      if (lvl > 10) lvl = 10;
      const nextThresh = lvl < 10 ? EXP_THRESHOLDS[lvl] : EXP_THRESHOLDS[9];
      const currThresh = EXP_THRESHOLDS[lvl - 1];
      const remExp = exp - currThresh;
      const reqExp = nextThresh - currThresh;
      const meta = CHAR_META[state.char] || CHAR_META.kageyama;

      return {
        level: lvl, exp: remExp, maxExp: reqExp, title: STAGE_TITLES[lvl - 1],
        ...meta
      };
    }

    function addRewards(expPts, coinPts) {
      const oldLvl = getCharInfo().level;
      state.userData.exp += expPts;
      state.userData.coins += coinPts;
      const newLvl = getCharInfo().level;
      if (newLvl > oldLvl) {
        alert(`🎉 파트너 승격! [Lv.${newLvl} ${STAGE_TITLES[newLvl - 1]}]`);
      }
      saveUserData();
      render();
    }

    function syncBgmSource(shouldPlay = false) {
      const track = getSelectedBgmTrack();
      const wasPlaying = isBgmPlaying || shouldPlay;

      bgmAudio.pause();
      bgmAudio.src = track.file;
      bgmAudio.loop = true;
      bgmAudio.volume = bgmVolume;
      bgmAudio.load();

      if (wasPlaying) {
        bgmAudio.play().then(() => {
          isBgmPlaying = true;
          render();
        }).catch(err => {
          isBgmPlaying = false;
          console.warn('BGM play failed:', err);
          alert(`BGM 파일을 재생할 수 없습니다.\n${track.file}\nGitHub의 bgm 폴더와 파일명을 확인해주세요.`);
          render();
        });
      } else {
        isBgmPlaying = false;
      }
    }

    function selectBgm(trackId) {
      if (!BGM_TRACKS.some(t => t.id === trackId)) return;
      const shouldResume = isBgmPlaying;
      selectedBgmId = trackId;
      localStorage.setItem('haikyu_bgm_track', selectedBgmId);
      syncBgmSource(shouldResume);
      render();
    }

    function changeBgmBy(step) {
      const idx = Math.max(0, BGM_TRACKS.findIndex(t => t.id === selectedBgmId));
      const next = (idx + step + BGM_TRACKS.length) % BGM_TRACKS.length;
      selectBgm(BGM_TRACKS[next].id);
    }

      const parsed = Number(value);
      bgmVolume = Math.min(1, Math.max(0, Number.isFinite(parsed) ? parsed : 0.35));
      bgmAudio.volume = bgmVolume;
      localStorage.setItem('haikyu_bgm_volume', String(bgmVolume));

      const label = document.getElementById('bgm-volume-value');
      if (label) label.textContent = `${Math.round(bgmVolume * 100)}%`;
    }

    function toggleBgm() {
      if (isBgmPlaying) {
        bgmAudio.pause();
        isBgmPlaying = false;
        render();
        return;
      }

      const track = getSelectedBgmTrack();

      // 현재 Audio 객체가 다른 파일을 가리키고 있으면 선택 곡으로 교체
      const currentSrc = decodeURIComponent(bgmAudio.src || '');
      const wantedFile = track.file;
      if (!currentSrc.includes(wantedFile)) {
        bgmAudio.src = wantedFile;
        bgmAudio.loop = true;
        bgmAudio.volume = bgmVolume;
        bgmAudio.load();
      }

      bgmAudio.play().then(() => {
        isBgmPlaying = true;
        render();
      }).catch(err => {
        isBgmPlaying = false;
        console.warn('BGM play failed:', err);
        alert(`BGM 파일을 재생할 수 없습니다.\n${track.file}\nGitHub의 bgm 폴더와 파일명을 확인해주세요.`);

    function normalizeVoiceLang(lang) {
      return String(lang || '').replace('_', '-').toLowerCase();
    }

    function pickBestVoice(langCode) {
      const target = langCode.toLowerCase();
      const candidates = availableVoices.filter(v => normalizeVoiceLang(v.lang).startsWith(target));
      if (candidates.length === 0) return null;

      const preferred = candidates.find(v => /Google|Natural|Neural|Enhanced|Premium|Online/i.test(v.name));
      return preferred || candidates[0];
    }

    async function speakWithBrowserTTS(text, langCode) {
      if (!('speechSynthesis' in window)) return false;
      await ensureVoicesLoaded();

      const voice = pickBestVoice(langCode);
      if (!voice && langCode === 'ja-JP') {
        console.warn('Japanese TTS voice is not installed/available in this browser.');
      }

      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = langCode;
      if (voice) u.voice = voice;
      u.rate = langCode === 'ja-JP' ? 0.9 : 0.92;
      u.pitch = 1.0;
      window.speechSynthesis.speak(u);
      return true;
    }

    function stopPronunciation() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      pronunciationAudio.pause();
      pronunciationAudio.onerror = null;
      pronunciationAudio.onended = null;
      pronunciationAudio.currentTime = 0;
    }

    // URL 음원이 실패하면 다음 URL을 시도하고, 모두 실패하면 브라우저 TTS로 넘어간다.
    async function playAudioCandidates(urls, fallbackFn) {
      stopPronunciation();
      let idx = 0;

      const tryNext = async () => {
        if (idx >= urls.length) {
          pronunciationAudio.onerror = null;
          await fallbackFn();
          return;
        }

        const url = urls[idx++];
        pronunciationAudio.src = url;
        pronunciationAudio.load();
        pronunciationAudio.onerror = () => {
          console.warn('Pronunciation source failed:', url);
          tryNext();
        };

        try {
          await pronunciationAudio.play();
        } catch (err) {
          console.warn('Pronunciation play() failed:', url, err);
          await tryNext();
        }
      };

      await tryNext();
    }

    async function playTTS(word, accent) {
      const clean = String(word || '')
        .split('(')[0]
        .replace(/[^a-zA-Z0-9\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF\s'-]/g, '')
        .trim();
      if (!clean) return;

      // 일본어: RStudio Viewer처럼 일본어 시스템 voice가 없는 환경에서도 들리도록
      // 네트워크 일본어 음원을 먼저 재생하고, 실패할 때만 ja-JP 브라우저 TTS를 사용한다.
      // CSV의 요미가나(speech_word)가 전달되므로 한자 오독도 줄어든다.
      if (state.lang === 'ja') {
        const encoded = encodeURIComponent(clean);
        const jaUrls = [
          `https://translate.google.com/translate_tts?ie=UTF-8&client=gtx&tl=ja&q=${encoded}`,
          `https://translate.google.com/translate_tts?ie=UTF-8&client=webapp&tl=ja&q=${encoded}`
        ];
        await playAudioCandidates(jaUrls, () => speakWithBrowserTTS(clean, 'ja-JP'));
        return;
      }

      // 영어: app.R에서 사용하던 실제 US / UK 발음 음원을 사용한다.
      // 호주식은 요청대로 완전히 제거.
      const encodedWord = encodeURIComponent(clean.toLowerCase());
      let audioUrl;
      let fallbackLang;

      if (accent === 'UK') {
        audioUrl = `https://dict.youdao.com/dictvoice?audio=${encodedWord}&type=1`;
        fallbackLang = 'en-GB';
      } else {
        audioUrl = `https://dict.youdao.com/dictvoice?audio=${encodedWord}&type=2`;
        fallbackLang = 'en-US';
      }

      await playAudioCandidates([audioUrl], () => speakWithBrowserTTS(clean, fallbackLang));
    }

    function generateQuiz() {
      const db = getFilteredVocab();
      if (db.length < 4) {
        state.quizQuestions = [];
        return;
      }
      const shuf = [...db].sort(() => 0.5 - Math.random());
      state.quizQuestions = shuf.map(item => {
        const others = db.filter(d => d.id !== item.id).sort(() => 0.5 - Math.random()).slice(0, 3);
        const opts = [item.meaning, ...others.map(o => o.meaning)].sort(() => 0.5 - Math.random());
        return { id: item.id, word: item.word, cAns: item.meaning, opts };
      });
      state.quizIdx = 0;
      state.quizAnswered = false;
      state.quizSelectedOpt = null;
      state.quizScore = { correct: 0, total: state.quizQuestions.length, wrongIds: [], finished: false };
      state.lastTicketGain = 0;
      state.mood = 'normal';
    }

    function generateHardQuiz() {
      const db = getFilteredVocab();
      if (db.length === 0) {
        state.hardQuestions = [];
        return;
      }
      const shuf = [...db].sort(() => 0.5 - Math.random());
      state.hardQuestions = shuf.map(item => ({ id: item.id, word: item.word, meaning: item.meaning }));
      state.hardIdx = 0;
      state.hardAnswered = false;
      state.hardIsCorrect = false;
      state.hardScore = { correct: 0, total: state.hardQuestions.length, wrongIds: [], finished: false };
      state.lastTicketGain = 0;
      state.mood = 'normal';
    }

    function generateSpellQuiz() {
      if (state.lang === 'ja') return;
      const db = getFilteredVocab();
      if (db.length === 0) {
        state.spellQuestions = [];
        return;
      }
      const shuf = [...db].sort(() => 0.5 - Math.random());
      state.spellQuestions = shuf.map(item => {
        const chars = item.raw_word.split('');
        const maskCount = Math.max(1, Math.round(chars.length * 0.4));
        const maskIndices = [];
        while (maskIndices.length < maskCount) {
          const r = Math.floor(Math.random() * chars.length);
          if (!maskIndices.includes(r)) maskIndices.push(r);
        }
        const masked = chars.map((c, i) => maskIndices.includes(i) ? '_' : c).join(' ');
        return { id: item.id, word: item.raw_word, meaning: item.meaning, maskedWord: masked };
      });
      state.spellIdx = 0;
      state.spellAnswered = false;
      state.spellIsCorrect = false;
      state.spellScore = { correct: 0, total: state.spellQuestions.length, wrongIds: [], finished: false };
      state.lastTicketGain = 0;
      state.mood = 'normal';
    }

                <span>보유 코인</span><span style="color:#EA580C;">${state.userData.coins} 🪙</span>
              </div>
              <div style="display:flex; gap:4px; margin-top:4px;">
                <button class="btn-pixel-white" style="flex:1; padding:6px 3px; font-size:10.5px;" onclick="feedPartner()">🍙 ${charInfo.food} · ${CARE_COSTS.food}🪙</button>
                <button class="btn-pixel-white" style="flex:1; padding:6px 3px; font-size:10.5px; display:flex; align-items:center; justify-content:center; gap:3px;" onclick="actionPartner()">${renderMikasaBall(13)} ${charInfo.act} · ${CARE_COSTS.train}🪙</button>
              </div>
              <div style="margin-top: 2px; display: flex; gap: 4px;">
                <button class="btn-pixel-white" style="flex: 1; padding: 6px; font-size: 11px;" onclick="state.entered=false; render();">🔄 선수 교체</button>
                <button class="btn-pixel-white" style="flex: 1; padding: 6px; font-size: 11px;" onclick="changeLanguage()">🌐 언어 변경</button>
                <button class="btn-pixel-white" style="flex: 1; padding: 6px; font-size: 11px;" onclick="resetToUserSelect()">👥 사용자 변경</button>
              </div>
            </div>

            <div class="hompy-nav-tabs">
              <button class="btn-tab-menu ${state.tab === 'practice' ? 'active' : ''}" onclick="switchTab('practice')">연습</button>
              <button class="btn-tab-menu ${state.tab === 'quiz' ? 'active' : ''}" onclick="switchTab('quiz')">객관식</button>
              <button class="btn-tab-menu ${state.tab === 'hard' ? 'active' : ''}" onclick="switchTab('hard')">주관식</button>
              ${state.lang !== 'ja' ? `<button class="btn-tab-menu ${state.tab === 'spell' ? 'active' : ''}" onclick="switchTab('spell')">스펠링</button>` : ''}
              <button class="btn-tab-menu ${state.tab === 'custom' ? 'active' : ''}" onclick="switchTab('custom')">단어장</button>
              <button class="btn-tab-menu ${state.tab === 'spaced' ? 'active' : ''}" onclick="switchTab('spaced')">복습</button>
              <button class="btn-tab-menu ${state.tab === 'shop' ? 'active' : ''}" onclick="switchTab('shop')">상점</button>
              <button class="btn-tab-menu ${state.tab === 'history' ? 'active' : ''}" onclick="switchTab('history')">기록</button>
            </div>

            <div class="hompy-main-content">
              <div class="main-speech-bubble">💬 ${renderSpeechWithBall(state.speech)}</div>
              <div id="tab-content" style="flex-grow: 1; display: flex; flex-direction: column;">
                ${renderTabContent()}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderDaySelect(changeHandler) {
      const days = getDaysList();
      return `
        <select class="std-input" style="width: 150px; height: 34px;" onchange="${changeHandler}(this.value)">
          ${days.map(d => {
            let label = d;
            if (d === 'all') label = '전체 범위';
            else if (!isNaN(d)) label = `Day ${d}`;
            return `<option value="${d}" ${state.selectedDay === d ? 'selected' : ''}>${label}</option>`;
          }).join('')}
        </select>
      `;
    }

    function renderTabContent() {
      if (state.tab === 'practice') {
        const list = getFilteredVocab();
        if (list.length === 0) {
          return `
            <div style="display:flex; justify-content:space-between; margin-bottom:12px;">${renderDaySelect('onDayChange')}</div>
            <p style="color:#64748B; text-align:center; margin-top:50px;">선택된 범위에 단어가 없습니다.</p>
          `;
        }
        const item = list[state.fcIdx] || list[0];
        
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
            ${renderDaySelect('onDayChange')}
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-size:12.5px; font-weight:900; color:#475569; white-space:nowrap;">단어 ${state.fcIdx + 1} / ${list.length}</span>
              <button class="btn-pixel-white" onclick="shuffleFlashcards()">🔀 셔플</button>
            </div>
          </div>
          <div class="flashcard-box" onclick="toggleFlashcardMeaning()">
            <div style="font-size: 32px; font-weight: 900; color: #1E293B;">${item.word}</div>
            
            <div style="margin: 14px 0;" onclick="event.stopPropagation();">
              ${state.lang === 'ja' ? `
                <button class="btn-pixel-white" onclick="playTTS('${item.speech_word || item.raw_word}', 'JA')">🔊 일본어 발음 듣기</button>
              ` : `
                <div class="accent-btn-group">
                  <button class="accent-btn ${state.selectedAccent === 'US' ? 'active' : ''}" onclick="setAccent('US'); playTTS('${item.raw_word}', 'US');">🇺🇸 미국식</button>
                  <button class="accent-btn ${state.selectedAccent === 'UK' ? 'active' : ''}" onclick="setAccent('UK'); playTTS('${item.raw_word}', 'UK');">🇬🇧 영국식</button>
                </div>
              `}
            </div>

            ${state.fcShowMeaning
              ? `<div style="font-size: 20px; font-weight: 800; color: #EA580C; margin-top: 10px;">${item.meaning}</div>`
              : `<div style="font-size: 13px; color: #94A3B8; margin-top: 10px;">[카드를 탭하여 뜻 확인]</div>`}
          </div>
          <div style="display:flex; justify-content:center; gap:8px; margin-top:15px; flex-wrap:wrap;">
            <button class="btn-pixel-white" ${state.fcIdx === 0 ? 'disabled' : ''} onclick="prevFlashcard()">◀ 이전</button>
            <button class="btn-pixel-black" onclick="toggleFlashcardMeaning()">${state.fcShowMeaning ? '단어만 보기' : '뜻 보기'}</button>
            <button class="btn-pixel-white" style="${state.userData.myVocabIds.includes(item.id) ? 'border-color:#10B981; color:#059669;' : 'border-color:#EA580C; color:#EA580C;'}" onclick="addCurrentPracticeWord('${item.id}')" ${state.userData.myVocabIds.includes(item.id) ? 'disabled' : ''}>${state.userData.myVocabIds.includes(item.id) ? '✓ 단어장 저장됨' : '＋ 단어장 추가하기'}</button>
            <button class="btn-pixel-white" ${state.fcIdx >= list.length - 1 ? 'disabled' : ''} onclick="nextFlashcard()">다음 ▶</button>
          </div>
        `;
      }

      if (state.tab === 'quiz') {
        const sc = state.quizScore;
        if (sc.finished) {
          const rate = sc.total > 0 ? ((sc.correct / sc.total) * 100).toFixed(1) : 100;
          return `
            <div style="text-align: center; padding: 40px 20px;">
              <h3 style="font-weight: 900; display:flex; justify-content:center; align-items:center; gap:7px;">${renderMikasaBall(22)} 1세트 객관식 결과</h3>
              <p style="font-size: 16px; color: #4B5563;">성공률: ${rate}% (${sc.correct}/${sc.total})</p>
              <h4 style="color: #EA580C; font-weight: 900;">+${calculateTestReward('quiz', sc.correct).exp} EXP | +${calculateTestReward('quiz', sc.correct).coins} 🪙 획득!</h4>
              <div class="ticket-result">🎟️ 응원 티켓 ${state.lastTicketGain > 0 ? `+${state.lastTicketGain}장` : '추가 획득 없음'}</div>
              <button class="btn-pixel-black" style="margin-top: 15px;" onclick="generateQuiz(); render();">다시 시작하기 ➔</button>
            </div>
          `;
        }
        if (state.quizQuestions.length === 0) return `<p style="padding:20px;">문제를 생성 중이거나 단어가 부족합니다 (최소 4개 필요).</p>`;
        const q = state.quizQuestions[state.quizIdx];
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            ${renderDaySelect('onDayChange')}
            <span style="font-weight: 800;">문제: ${state.quizIdx + 1} / ${state.quizQuestions.length}</span>
          </div>
          <div style="text-align: center; padding: 10px 0;">
            <h2 style="font-weight: 900; color: #1E293B; margin: 5px 0 15px 0;">${q.word}</h2>
          </div>
          <div>
            ${q.opts.map((opt, i) => {
              let cls = "option-btn";
              if (state.quizAnswered) {
                if (opt === q.cAns) cls += " btn-correct";
                else if (opt === state.quizSelectedOpt) cls += " btn-wrong";
              }
              return `<button class="${cls}" onclick="handleQuizOpt('${opt.replace(/'/g, "\\'")}')">${i + 1}.  ${opt}</button>`;
            }).join('')}
          </div>
          ${state.quizAnswered ? `
            <div style="text-align: right; margin-top: 5px;">
              <button class="btn-pixel-black" onclick="nextQuiz()">
                ${state.quizIdx < state.quizQuestions.length - 1 ? '다음 문제 ➔' : '세트 결과 확인 ➔'}
              </button>
            </div>
          ` : ''}
        `;
      }

      if (state.tab === 'hard') {
        const sc = state.hardScore;
        if (sc.finished) {
          return `
            <div style="text-align: center; padding: 40px 20px;">
              <h3 style="font-weight: 900;">🔥 주관식 Hard 세트 완료!</h3>
              <p style="font-size: 16px; color: #4B5563;">적중: ${sc.correct} / ${sc.total}</p>
              <h4 style="color: #EA580C; font-weight: 900;">+${calculateTestReward('hard', sc.correct).exp} EXP | +${calculateTestReward('hard', sc.correct).coins} 🪙 획득!</h4>
              <div class="ticket-result">🎟️ 응원 티켓 ${state.lastTicketGain > 0 ? `+${state.lastTicketGain}장` : '추가 획득 없음'}</div>
              <button class="btn-pixel-black" style="margin-top: 15px;" onclick="generateHardQuiz(); render();">다시 시작하기 ➔</button>
            </div>
          `;
        }
        if (state.hardQuestions.length === 0) return `<p style="padding:20px;">단어가 없습니다.</p>`;
        const q = state.hardQuestions[state.hardIdx];
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            ${renderDaySelect('onDayChange')}
            <span style="font-weight: 800;">문제: ${state.hardIdx + 1} / ${state.hardQuestions.length}</span>
          </div>
          <div style="text-align: center; padding: 15px 0;">
            <h2 style="font-weight: 900; color: #1E293B; margin: 0 0 10px 0;">${q.word}</h2>
            <p style="color: #64748B; font-size: 13px;">한국어 뜻을 직접 입력하세요.</p>
          </div>
          <div style="max-width: 440px; margin: 0 auto; width: 100%;">
            <input type="text" id="hard-input" class="std-input" placeholder="한국어 뜻 입력 (예: 잡다)" ${state.hardAnswered ? 'disabled' : ''} onkeydown="if(event.key==='Enter') submitHard();" />
            <div style="margin-top: 10px;">
              ${!state.hardAnswered ? `
                <button class="btn-pixel-black" style="width: 100%;" onclick="submitHard()">정답 확인</button>
              ` : `
                <div style="background: ${state.hardIsCorrect ? '#DCFCE7' : '#FEE2E2'}; color: ${state.hardIsCorrect ? '#166534' : '#991B1B'}; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 8px;">
                  ${state.hardIsCorrect ? '● 정답입니다!' : '✕ 정답: ' + q.meaning}
                </div>
                <button class="btn-pixel-black" style="width: 100%;" onclick="nextHard()">
                  ${state.hardIdx < state.hardQuestions.length - 1 ? '다음 문제 ➔' : '세트 결과 확인 ➔'}
                </button>
              `}
            </div>
          </div>
        `;
      }

      if (state.tab === 'spell' && state.lang !== 'ja') {
        const sc = state.spellScore;
        if (sc.finished) {
          return `
            <div style="text-align: center; padding: 40px 20px;">
              <h3 style="font-weight: 900;">🔤 스펠링 게임 완료!</h3>
              <p style="font-size: 16px; color: #4B5563;">적중: ${sc.correct} / ${sc.total}</p>
              <h4 style="color: #EA580C; font-weight: 900;">+${calculateTestReward('spell', sc.correct).exp} EXP | +${calculateTestReward('spell', sc.correct).coins} 🪙 획득!</h4>
              <div class="ticket-result">🎟️ 응원 티켓 ${state.lastTicketGain > 0 ? `+${state.lastTicketGain}장` : '추가 획득 없음'}</div>
              <button class="btn-pixel-black" style="margin-top: 15px;" onclick="generateSpellQuiz(); render();">다시 시작하기 ➔</button>
            </div>
          `;
        }
        if (state.spellQuestions.length === 0) return `<p style="padding:20px;">단어가 없습니다.</p>`;
        const q = state.spellQuestions[state.spellIdx];
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            ${renderDaySelect('onDayChange')}
            <span style="font-weight: 800;">문제: ${state.spellIdx + 1} / ${state.spellQuestions.length}</span>
          </div>
          <div style="text-align: center; padding: 10px 0;">
            <h4 style="font-weight: 800; color: #4B5563; margin: 0;">${q.meaning}</h4>
            <div style="font-family: monospace; font-size: 30px; letter-spacing: 4px; font-weight: 900; margin: 12px 0;">${q.maskedWord}</div>
          </div>
          <div style="max-width: 440px; margin: 0 auto; width: 100%;">
            <input type="text" id="spell-input" class="std-input" placeholder="완성된 영단어 입력" ${state.spellAnswered ? 'disabled' : ''} onkeydown="if(event.key==='Enter') submitSpell();" />
            <div style="margin-top: 10px;">
              ${!state.spellAnswered ? `
                <button class="btn-pixel-black" style="width: 100%;" onclick="submitSpell()">철자 제출</button>
              ` : `
                <div style="background: ${state.spellIsCorrect ? '#DCFCE7' : '#FEE2E2'}; color: ${state.spellIsCorrect ? '#166534' : '#991B1B'}; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 8px;">
                  ${state.spellIsCorrect ? '● 정답: ' + q.word : '✕ 정답: ' + q.word}
                </div>
                <button class="btn-pixel-black" style="width: 100%;" onclick="nextSpell()">
                  ${state.spellIdx < state.spellQuestions.length - 1 ? '다음 문제 ➔' : '세트 결과 확인 ➔'}
                </button>
              `}
            </div>
          </div>
        `;
      }

      if (state.tab === 'custom') {
        const db = getCombinedVocab();
        const myVocab = db.filter(d => state.userData.myVocabIds.includes(d.id));
        return `
          <h4 style="font-weight: 900; margin-top: 0; color: #1E293B;">➕ 나만의 단어 추가</h4>
          <div class="custom-input-row">
            <input type="text" id="c-day" placeholder="${state.lang === 'ja' ? '품사' : 'Day 번호'}" style="width: 20%;" />
            <input type="text" id="c-word" placeholder="${state.lang === 'ja' ? '일본어 단어' : '영어 단어'}" style="width: 35%;" />
            <input type="text" id="c-meaning" placeholder="한국어 뜻 입력" style="width: 45%;" />
            <button class="btn-pixel-black" onclick="addCustomWord()">추가 ➕</button>
          </div>
          <hr style="border: 0; border-top: 1px solid #E2E8F0; margin: 15px 0;" />
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h4 style="font-weight: 900; margin: 0; color: #1E293B;">📑 내 오답 단어장 (${myVocab.length})</h4>
          </div>
          <div style="max-height: 250px; overflow-y: auto; margin-top: 10px;">
            ${myVocab.length === 0 ? '<p style="color: #94A3B8; text-align: center; padding: 25px;">저장된 오답이 없습니다.</p>' :
              myVocab.map(r => `
                <div class="word-row">
                  <div>
                    <span style="font-weight: 800; color: #1E293B;">${r.word}</span>
                    <span style="color: #64748B; margin-left: 10px;">${r.meaning}</span>
                  </div>
                  <button class="btn-pixel-white" onclick="removeMyVocab('${r.id}')">외웠다 ✔</button>
                </div>
              `).join('')}
          </div>
        `;
      }

      if (state.tab === 'spaced') {
        const sData = state.userData.spacedRepData;
        const todayStr = new Date().toISOString().split('T')[0];
        const db = getCombinedVocab();
        const reviewIds = Object.keys(sData).filter(k => !k.startsWith('__') && sData[k] && sData[k].nextDate <= todayStr);
        const reviewList = db.filter(d => reviewIds.includes(d.id));

        if (reviewList.length === 0) {
          return `<div style="text-align: center; padding: 50px 20px;"><h4 style="font-weight: 800;">오늘 복습할 망각 단어가 없습니다! 🎉</h4></div>`;
        }
        return `
          <h4 style="font-weight: 900; margin-top: 0;">🧠 오늘의 주기 복습 단어 (${reviewList.length}개)</h4>
          <div style="max-height: 380px; overflow-y: auto;">
            ${reviewList.map(r => `
              <div class="word-row">
                <div>
                  <span style="font-weight: 800; color: #1E293B;">${r.word}</span>
                  <span style="color: #64748B; margin-left: 10px;">${r.meaning}</span>
                </div>
                <button class="btn-pixel-black" onclick="passSpacedRep('${r.id}')">복습완료</button>
              </div>
            `).join('')}
          </div>
        `;
      }

      if (state.tab === 'shop') {
        const schoolId=getCharSchoolId(),visibleItems=SHOP_ITEMS.filter(item=>item.type===state.shopCategory&&(item.school==='all'||item.school===schoolId));
        const labels={accessory:'🎀 액세서리',background:'🖼️ 배경',slogan:'🏳️ 슬로건'};
        const previewItem=getShopItem(state.shopPreviewItemId);
        return `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap"><div><h4 style="font-weight:900;margin:0 0 4px">🛍️ 꾸미기 상점</h4><div style="font-size:11.5px;color:#64748B;font-weight:700">${CHAR_META[state.char].name} · ${SCHOOL_LABELS[schoolId]||CHAR_META[state.char].school}</div></div><div style="font-weight:900;color:#7C3AED;background:#F5F3FF;border:1.5px solid #C4B5FD;border-radius:9px;padding:7px 10px">🎟️ ${state.userData.shop.tickets}장</div></div>
        <div class="shop-category-tabs" style="margin-top:12px">${Object.keys(labels).map(cat=>`<button class="shop-category-btn ${state.shopCategory===cat?'active':''}" onclick="setShopCategory('${cat}')">${labels[cat]}</button>`).join('')}</div>
        <div style="font-size:10.5px;color:#94A3B8;margin-top:8px">모든 아이템은 구매 전에 미리보기할 수 있습니다. 액세서리와 슬로건은 위치·크기·투명도까지 조정해볼 수 있어요.</div>
        ${previewItem?renderShopItemPreview(previewItem):''}
        <div class="shop-grid">${visibleItems.map(item=>{const owned=state.userData.shop.ownedItems.includes(item.id),slot=item.type==='accessory'?item.slot:item.type,equipped=state.userData.shop.equipped[slot]===item.id,canBuy=state.userData.shop.tickets>=item.price,previewing=state.shopPreviewItemId===item.id;return `<div class="shop-card ${equipped?'equipped':''} ${previewing?'previewing':''}"><div class="shop-preview ${item.type==='background'?'bg':''}"><img src="${item.file}" alt="${item.name}" onerror="this.style.display='none';"></div><div class="shop-item-name">${item.name}</div><div class="shop-item-meta">${item.school==='all'?'전 캐릭터 공용':`${SCHOOL_LABELS[item.school]} 전용`}${item.type==='accessory'?` · ${item.slot==='head'?'머리':item.slot==='face'?'얼굴':item.slot==='effect'?'효과':'주변 소품'}`:''}</div><button class="btn-pixel-white shop-preview-btn" onclick="previewShopItem('${item.id}')">${previewing?'미리보기 닫기':'👀 미리보기'}</button>${owned?`<button class="${equipped?'btn-pixel-black':'btn-pixel-white'}" style="width:100%;padding:7px 4px;font-size:11px" onclick="${equipped?`unequipShopItem('${item.id}')`:`equipShopItem('${item.id}')`}">${equipped?'장착 해제':'장착하기'}</button>`:`<button class="btn-pixel-white" style="width:100%;padding:7px 4px;font-size:11px;${canBuy?'border-color:#7C3AED;color:#6D28D9;':'opacity:.55;'}" onclick="buyShopItem('${item.id}')" ${canBuy?'':'disabled'}>🎟️ ${item.price} · 구매</button>`}</div>`}).join('')}</div>`;
      }

      if (state.tab === 'history') {
        const hList = [...state.userData.studyHistory].reverse();
        return `
          <h4 style="font-weight: 900; margin-top: 0;">📊 나의 훈련 통계</h4>
          ${hList.length === 0 ? '<p style="color: #94A3B8; text-align: center; padding: 40px;">기록이 없습니다.</p>' : `
            <table class="history-table">
              <thead>
                <tr><th>날짜</th><th>푼 문제</th><th>성공</th><th>성공률</th></tr>
              </thead>
              <tbody>
                ${hList.map(item => `
                  <tr>
                    <td>${item.date}</td>
                    <td>${item.total}문제</td>
                    <td>${item.correct}개</td>
                    <td>${item.total > 0 ? ((item.correct / item.total) * 100).toFixed(1) : 100}%</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `}
        `;
      }

      return '';
    }


    function getDefaultPreviewTransform(item){
      if(!item) return {x:0,y:0,scale:100,opacity:100,rotate:0};
      if(item.type==='slogan') return {x:0,y:-112,scale:80,opacity:100,rotate:0};
      if(item.type==='background') return {x:0,y:0,scale:100,opacity:100,rotate:0};
      const slot=item.slot;
      if(slot==='head') return {x:0,y:-92,scale:42,opacity:100,rotate:0};
      if(slot==='face') return {x:0,y:-18,scale:48,opacity:100,rotate:0};
      if(slot==='side') return {x:72,y:36,scale:36,opacity:100,rotate:0};
      return {x:0,y:0,scale:92,opacity:95,rotate:0};
    }
    function getPreviewTransform(item){
      if(!item) return {x:0,y:0,scale:100,opacity:100};
      const saved = state.userData?.shop?.transforms?.[item.id];
      if(saved && !state.shopPreviewTransforms[item.id]) state.shopPreviewTransforms[item.id]={rotate:0,...saved};
      if(!state.shopPreviewTransforms[item.id]) state.shopPreviewTransforms[item.id]=getDefaultPreviewTransform(item);
      return state.shopPreviewTransforms[item.id];
    }
    function previewShopItem(id){
      state.shopPreviewItemId = state.shopPreviewItemId===id ? null : id;
      const item=getShopItem(id);
      if(item) getPreviewTransform(item);
      render();
    }
    function updateShopPreviewTransform(id,key,value){
      const item=getShopItem(id); if(!item) return;
      const t=getPreviewTransform(item);
      t[key]=Number(value);
      if(state.userData?.shop){
        state.userData.shop.transforms = state.userData.shop.transforms || {};
        state.userData.shop.transforms[id] = {...t};
      }
      const el=document.getElementById('shop-preview-moving-layer');
      if(el){
        el.style.left=`calc(50% + ${t.x}px)`;
        el.style.top=`calc(50% + ${t.y}px)`;
        el.style.width=`${t.scale}%`;
        el.style.opacity=String(t.opacity/100);
        el.style.transform=`translate(-50%,-50%) rotate(${t.rotate || 0}deg)`;
      }
      const label=document.getElementById(`preview-${key}-value`);
      if(label) label.textContent =
        key==='opacity' ? `${t[key]}%` :
        key==='scale' ? `${t[key]}%` :
        key==='rotate' ? `${t[key]}°` :
        `${t[key]}px`;
    }
    function resetShopPreviewTransform(id){
      const item=getShopItem(id); if(!item) return;
      state.shopPreviewTransforms[id]=getDefaultPreviewTransform(item);
      state.userData.shop.transforms = state.userData.shop.transforms || {};
      state.userData.shop.transforms[id] = {...state.shopPreviewTransforms[id]};
      render();
    }
    function renderShopItemPreview(item){
      if(!item) return '';
      const meta=CHAR_META[state.char]||CHAR_META.kageyama;
      const t=getPreviewTransform(item);
      const isBg=item.type==='background';
      const movingClass=item.type==='slogan'?'preview-slogan':'preview-accessory';
      const movingStyle=`left:calc(50% + ${t.x}px);top:calc(50% + ${t.y}px);width:${t.scale}%;opacity:${t.opacity/100};transform:translate(-50%,-50%) rotate(${t.rotate || 0}deg);`;
      return `<div class="shop-preview-panel">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <div><b>👀 ${item.name} 미리보기</b><div style="font-size:10.5px;color:#64748B;margin-top:2px">실제 장착 모습 기준으로 확인합니다.</div></div>
          <button class="btn-pixel-white" onclick="previewShopItem('${item.id}')">닫기 ✕</button>
        </div>

        <div class="shop-preview-stage ${isBg?'':'cutout-stage'}">
          ${isBg?`<img class="preview-bg" src="${item.file}" alt="${item.name}">`:''}
          ${characterCutoutImg(meta,'preview-char-cutout')}
          ${!isBg?`<img id="shop-preview-moving-layer" class="${movingClass}" src="${item.file}" alt="${item.name}" style="${movingStyle}">`:''}
        </div>

        ${isBg?`
          <div style="font-size:11px;color:#64748B;text-align:center;font-weight:800">배경이 캐릭터 뒤에 표시됩니다.</div>
        `:`
        <div class="preview-controls">
          <div class="preview-control"><label><span>↔ 좌우 위치</span><span id="preview-x-value">${t.x}px</span></label><input type="range" min="-180" max="180" step="1" value="${t.x}" oninput="updateShopPreviewTransform('${item.id}','x',this.value)"></div>
          <div class="preview-control"><label><span>↕ 위아래 위치</span><span id="preview-y-value">${t.y}px</span></label><input type="range" min="-220" max="180" step="1" value="${t.y}" oninput="updateShopPreviewTransform('${item.id}','y',this.value)"></div>
          <div class="preview-control"><label><span>🔍 크기</span><span id="preview-scale-value">${t.scale}%</span></label><input type="range" min="8" max="180" step="1" value="${t.scale}" oninput="updateShopPreviewTransform('${item.id}','scale',this.value)"></div>
          <div class="preview-control"><label><span>◐ 투명도</span><span id="preview-opacity-value">${t.opacity}%</span></label><input type="range" min="0" max="100" step="1" value="${t.opacity}" oninput="updateShopPreviewTransform('${item.id}','opacity',this.value)"></div>
          <div class="preview-control"><label><span>↻ 각도</span><span id="preview-rotate-value">${t.rotate || 0}°</span></label><input type="range" min="-180" max="180" step="1" value="${t.rotate || 0}" oninput="updateShopPreviewTransform('${item.id}','rotate',this.value)"></div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:8px"><button class="btn-pixel-white" onclick="resetShopPreviewTransform('${item.id}')">↺ 위치 초기화</button><button class="btn-pixel-black" onclick="savePreviewPosition('${item.id}')">💾 이 위치 저장</button></div>`}
      </div>`;
    }
    function savePreviewPosition(id){
      const item=getShopItem(id); if(!item) return;
      state.userData.shop.transforms = state.userData.shop.transforms || {};
      state.userData.shop.transforms[id] = {...getPreviewTransform(item)};
      saveUserData();
      alert('이 위치를 저장했습니다.');
    }
    function setShopCategory(category){state.shopCategory=category;state.shopPreviewItemId=null;render()}

    function buyShopItem(id){const item=getShopItem(id);if(!item)return;const s=getCharSchoolId();if(item.school!=='all'&&item.school!==s)return alert('이 아이템은 현재 캐릭터의 학교에서는 사용할 수 없습니다.');if(state.userData.shop.ownedItems.includes(id))return;if(state.userData.shop.tickets<item.price)return alert(`응원 티켓이 부족합니다. ${item.price}장이 필요합니다.`);state.userData.shop.tickets-=item.price;state.userData.shop.ownedItems.push(id);state.userData.shop.ownedItems=Array.from(new Set(state.userData.shop.ownedItems));saveUserData();render()}
    function equipShopItem(id){const item=getShopItem(id);if(!item||!state.userData.shop.ownedItems.includes(id))return;const s=getCharSchoolId();if(item.school!=='all'&&item.school!==s)return alert('현재 캐릭터에게 장착할 수 없는 학교 전용 아이템입니다.');const slot=item.type==='accessory'?item.slot:item.type;state.userData.shop.equipped[slot]=id;state.userData.shop.transforms=state.userData.shop.transforms||{};state.userData.shop.transforms[id]={...getPreviewTransform(item)};saveUserData();render()}
    function unequipShopItem(id){const item=getShopItem(id);if(!item)return;const slot=item.type==='accessory'?item.slot:item.type;if(state.userData.shop.equipped[slot]===id){state.userData.shop.equipped[slot]=null;saveUserData()}render()}

    function selectUser(u) {
      state.user = u;
      state.lang = null;
      state.entered = false;
      state.selectedDay = 'all';
      state.tab = 'practice';
      render();
    }

    function selectLang(l) { state.lang = l; render(); }
    function selectChar(c) { state.char = c; render(); }

    async function enterGym() {
      state.entered = true;
      await loadUserData();
      const lName = state.lang === 'ja' ? '일본어' : '영어';
      state.speech = getCharSpeech('enter', lName);

      initFlashcards();
      generateQuiz();
      generateHardQuiz();
      generateSpellQuiz();
      render();
    }

    function switchTab(t) {
      state.tab = t;
      if (t === 'practice') initFlashcards();
      if (t === 'quiz') generateQuiz();
      if (t === 'hard') generateHardQuiz();
      if (t === 'spell') generateSpellQuiz();
      render();
    }

    function onDayChange(val) {
      state.selectedDay = val;
      if (state.tab === 'practice') initFlashcards();
      if (state.tab === 'quiz') generateQuiz();
      if (state.tab === 'hard') generateHardQuiz();
      if (state.tab === 'spell') generateSpellQuiz();
      render();
    }

    function feedPartner() {
      if (state.userData.coins < CARE_COSTS.food) return alert(`${(CHAR_META[state.char] || CHAR_META.kageyama).name}에게 ${CHAR_META[state.char].food}을(를) 주려면 ${CARE_COSTS.food}코인이 필요합니다.`);
      state.userData.coins -= CARE_COSTS.food;
      state.userData.satisfaction = Math.min(4, state.userData.satisfaction + 1);
      state.mood = 'happy'; state.speech = getCharSpeech('food'); saveUserData(); render();
    }

    function actionPartner() {
      if (state.userData.coins < CARE_COSTS.train) return alert(`${CHAR_META[state.char].act}에는 ${CARE_COSTS.train}코인이 필요합니다.`);
      state.userData.coins -= CARE_COSTS.train;
      state.userData.stamina = Math.min(4, state.userData.stamina + 1);
      state.mood = 'happy'; state.speech = getCharSpeech('train'); saveUserData(); render();
    }

    function toggleFlashcardMeaning() { state.fcShowMeaning = !state.fcShowMeaning; render(); }
    function prevFlashcard() { if (state.fcIdx > 0) { state.fcIdx--; state.fcShowMeaning = false; render(); } }
    function nextFlashcard() {
      const list = getFilteredVocab();
      if (state.fcIdx < list.length - 1) { state.fcIdx++; state.fcShowMeaning = false; render(); }
    }
    function shuffleFlashcards() {
      initFlashcards();
      state.speech = getCharSpeech('shuffle');
      render();
    }

    function addCurrentPracticeWord(id) {
      if (!id) return;
      if (!state.userData.myVocabIds.includes(id)) {
        state.userData.myVocabIds.push(id);
        state.userData.myVocabIds = Array.from(new Set(state.userData.myVocabIds));
        state.speech = getCharSpeech('saved'); saveUserData();
      }
      render();
    }

    function handleQuizOpt(opt) {
      if (state.quizAnswered) return;
      const q = state.quizQuestions[state.quizIdx];
      state.quizSelectedOpt = opt;
      state.quizAnswered = true;
      const isCorr = (opt === q.cAns);
      if (isCorr) {
        state.quizScore.correct++;
        state.mood = 'happy';
        state.speech = getCharSpeech('quizCorrect');
      } else {
        if (!state.quizScore.wrongIds.includes(q.id)) state.quizScore.wrongIds.push(q.id);
        state.mood = 'angry';
        state.speech = getCharSpeech('quizWrong');
      }
      render();
    }

    function nextQuiz() {
      if (state.quizIdx < state.quizQuestions.length - 1) {
        state.quizIdx++;
        state.quizAnswered = false;
        state.quizSelectedOpt = null;
      } else {
        state.quizScore.finished = true;
        const reward = calculateTestReward('quiz', state.quizScore.correct);
        state.lastTicketGain = awardCheerTickets('quiz', state.quizScore.correct, state.quizScore.total);
        addRewards(reward.exp, reward.coins);
        if (state.quizScore.wrongIds.length > 0) {
          state.userData.myVocabIds = Array.from(new Set([...state.userData.myVocabIds, ...state.quizScore.wrongIds]));
          const tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
          state.quizScore.wrongIds.forEach(id => {
            state.userData.spacedRepData[id] = { stage: 1, nextDate: tmr.toISOString().split('T')[0] };
          });
        }
        state.userData.studyHistory.push({
          date: new Date().toISOString().split('T')[0],
          total: state.quizScore.total,
          correct: state.quizScore.correct
        });
        saveUserData();
      }
      render();
    }

    function submitHard() {
      if (state.hardAnswered) return;
      const input = document.getElementById('hard-input');
      const val = input.value.replace(/\s+/g, '').trim();
      if (!val) return;
      const q = state.hardQuestions[state.hardIdx];
      const meanings = q.meaning.split(/[,/~;]/).map(m => m.replace(/\s+/g, '').trim());
      const isCorr = meanings.some(m => m.includes(val) || val.includes(m));
      state.hardAnswered = true;
      state.hardIsCorrect = isCorr;
      if (isCorr) {
        state.hardScore.correct++;
        state.mood = 'happy';
        state.speech = getCharSpeech('hardCorrect');
      } else {
        if (!state.hardScore.wrongIds.includes(q.id)) state.hardScore.wrongIds.push(q.id);
        state.mood = 'angry';
        state.speech = getCharSpeech('hardWrong');
      }
      render();
    }

    function nextHard() {
      if (state.hardIdx < state.hardQuestions.length - 1) {
        state.hardIdx++;
        state.hardAnswered = false;
        state.hardIsCorrect = false;
      } else {
        state.hardScore.finished = true;
        const reward = calculateTestReward('hard', state.hardScore.correct);
        state.lastTicketGain = awardCheerTickets('hard', state.hardScore.correct, state.hardScore.total);
        addRewards(reward.exp, reward.coins);
        if (state.hardScore.wrongIds.length > 0) {
          state.userData.myVocabIds = Array.from(new Set([...state.userData.myVocabIds, ...state.hardScore.wrongIds]));
        }
        saveUserData();
      }
      render();
    }

    function submitSpell() {
      if (state.spellAnswered) return;
      const input = document.getElementById('spell-input');
      const val = input.value.trim().toLowerCase();
      if (!val) return;
      const q = state.spellQuestions[state.spellIdx];
      const isCorr = (val === q.word.trim().toLowerCase());
      state.spellAnswered = true;
      state.spellIsCorrect = isCorr;
      if (isCorr) {
        state.spellScore.correct++;
        state.mood = 'happy';
        state.speech = getCharSpeech('spellCorrect');
      } else {
        if (!state.spellScore.wrongIds.includes(q.id)) state.spellScore.wrongIds.push(q.id);
        state.mood = 'angry';
        state.speech = getCharSpeech('spellWrong');
      }
      render();
    }

    function nextSpell() {
      if (state.spellIdx < state.spellQuestions.length - 1) {
        state.spellIdx++;
        state.spellAnswered = false;
        state.spellIsCorrect = false;
      } else {
        state.spellScore.finished = true;
        const reward = calculateTestReward('spell', state.spellScore.correct);
        state.lastTicketGain = awardCheerTickets('spell', state.spellScore.correct, state.spellScore.total);
        addRewards(reward.exp, reward.coins);
        if (state.spellScore.wrongIds.length > 0) {
          state.userData.myVocabIds = Array.from(new Set([...state.userData.myVocabIds, ...state.spellScore.wrongIds]));
        }
        saveUserData();
      }
      render();
    }

    function addCustomWord() {
      const d = document.getElementById('c-day').value.trim();
      const w = document.getElementById('c-word').value.trim();
      const m = document.getElementById('c-meaning').value.trim();
      if (!d || !w || !m) return alert('내용을 모두 입력해주세요.');
      const newWord = { id: `c_${Date.now()}`, day: d, word: w, raw_word: w, speech_word: w, meaning: m };
      state.userData.customWords.push(newWord);
      saveUserData();
      alert('단어가 추가되었습니다!');
      render();
    }

    function removeMyVocab(id) {
      state.userData.myVocabIds = state.userData.myVocabIds.filter(v => v !== id);
      saveUserData(); render();
    }

    function passSpacedRep(id) {
      const intervals = { 1: 3, 2: 7, 3: 14, 4: 30, 5: 30 };
      const cur = state.userData.spacedRepData[id] || { stage: 1 };
      const nextStage = Math.min(5, cur.stage + 1);
      const d = new Date();
      d.setDate(d.getDate() + (intervals[nextStage] || 30));
      state.userData.spacedRepData[id] = { stage: nextStage, nextDate: d.toISOString().split('T')[0] };
      saveUserData(); render();
    }

    // 앱 초기화 및 CSV 데이터 자동 로딩
    (async function initApp() {
      await loadAllCSVData();
      render();
    })();
  </script>
</body>
</html>
