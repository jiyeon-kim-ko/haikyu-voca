    .bg-cover-wrapper {

      padding: 20px 10px;

    .minihompy-window {

      box-shadow: 0 20px 45px rgba(0,0,0,0.55);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .window-top-bar {
      background: #1E293B; color: #FFFFFF;
      padding: 12px 22px; display: flex; justify-content: space-between; align-items: center;
      font-weight: 800; font-size: 14.5px;
    }
    .window-dots { display: flex; gap: 6px; }
    .window-dots span { width: 12px; height: 12px; background: #FFFFFF; border-radius: 3px; }
    .window-url-bar {
      background: #F1F5F9; border-bottom: 2px solid #CBD5E1;
      padding: 8px 20px; font-family: monospace; font-size: 13px; color: #475569;
    }
    .minihompy-body {
      padding: 16px 18px; background: #F8FAFC;
      display: flex; gap: 12px; min-height: 640px; align-items: stretch;
    }
    .hompy-left-side {
      width: 270px; flex-shrink: 0; background: #FFFFFF;
      border: 2px solid #CBD5E1; border-radius: 16px;
      padding: 14px 12px; display: flex; flex-direction: column; gap: 9px;
    }
    .bgm-widget-box {
      background: #F1F5F9; border: 1.5px solid #CBD5E1; border-radius: 10px;
      padding: 6px 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .bgm-title { font-size: 11px; font-weight: 800; color: #1E293B; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 145px; }
    .stat-counter-bar {
      display: flex; justify-content: space-around; font-size: 11.5px; font-weight: 800;
      padding-bottom: 6px; border-bottom: 1.5px dashed #CBD5E1;
    }
    .stat-today { color: #EA580C; }
    .stat-total { color: #1E293B; }
    .mini-room-box {
      background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: 12px;
      padding: 10px 4px; text-align: center; position: relative;
    }
    .large-mii-frame {
      width: 115px; height: 115px; border-radius: 50%;
      border: 3px solid #1E293B; background: #FDE047;
      margin: 0 auto; overflow: hidden; display: flex; align-items: center; justify-content: center;
      box-shadow: 2px 2px 0px rgba(0,0,0,0.15);
    }
    .large-mii-frame img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    .left-emotion-badge {
      position: absolute; top: 18px; right: 40px;
      width: 32px; height: 32px; background: #FFFFFF; border: 2px solid #1E293B;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 16px; box-shadow: 1px 1px 0px #1E293B; animation: pop 0.3s ease-out; z-index: 10;
    }
    @keyframes pop { 0%{transform:scale(0.3);} 70%{transform:scale(1.2);} 100%{transform:scale(1);} }
    .char-spec-box {
      background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: 10px;
      padding: 8px 10px; font-size: 11.5px; text-align: left; line-height: 1.4;
    }
    .spec-item { color: #64748B; font-weight: 700; }
    .spec-val { color: #1E293B; font-weight: 800; }
    .streak-week-box {
      display: flex; justify-content: space-between; background: #F8FAFC;
      border: 1.5px solid #E2E8F0; border-radius: 10px; padding: 6px 8px;
    }
    .streak-day-item { text-align: center; }
    .streak-day-name { font-size: 10px; color: #64748B; font-weight: 800; }
    .streak-day-icon { font-size: 12px; margin-top: 2px; }
    .streak-today-tag { font-size: 9px; color: #EA580C; font-weight: 900; }
    .stamina-progress-bg {
      width: 100%; height: 8px; background: #E2E8F0; border-radius: 6px;
      overflow: hidden; margin-top: 4px; border: 1px solid #CBD5E1;
    }
    .stamina-progress-fill { height: 100%; background: #EA580C; transition: width 0.3s ease; }
    .hompy-nav-tabs {
      width: 78px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;
    }
    .btn-tab-menu {

    }

      background: #F8FAFC; border: 2.5px solid #1E293B; border-radius: 16px;

      align-items: center; padding: 25px; text-align: center; box-shadow: 3px 3px 0px #1E293B; cursor: pointer;
    }
    .option-btn {

    .option-btn:hover { background: #F1F5F9; border-color: #1E293B; }
    .btn-correct { background-color: #1E293B !important; color: #FFFFFF !important; }
    .btn-wrong { background-color: #FEE2E2 !important; color: #DC2626 !important; }
    .btn-pixel-black {
      background: #1E293B; border: 2px solid #1E293B; color: #FFFFFF;
      font-weight: 800; border-radius: 8px; padding: 8px 16px; cursor: pointer;
    }
    .btn-pixel-black:hover { background: #EA580C; border-color: #EA580C; color: #FFFFFF; }
    .btn-pixel-white {
      background: #FFFFFF; border: 2px solid #1E293B; color: #1E293B;
      font-weight: 800; border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer;
    }
    .btn-pixel-white:hover { background: #F1F5F9; }
    .word-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #E2E8F0; }
    .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .history-table th { background: #F1F5F9; padding: 8px; font-size: 12.5px; border-bottom: 2px solid #CBD5E1; text-align: center; }
    .history-table td { padding: 10px 8px; border-bottom: 1px solid #E2E8F0; font-size: 13px; text-align: center; }

      box-shadow: 8px 8px 0px rgba(0,0,0,0.6); text-align: center;
    }
    .char-select-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
    .char-radio-card {

      background: #FFFFFF; transition: all 0.15s ease; text-align: center;
    }
    .char-radio-card:hover { border-color: #1E293B; transform: translateY(-2px); }
    .char-radio-card.active { border-color: #EA580C; background: #FFF7ED; box-shadow: 2px 2px 0px #EA580C; }
    .mini-avatar-circle { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid #1E293B; background: #FDE047; margin: 0 auto 4px auto; overflow: hidden; display: flex; align-items: center; justify-content: center; }

    .lang-choice-card {

      align-items: center; justify-content: space-between; font-weight: 900; font-size: 18px;

    }
    .lang-choice-card:hover {
      background: #FFF7ED; border-color: #EA580C; transform: translateY(-3px);

      background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;

    }

      padding: 24px; max-width: 450px; width: 90%; box-shadow: 6px 6px 0px #1E293B;

</head>

    function getStorageKey() {

    function loadState() {
      const saved = localStorage.getItem(getStorageKey());
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          state.user_exp = parsed.user_exp || 0;
          state.user_coins = parsed.user_coins !== undefined ? parsed.user_coins : 200;
          state.satisfaction = parsed.satisfaction || 3;
          state.cur_stamina = parsed.cur_stamina || 3;

          state.custom_words_db = parsed.custom_words_db || [];
        } catch(e) {}
      } else {
        state.user_exp = 0;
        state.user_coins = 200;
        state.satisfaction = 3;
        state.cur_stamina = 3;
        state.my_vocab_ids = [];
        state.study_history = [];
        state.attendance_dates = [];
        state.spaced_rep_data = {};
        state.custom_words_db = [];
      }
      recordTodayAttendance();

    function saveState() {
      const payload = {
        user_exp: state.user_exp,
        user_coins: state.user_coins,
        satisfaction: state.satisfaction,
        cur_stamina: state.cur_stamina,
        my_vocab_ids: state.my_vocab_ids,
        study_history: state.study_history,
        attendance_dates: state.attendance_dates,
        spaced_rep_data: state.spaced_rep_data,
        custom_words_db: state.custom_words_db
      };
      localStorage.setItem(getStorageKey(), JSON.stringify(payload));
    }

    function recordTodayAttendance() {
      const today = new Date().toISOString().split('T')[0];
      if (!state.attendance_dates.includes(today)) {
        state.attendance_dates.push(today);
        saveState();
      }
    }

    function getCharLevelInfo(exp) {
      let lvl = 1;
      for (let i = 0; i < EXP_THRESHOLDS.length; i++) {
        if (exp >= EXP_THRESHOLDS[i]) lvl = i + 1;
      }
      if (lvl > 10) lvl = 10;
      const nextThresh = lvl < 10 ? EXP_THRESHOLDS[lvl] : EXP_THRESHOLDS[9];
      const currThresh = EXP_THRESHOLDS[lvl - 1];
      return {
        level: lvl,
        rem_exp: exp - currThresh,
        req_exp: nextThresh - currThresh,
        title: STAGE_TITLES[lvl - 1]
      };
    }

    function addRewards(expGain, coinGain) {
      const oldLvl = getCharLevelInfo(state.user_exp).level;
      state.user_exp += expGain;
      state.user_coins += coinGain;
      const newLvl = getCharLevelInfo(state.user_exp).level;
      if (newLvl > oldLvl) {
        alert(`🎉 파트너 승격! [Lv.${newLvl} ${STAGE_TITLES[newLvl-1]}]`);
      }
      saveState();
      render();
    }

    function getAllVocab() {
      const base = state.lang === 'ja' ? DEFAULT_JA_VOCAB : DEFAULT_EN_VOCAB;
      return [...base, ...(state.custom_words_db || [])];
    }

    function getDayCategories() {
      const db = getAllVocab();
      const setDays = new Set(db.map(d => d.day));
      return ["all", ...Array.from(setDays)];
    }

    function getFilteredVocab(selectedDay) {
      const db = getAllVocab();
      if (!selectedDay || selectedDay === "all") return db;
      return db.filter(d => d.day === selectedDay);
    }

    // --- 음성 스트리밍 및 재생 ---
    function playAudio(text, accent) {
      const clean = text.split('(')[0].replace(/[^a-zA-Z0-9\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF]/g, '').trim();
      if (!clean) return;

      if (accent === 'JA') {
        const audio = document.getElementById('voca-audio-player');
        audio.src = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(clean)}&le=jap`;
        audio.play().catch(() => {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(clean);
            u.lang = 'ja-JP';
            window.speechSynthesis.speak(u);
          }
        });
        return;
      }

      let url = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(clean)}&type=2`;
      if (accent === 'UK') url = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(clean)}&type=1`;
      else if (accent === 'AU') url = `https://api.dictionaryapi.dev/media/pronunciations/en/${encodeURIComponent(clean.toLowerCase())}-au.mp3`;

      const audio = document.getElementById('voca-audio-player');
      audio.src = url;
      audio.onerror = () => {
        if (accent === 'AU') {
          audio.src = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(clean)}&type=1`;
          audio.play().catch(()=>{});
        }
      };
      audio.play().catch(()=>{});
    }

    function toggleBGM() {
      const bgm = document.getElementById('bgm-player');
      const btn = document.getElementById('bgm_play_btn');
      if (!state.bgm_playing) {
        bgm.play().then(() => {
          state.bgm_playing = true;
          if (btn) btn.innerText = "⏸ 정지";
        }).catch(() => {
          alert("폴더에 bgm.mp3 음원 파일이 있는지 확인해주세요!");
        });
      } else {
        bgm.pause();
        state.bgm_playing = false;
        if (btn) btn.innerText = "▶ 재생";
      }
    }

              ${Object.keys(CHAR_META).map(cKey => `
                <div class="char-radio-card ${state.char === cKey ? 'active' : ''}" onclick="selectChar('${cKey}')">
                  <div class="mini-avatar-circle"><img src="${CHAR_META[cKey].img}" alt="${CHAR_META[cKey].name}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 100 100\\'><text y=\\'50%\\' x=\\'50%\\' dominant-baseline=\\'central\\' text-anchor=\\'middle\\' font-size=\\'40\\'>🏐</text></svg>'"></div>
                  <div style="font-size: 12px; font-weight: 900; margin-top: 2px;">${CHAR_META[cKey].name.split(' ')[0]}</div>
                </div>
              `).join('')}
            </div>
            <button class="btn-pixel-black" style="width: 100%; padding: 14px; font-size: 16px; margin-top: 10px;" onclick="enterGym()">체육관 문 열기 (Enter) ➔</button>
          </div>
        `;
        return;
      }

      // [3단계] 메인 미니홈피 화면
      const char = CHAR_META[state.char];
      const lvlInfo = getCharLevelInfo(state.user_exp);
      const expPct = lvlInfo.req_exp > 0 ? Math.min(100, Math.round((lvlInfo.rem_exp / lvlInfo.req_exp) * 100)) : 100;
      
      let totQ = 0, totC = 0;
      state.study_history.forEach(h => { totQ += h.total || 0; totC += h.correct || 0; });
      const accPct = totQ > 0 ? Math.round((totC / totQ) * 100) : 100;

      const now = new Date();
      const currDay = now.getDay();
      const monOffset = currDay === 0 ? 6 : currDay - 1;
      const monday = new Date(now);
      monday.setDate(now.getDate() - monOffset);
      const weekDays = ['월', '화', '수', '목', '금', '토', '일'];
      const todayStr = now.toISOString().split('T')[0];

      const streakHtml = weekDays.map((dName, idx) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + idx);
        const dStr = d.toISOString().split('T')[0];
        const isAtt = state.attendance_dates.includes(dStr);
        const isToday = dStr === todayStr;
        return `
          <div class="streak-day-item">
            <div class="streak-day-name">${dName}</div>
            <div class="streak-day-icon">${isAtt ? '🏐' : '▫️'}</div>
            ${isToday ? '<div class="streak-today-tag">오늘</div>' : ''}
          </div>
        `;
      }).join('');

      const moodEmoji = state.mood === 'happy' ? '🔥' : (state.mood === 'angry' ? '💢' : '✨');

      root.innerHTML = `
        <div class="minihompy-window">
          <div class="window-top-bar">
            <span>飛べ 카라스노 고교 배구부 체육관 [${state.lang === 'ja' ? '🇯🇵 일본어' : '🇺🇸 영어'}] : ${char.name} 🏐</span>
            <div class="window-dots"><span></span><span></span><span></span></div>
          </div>
          <div class="window-url-bar">
            http://karasuno.gym.club/?lang=${state.lang}&char=${state.char}&level=${lvlInfo.level}
          </div>
          
          <div class="minihompy-body">
            <!-- 좌측 프로필 사이드바 -->
            <div class="hompy-left-side">
              <div class="bgm-widget-box">
                <span class="bgm-title">🎵 Haikyu!! OST (bgm.mp3)</span>
                <button id="bgm_play_btn" class="btn-pixel-black" style="padding: 2px 8px; font-size: 10px;" onclick="toggleBGM()">${state.bgm_playing ? '⏸ 정지' : '▶ 재생'}</button>
              </div>
              
              <div class="stat-counter-bar">
                <span class="stat-today">TODAY ${totC}</span>
                <span class="stat-total">TOTAL ${totQ}</span>
              </div>
              
              <div class="mini-room-box">
                <div style="font-size: 11px; font-weight: 800; color: #64748B; margin-bottom: 4px;">GYMNASIUM 🏐</div>
                <div class="large-mii-frame">
                  <img src="${char.img}" alt="${char.name}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 100 100\\'><text y=\\'50%\\' x=\\'50%\\' dominant-baseline=\\'central\\' text-anchor=\\'middle\\' font-size=\\'40\\'>🏐</text></svg>'">
                </div>
                <div class="left-emotion-badge">${moodEmoji}</div>
              </div>
              
              <div class="char-spec-box">
                <div><span class="spec-item">소속: </span><span class="spec-val">${char.school}</span> | <span class="spec-item">등번호: </span><span class="spec-val">#${char.num}</span></div>
                <div><span class="spec-item">포지션: </span><span class="spec-val">${char.pos}</span></div>
                <div style="color: #EA580C; font-weight: 800; margin-top: 4px; font-style: italic;">"${char.motto}"</div>
              </div>
              
              <div class="streak-week-box">${streakHtml}</div>
              
              <div>
                <div style="display:flex; justify-content:space-between; font-size: 11px; font-weight: 800; color: #475569;">
                  <span>토스 정확도</span><span>${accPct}%</span>
                </div>
                <div class="stamina-progress-bg"><div class="stamina-progress-fill" style="width: ${accPct}%;"></div></div>
                
                <div style="display:flex; justify-content:space-between; font-size: 11px; font-weight: 800; color: #475569; margin-top: 6px;">
                  <span>Lv.${lvlInfo.level} 승격 EXP</span><span>${lvlInfo.rem_exp}/${lvlInfo.req_exp}</span>
                </div>
                <div class="stamina-progress-bg"><div class="stamina-progress-fill" style="width: ${expPct}%; background: #3B82F6;"></div></div>
              </div>
              
              <div style="display: flex; gap: 4px; margin-top: 4px;">
                <button class="btn-pixel-white" style="flex: 1; padding: 4px; font-size: 10.5px;" onclick="feedCare()">🍙 ${char.food}</button>
                <button class="btn-pixel-white" style="flex: 1; padding: 4px; font-size: 10.5px;" onclick="actionCare()">🏐 ${char.act}</button>
                <button class="btn-pixel-black" style="flex: 0.8; padding: 4px; font-size: 10.5px;" onclick="openShop()">🏪 매점</button>
              </div>
              <div style="margin-top: 2px; display: flex; gap: 4px;">
                <button class="btn-pixel-white" style="flex: 1; padding: 4px; font-size: 11px;" onclick="changeChar()">🔄 선수 교체</button>
                <button class="btn-pixel-white" style="flex: 1; padding: 4px; font-size: 11px;" onclick="changeLang()">🌐 언어 변경</button>
              </div>
            </div>
            
            <!-- 세로 메뉴 탭 -->
            <div class="hompy-nav-tabs">
              <button class="btn-tab-menu ${state.tab === 'practice' ? 'active' : ''}" onclick="switchTab('practice')">연습</button>
              <button class="btn-tab-menu ${state.tab === 'quiz' ? 'active' : ''}" onclick="switchTab('quiz')">객관식</button>
              <button class="btn-tab-menu ${state.tab === 'hard' ? 'active' : ''}" onclick="switchTab('hard')">주관식</button>
              ${state.lang === 'en' ? `<button class="btn-tab-menu ${state.tab === 'spell' ? 'active' : ''}" onclick="switchTab('spell')">스펠링</button>` : ''}
              <button class="btn-tab-menu ${state.tab === 'custom' ? 'active' : ''}" onclick="switchTab('custom')">단어장</button>
              <button class="btn-tab-menu ${state.tab === 'spaced' ? 'active' : ''}" onclick="switchTab('spaced')">복습</button>
              <button class="btn-tab-menu ${state.tab === 'history' ? 'active' : ''}" onclick="switchTab('history')">기록</button>
            </div>
            
            <!-- 중앙 학습 본문 영역 -->
            <div class="hompy-main-content">
              <div class="main-speech-bubble">
                <span>💬 </span><span>${state.speech}</span>
              </div>
              <div id="tab-content-area" style="flex-grow: 1; display: flex; flex-direction: column;"></div>
            </div>
          </div>
        </div>
      `;

      renderTabContent();
    }

    function selectLang(l) { state.lang = l; state.entered = false; render(); }
    function selectChar(c) { state.char = c; render(); }
    function changeLang() { state.lang = null; state.entered = false; render(); }
    function changeChar() { state.entered = false; render(); }

    function enterGym() {
      state.entered = true;
      loadState();
      const langName = state.lang === 'ja' ? '일본어' : '토익';
      if (state.char === 'osamu') state.speech = `츠무 녀석보다 ${langName} 잘 외우면 갓 지은 주먹밥 만들어줄게.`;
      else if (state.char === 'miya') state.speech = `내 토스 치고 싶으면 ${langName} 단어 억수로 퍼펙트하게 외워와라!`;
      else if (state.char === 'oikawa') state.speech = `재능은 꽃피우는 것, 센스는 갈고닦는 것! ${langName} 힘내보자구~`;
      else state.speech = `내가 있으면 넌 최강이다! 오늘 ${langName} 단어 훈련 시작이다.`;
      
      initFlashcards();
      initQuiz();
      initHard();
      if (state.lang === 'en') initSpell();
      render();
    }

    function switchTab(t) {
      state.tab = t;
      if (t === 'practice') initFlashcards();
      else if (t === 'quiz') initQuiz();
      else if (t === 'hard') initHard();
      else if (t === 'spell') initSpell();
      render();
    }

    // --- 탭별 렌더러 함수 ---
    function renderTabContent() {
      const area = document.getElementById('tab-content-area');
      if (!area) return;

      const isJa = state.lang === 'ja';
      const days = getDayCategories();

      // 1. 연습 (플래시카드)
      if (state.tab === 'practice') {
        const list = state.fc_shuffled;
        if (list.length === 0) {
          area.innerHTML = `<p style="color:#64748B; text-align:center; margin-top:40px;">단어가 없습니다.</p>`;
          return;
        }
        const item = list[state.fc_idx] || list[0];
        const audioBtn = isJa
          ? `<button class="btn-pixel-white" onclick="playAudio('${item.raw_word}', 'JA')">🔊 일본어 발음 듣기</button>`
          : `<div style="display:flex; gap:6px;">
              <button class="btn-pixel-white" onclick="playAudio('${item.raw_word}', 'US')">US</button>
              <button class="btn-pixel-white" onclick="playAudio('${item.raw_word}', 'UK')">UK</button>
              <button class="btn-pixel-white" onclick="playAudio('${item.raw_word}', 'AU')">AU</button>
             </div>`;

        area.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <select class="select-styled" onchange="changeFCDay(this.value)" style="width: 180px;">
              ${days.map(d => `<option value="${d}" ${state.fc_selected_day === d ? 'selected' : ''}>${d === 'all' ? '전체 선택' : d}</option>`).join('')}
            </select>
            <button class="btn-pixel-white" onclick="shuffleFC()">🔀 셔플</button>
          </div>
          <div class="flashcard-box" onclick="toggleFCMeaning()">
            <div style="font-size: 32px; font-weight: 900; color: #1E293B;">${item.word}</div>
            <div style="margin: 10px 0;" onclick="event.stopPropagation()">${audioBtn}</div>
            ${state.fc_show_meaning 
              ? `<div style="font-size: 20px; font-weight: 800; color: #EA580C; margin-top: 10px;">${item.meaning}</div>`
              : `<div style="font-size: 13px; color: #94A3B8; margin-top: 10px;">[카드를 탭하여 뜻 확인]</div>`}
          </div>
          <div style="display: flex; justify-content: center; gap: 10px; margin-top: 15px;">
            <button class="btn-pixel-white" onclick="prevFC()" ${state.fc_idx === 0 ? 'disabled' : ''}>◀ 이전</button>
            <button class="btn-pixel-black" onclick="toggleFCMeaning()">${state.fc_show_meaning ? '단어만 보기' : '뜻 보기'}</button>
            <button class="btn-pixel-white" onclick="nextFC()" ${state.fc_idx === list.length - 1 ? 'disabled' : ''}>다음 ▶</button>
          </div>
        `;
      } 
      // 2. 객관식 퀴즈
      else if (state.tab === 'quiz') {
        if (state.quiz_score.finished) {
          const rate = state.quiz_score.total > 0 ? Math.round((state.quiz_score.correct / state.quiz_score.total) * 100) : 100;
          area.innerHTML = `
            <div style="text-align: center; padding: 40px 20px;">
              <h3 style="font-weight: 900;">🏐 1세트 객관식 결과</h3>
              <p style="font-size: 16px; color: #4B5563; margin: 10px 0;">성공률: ${rate}% (${state.quiz_score.correct}/${state.quiz_score.total})</p>
              <h4 style="color: #EA580C; font-weight: 900;">+${state.quiz_score.correct * 4} EXP | +${state.quiz_score.correct * 5} 🪙 획득!</h4>
              <button class="btn-pixel-black" style="margin-top: 15px;" onclick="initQuiz(); render();">다시 시작하기 ➔</button>
            </div>
          `;
          return;
        }
        const q = state.quiz_list[state.quiz_idx];
        if (!q) { area.innerHTML = `<p>문제가 없습니다.</p>`; return; }
        
        area.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <select class="select-styled" onchange="changeQuizDay(this.value)" style="width: 150px;">
              ${days.map(d => `<option value="${d}">${d === 'all' ? '전체 선택' : d}</option>`).join('')}
            </select>
            <span style="font-weight: 800;">문제: ${state.quiz_idx + 1} / ${state.quiz_list.length}</span>
          </div>
          <div style="text-align: center; padding: 10px 0;">
            <h2 style="font-weight: 900; color: #1E293B; margin: 5px 0 15px 0;">${q.word}</h2>
          </div>
          <div>
            ${q.opts.map((opt, i) => {
              let cls = "option-btn";
              if (state.quiz_answered) {
                if (opt === q.c_ans) cls += " btn-correct";
                else if (opt === state.quiz_selected_opt) cls += " btn-wrong";
              }
              return `<button class="${cls}" onclick="handleQuizOpt('${opt}')">${i + 1}.  ${opt}</button>`;
            }).join('')}
          </div>
          ${state.quiz_answered ? `<button class="btn-pixel-black" style="float: right; margin-top: 5px;" onclick="nextQuiz()">${state.quiz_idx < state.quiz_list.length - 1 ? '다음 문제 ➔' : '세트 결과 확인 ➔'}</button>` : ''}
        `;
      } 
      // 3. 주관식 쓰기
      else if (state.tab === 'hard') {
        if (state.hard_score.finished) {
          area.innerHTML = `
            <div style="text-align: center; padding: 40px 20px;">
              <h3 style="font-weight: 900;">🔥 주관식 Hard 세트 완료!</h3>
              <p style="font-size: 16px; color: #4B5563; margin: 10px 0;">적중: ${state.hard_score.correct} / ${state.hard_score.total}</p>
              <h4 style="color: #EA580C; font-weight: 900;">+${state.hard_score.correct * 7} EXP | +${state.hard_score.correct * 10} 🪙 획득!</h4>
              <button class="btn-pixel-black" style="margin-top: 15px;" onclick="initHard(); render();">다시 시작하기 ➔</button>
            </div>
          `;
          return;
        }
        const q = state.hard_list[state.hard_idx];
        if (!q) { area.innerHTML = `<p>문제가 없습니다.</p>`; return; }
        
        area.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span style="font-weight: 800;">문제: ${state.hard_idx + 1} / ${state.hard_list.length}</span>
          </div>
          <div style="text-align: center; padding: 15px 0;">
            <h2 style="font-weight: 900; color: #1E293B; margin: 0 0 10px 0;">${q.word}</h2>
            <p style="color: #64748B; font-size: 13px;">한국어 뜻을 직접 입력하세요.</p>
          </div>
          <div style="max-width: 440px; margin: 0 auto; width: 100%;">
            <input type="text" id="hard-input" class="select-styled" style="width: 100%; margin-bottom: 10px;" placeholder="한국어 뜻 입력" ${state.hard_answered ? 'disabled' : ''}>
            ${!state.hard_answered 
              ? `<button class="btn-pixel-black" style="width: 100%;" onclick="submitHard()">정답 확인</button>`
              : `<div>
                  <div style="background:${state.hard_is_correct ? '#DCFCE7' : '#FEE2E2'}; color:${state.hard_is_correct ? '#166534' : '#991B1B'}; padding:10px; border-radius:8px; font-weight:bold; text-align:center;">
                    ${state.hard_is_correct ? '● 정답입니다!' : '✕ 정답: ' + q.meaning}
                  </div>
                  <button class="btn-pixel-black" style="width: 100%; margin-top: 10px;" onclick="nextHard()">${state.hard_idx < state.hard_list.length - 1 ? '다음 문제 ➔' : '세트 결과 확인 ➔'}</button>
                </div>`}
          </div>
        `;
      } 
      // 4. 스펠링 게임 (영어 모드 전용)
      else if (state.tab === 'spell' && state.lang === 'en') {
        if (state.spell_score.finished) {
          area.innerHTML = `
            <div style="text-align: center; padding: 40px 20px;">
              <h3 style="font-weight: 900;">🔤 스펠링 게임 완료!</h3>
              <p style="font-size: 16px; color: #4B5563; margin: 10px 0;">적중: ${state.spell_score.correct} / ${state.spell_score.total}</p>
              <h4 style="color: #EA580C; font-weight: 900;">+${state.spell_score.correct * 6} EXP | +${state.spell_score.correct * 8} 🪙 획득!</h4>
              <button class="btn-pixel-black" style="margin-top: 15px;" onclick="initSpell(); render();">다시 시작하기 ➔</button>
            </div>
          `;
          return;
        }
        const q = state.spell_list[state.spell_idx];
        if (!q) { area.innerHTML = `<p>문제가 없습니다.</p>`; return; }
        
        area.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span style="font-weight: 800;">문제: ${state.spell_idx + 1} / ${state.spell_list.length}</span>
          </div>
          <div style="text-align: center; padding: 10px 0;">
            <h4 style="font-weight: 800; color: #4B5563; margin: 0;">${q.meaning}</h4>
            <div style="font-family: monospace; font-size: 30px; letter-spacing: 4px; font-weight: 900; margin: 12px 0;">${q.masked_word}</div>
          </div>
          <div style="max-width: 440px; margin: 0 auto; width: 100%;">
            <input type="text" id="spell-input" class="select-styled" style="width: 100%; margin-bottom: 10px;" placeholder="완성된 영단어 입력" ${state.spell_answered ? 'disabled' : ''}>
            ${!state.spell_answered 
              ? `<button class="btn-pixel-black" style="width: 100%;" onclick="submitSpell()">철자 제출</button>`
              : `<div>
                  <div style="background:${state.spell_is_correct ? '#DCFCE7' : '#FEE2E2'}; color:${state.spell_is_correct ? '#166534' : '#991B1B'}; padding:10px; border-radius:8px; font-weight:bold; text-align:center;">
                    ${state.spell_is_correct ? '● 정답: ' + q.word : '✕ 정답: ' + q.word}
                  </div>
                  <button class="btn-pixel-black" style="width: 100%; margin-top: 10px;" onclick="nextSpell()">${state.spell_idx < state.spell_list.length - 1 ? '다음 문제 ➔' : '세트 결과 확인 ➔'}</button>
                </div>`}
          </div>
        `;
      } 
      // 5. 오답 단어장
      else if (state.tab === 'custom') {
        const all = getAllVocab();
        const myVocabs = all.filter(v => state.my_vocab_ids.includes(v.id));
        
        area.innerHTML = `
          <h4 style="font-weight: 900; margin-top: 0; color: #1E293B;">➕ 나만의 단어 추가</h4>
          <div class="custom-input-row">
            <input type="text" id="new-c-day" placeholder="${isJa ? '품사' : 'Day'}" style="width: 20%;">
            <input type="text" id="new-c-word" placeholder="${isJa ? '일본어 단어' : '영어 단어'}" style="width: 35%;">
            <input type="text" id="new-c-meaning" placeholder="한국어 뜻" style="width: 45%;">
            <button class="btn-pixel-black" style="height: 38px;" onclick="addCustomWord()">추가 ➕</button>
          </div>
          <hr style="border-color: #E2E8F0; margin: 15px 0;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h4 style="font-weight: 900; margin: 0; color: #1E293B;">📑 내 오답 단어장 (${myVocabs.length}개)</h4>
            <button class="btn-pixel-white" onclick="downloadCSV()">CSV 저장</button>
          </div>
          <div style="max-height: 250px; overflow-y: auto; margin-top: 10px;">
            ${myVocabs.length === 0 
              ? `<p style="color: #94A3B8; text-align: center; padding: 25px;">저장된 오답이 없습니다.</p>`
              : myVocabs.map(v => `
                <div class="word-row">
                  <div>
                    <span style="font-weight: 800; color: #1E293B;">${v.word}</span>
                    <span style="color: #64748B; margin-left: 10px;">${v.meaning}</span>
                  </div>
                  <button class="btn-pixel-white" style="font-size: 11px;" onclick="removeMyVocab('${v.id}')">외웠다 ✔</button>
                </div>
              `).join('')}
          </div>
        `;
      } 
      // 6. 망각곡선 주기 복습
      else if (state.tab === 'spaced') {
        const today = new Date().toISOString().split('T')[0];
        const all = getAllVocab();
        const dueIds = Object.keys(state.spaced_rep_data).filter(id => state.spaced_rep_data[id].next_date <= today);
        const dueVocabs = all.filter(v => dueIds.includes(v.id));

        area.innerHTML = `
          <h4 style="font-weight: 900; margin-top: 0;">🧠 오늘의 망각 주기 복습 단어 (${dueVocabs.length}개)</h4>
          <div style="max-height: 380px; overflow-y: auto; margin-top: 10px;">
            ${dueVocabs.length === 0 
              ? `<p style="color: #94A3B8; text-align: center; padding: 40px;">오늘 복습할 단어가 없습니다! 🎉</p>`
              : dueVocabs.map(v => `
                <div class="word-row">
                  <div>
                    <span style="font-weight: 800;">${v.word}</span>
                    <span style="color: #64748B; margin-left: 10px;">${v.meaning}</span>
                  </div>
                  <button class="btn-pixel-black" style="font-size: 11px;" onclick="passSpaced('${v.id}')">복습완료 (+5 EXP)</button>
                </div>
              `).join('')}
          </div>
        `;
      } 
      // 7. 훈련 기록
      else if (state.tab === 'history') {
        area.innerHTML = `
          <h4 style="font-weight: 900; margin-top: 0;">📊 나의 훈련 통계</h4>
          <div style="max-height: 350px; overflow-y: auto;">
            ${state.study_history.length === 0 
              ? `<p style="color: #94A3B8; text-align: center; padding: 40px;">기록이 없습니다.</p>`
              : `
                <table class="history-table">
                  <thead><tr><th>날짜</th><th>푼 문제</th><th>성공</th><th>성공률</th></tr></thead>
                  <tbody>
                    ${state.study_history.slice().reverse().map(h => `
                      <tr>
                        <td>${h.date}</td>
                        <td>${h.total}문제</td>
                        <td>${h.correct}개</td>
                        <td>${h.total > 0 ? Math.round((h.correct / h.total) * 100) : 100}%</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              `}
          </div>
        `;
      }
    }

    // --- 플래시카드 이벤트 로직 ---
    function initFlashcards() {
      state.fc_shuffled = [...getFilteredVocab(state.fc_selected_day)];
      state.fc_idx = 0;
      state.fc_show_meaning = false;
    }
    function changeFCDay(d) {
      state.fc_selected_day = d;
      initFlashcards();
      render();
    }
    function shuffleFC() {
      state.fc_shuffled.sort(() => Math.random() - 0.5);
      state.fc_idx = 0;
      state.fc_show_meaning = false;
      state.speech = "순서 뒤섞었다. 요령 피우지 말고 정직하게 외워라.";
      render();
    }
    function toggleFCMeaning() { state.fc_show_meaning = !state.fc_show_meaning; render(); }
    function prevFC() { if (state.fc_idx > 0) { state.fc_idx--; state.fc_show_meaning = false; render(); } }
    function nextFC() {
      if (state.fc_idx < state.fc_shuffled.length - 1) {
        state.fc_idx++;
        state.fc_show_meaning = false;
        addRewards(1, 0);
      }
    }

    // --- 객관식 퀴즈 이벤트 로직 ---
    function initQuiz() {
      const list = [...getFilteredVocab(state.fc_selected_day)].sort(() => Math.random() - 0.5);
      const all = getAllVocab();
      state.quiz_list = list.map(item => {
        const others = all.filter(o => o.id !== item.id);
        const wrongOpts = others.sort(() => Math.random() - 0.5).slice(0, 3).map(o => o.meaning);
        const opts = [item.meaning, ...wrongOpts].sort(() => Math.random() - 0.5);
        return { id: item.id, word: item.word, c_ans: item.meaning, opts: opts };
      });
      state.quiz_idx = 0;
      state.quiz_score = { correct: 0, total: state.quiz_list.length, finished: false, wrong_ids: [] };
      state.quiz_answered = false;
      state.quiz_selected_opt = null;
      state.mood = "normal";
    }
    function handleQuizOpt(opt) {
      if (state.quiz_answered) return;
      state.quiz_answered = true;
      state.quiz_selected_opt = opt;
      const q = state.quiz_list[state.quiz_idx];
      const isCorr = opt === q.c_ans;
      if (isCorr) {
        state.quiz_score.correct++;
        state.mood = "happy";
        state.speech = "나이스 샷! 코트에 남는 건 이긴 녀석뿐이다! 🔥";
      } else {
        state.quiz_score.wrong_ids.push(q.id);
        state.mood = "angry";
        state.speech = "보게에에에! 집중 안 하냐?! 오답노트 봐라! 💢";
      }
      render();
    }
    function nextQuiz() {
      if (state.quiz_idx < state.quiz_list.length - 1) {
        state.quiz_idx++;
        state.quiz_answered = false;
        state.quiz_selected_opt = null;
        render();
      } else {
        state.quiz_score.finished = true;
        addRewards(state.quiz_score.correct * 4, state.quiz_score.correct * 5);
        state.quiz_score.wrong_ids.forEach(id => {
          if (!state.my_vocab_ids.includes(id)) state.my_vocab_ids.push(id);
        });
        state.study_history.push({
          date: new Date().toISOString().split('T')[0],
          total: state.quiz_score.total,
          correct: state.quiz_score.correct
        });
        saveState();
        render();
      }
    }

    // --- 주관식 이벤트 로직 ---
    function initHard() {
      state.hard_list = [...getFilteredVocab(state.fc_selected_day)].sort(() => Math.random() - 0.5);
      state.hard_idx = 0;
      state.hard_score = { correct: 0, total: state.hard_list.length, finished: false, wrong_ids: [] };
      state.hard_answered = false;
      state.hard_is_correct = false;
      state.mood = "normal";
    }
    function submitHard() {
      const val = document.getElementById('hard-input').value.trim();
      if (!val) return;
      state.hard_answered = true;
      const q = state.hard_list[state.hard_idx];
      const meanings = q.meaning.split(/[,/~;]/).map(m => m.trim().replace(/\s/g, ''));
      const userVal = val.replace(/\s/g, '');
      const isCorr = meanings.some(m => m.includes(userVal) || userVal.includes(m));
      state.hard_is_correct = isCorr;
      if (isCorr) {
        state.hard_score.correct++;
        state.mood = "happy";
        state.speech = "주관식을 이렇게 딱 맞히네! 완벽하다! 🏐";
      } else {
        state.hard_score.wrong_ids.push(q.id);
        state.mood = "angry";
        state.speech = "직접 쓰려니까 손이 굳었나?! 오답노트 봐라! 💢";
      }
      render();
    }
    function nextHard() {
      if (state.hard_idx < state.hard_list.length - 1) {
        state.hard_idx++;
        state.hard_answered = false;
        render();
      } else {
        state.hard_score.finished = true;
        addRewards(state.hard_score.correct * 7, state.hard_score.correct * 10);
        state.hard_score.wrong_ids.forEach(id => {
          if (!state.my_vocab_ids.includes(id)) state.my_vocab_ids.push(id);
        });
        saveState();
        render();
      }
    }

    // --- 스펠링 이벤트 로직 ---
    function initSpell() {
      const list = [...getFilteredVocab(state.fc_selected_day)].sort(() => Math.random() - 0.5);
      state.spell_list = list.map(item => {
        const chars = item.word.split('');
        const maskCount = Math.max(1, Math.round(chars.length * 0.4));
        const masked = [...chars];
        for (let i = 0; i < maskCount; i++) {
          const randIdx = Math.floor(Math.random() * masked.length);
          masked[randIdx] = '_';
        }
        return { id: item.id, word: item.word, meaning: item.meaning, masked_word: masked.join(' ') };
      });
      state.spell_idx = 0;
      state.spell_score = { correct: 0, total: state.spell_list.length, finished: false, wrong_ids: [] };
      state.spell_answered = false;
      state.spell_is_correct = false;
    }
    function submitSpell() {
      const val = document.getElementById('spell-input').value.trim().toLowerCase();
      if (!val) return;
      state.spell_answered = true;
      const q = state.spell_list[state.spell_idx];
      const isCorr = val === q.word.trim().toLowerCase();
      state.spell_is_correct = isCorr;
      if (isCorr) {
        state.spell_score.correct++;
        state.mood = "happy";
        state.speech = "철자 하나도 안 틀리고 정확하게 꽂았다! 🔥";
      } else {
        state.spell_score.wrong_ids.push(q.id);
        state.mood = "angry";
        state.speech = "스펠링 삐끗했다! 철자가 생명이다! 💢";
      }
      render();
    }
    function nextSpell() {
      if (state.spell_idx < state.spell_list.length - 1) {
        state.spell_idx++;
        state.spell_answered = false;
        render();
      } else {
        state.spell_score.finished = true;
        addRewards(state.spell_score.correct * 6, state.spell_score.correct * 8);
        state.spell_score.wrong_ids.forEach(id => {
          if (!state.my_vocab_ids.includes(id)) state.my_vocab_ids.push(id);
        });
        saveState();
        render();
      }
    }

    // --- 단어장 및 복습 로직 ---
    function addCustomWord() {
      const day = document.getElementById('new-c-day').value.trim();
      const word = document.getElementById('new-c-word').value.trim();
      const meaning = document.getElementById('new-c-meaning').value.trim();
      if (!day || !word || !meaning) return;
      state.custom_words_db.push({
        id: `custom_${Date.now()}`,
        day: day,
        word: word,
        raw_word: word,
        meaning: meaning
      });
      saveState();
      alert("단어가 등록되었습니다!");
      render();
    }
    function removeMyVocab(id) {
      state.my_vocab_ids = state.my_vocab_ids.filter(i => i !== id);
      addRewards(2, 2);
    }
    function passSpaced(id) {
      const curr = state.spaced_rep_data[id] || { stage: 0 };
      const st = Math.min(curr.stage + 1, 5);
      const days = [1, 3, 7, 14, 30][st - 1];
      const d = new Date();
      d.setDate(d.getDate() + days);
      state.spaced_rep_data[id] = { stage: st, next_date: d.toISOString().split('T')[0] };
      addRewards(5, 5);
    }
    function downloadCSV() {
      const all = getAllVocab();
      const myVocabs = all.filter(v => state.my_vocab_ids.includes(v.id));
      let csv = "\uFEFFday,word,meaning\n";
      myVocabs.forEach(v => { csv += `"${v.day}","${v.word}","${v.meaning}"\n`; });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Haikyu_vocab_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
    }

    // --- 돌보기 및 매점 상점 ---
    function feedCare() {
      if (state.user_coins < 10) return alert("코인이 부족합니다!");
      state.user_coins -= 10;
      state.satisfaction = Math.min(state.satisfaction + 1, 4);
      state.mood = "happy";
      state.speech = "우물우물... 기운이 펄펄 난다! (만족도 상승) ✨";
      addRewards(5, 0);
    }
    function actionCare() {
      state.cur_stamina = Math.min(state.cur_stamina + 1, 4);
      state.mood = "happy";
      state.speech = "몸 제대로 풀렸다! 단어도 스파이크 때리듯 꽂자! 🏐";
      addRewards(3, 0);
    }
    function openShop() {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-card">
          <h3 style="font-weight: 900; margin-bottom: 6px;">🏐 카라스노 배구부 매점</h3>
          <p style="color: #64748B; font-weight: 700; margin-bottom: 15px;">보유 코인: 🪙 ${state.user_coins}</p>
          <hr style="border-color: #E2E8F0; margin-bottom: 15px;">
          
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <div><b>🏐 몰텐 공식 시합구</b><div style="font-size:12px; color:#64748B;">스파이크 성공률 훈련용</div></div>
            <button class="btn-pixel-black" onclick="buyItem(50, '몰텐 시합구')">50 🪙</button>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <div><b>🥛 군군 우유 1BOX</b><div style="font-size:12px; color:#64748B;">집중력 대폭 상승</div></div>
            <button class="btn-pixel-black" onclick="buyItem(80, '군군 우유 1BOX')">80 🪙</button>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <div><b>👕 전국대회 기념 져지</b><div style="font-size:12px; color:#64748B;">선수 전용 레어 유니폼</div></div>
            <button class="btn-pixel-black" onclick="buyItem(150, '전국대회 기념 져지')">150 🪙</button>
          </div>
          
          <button class="btn-pixel-white" style="width: 100%;" onclick="this.closest('.modal-overlay').remove()">닫기</button>
        </div>
      `;
      document.body.appendChild(overlay);
    }
    function buyItem(cost, name) {
      if (state.user_coins < cost) return alert("코인이 부족합니다!");
      state.user_coins -= cost;
      saveState();
      alert(`${name}를 구매했습니다! ✨`);
      document.querySelector('.modal-overlay')?.remove();
      render();
    }

    render();
  </script>
</body>
</html>
