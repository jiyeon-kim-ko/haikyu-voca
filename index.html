              </thead>
              <tbody>
                ${hList.map(item => `
                  <tr>
                    <td>${item.date}</td>
                    <td>${item.total}문제</td>
                    <td>${item.correct}개</td>
                    <td>${item.total > 0 ? ((item.correct / item.total) * 100).toFixed(1) : 100}%</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `}
        `;
      }

      return '';
    }


    function getDefaultPreviewTransform(item){
      if(!item) return {x:0,y:0,scale:100,opacity:100,rotate:0};
      if(item.type==='slogan') return {x:0,y:-105,scale:72,opacity:100,rotate:0};
      if(item.type==='background') return {x:0,y:0,scale:100,opacity:100,rotate:0};
      if(item.type==='frame') return {x:0,y:0,scale:100,opacity:100,rotate:0};
      const slot=item.slot;
      if(slot==='head') return {x:0,y:-78,scale:38,opacity:100,rotate:0};
      if(slot==='face') return {x:0,y:-10,scale:44,opacity:100,rotate:0};
      if(slot==='side') return {x:72,y:36,scale:36,opacity:100,rotate:0};
      return {x:0,y:0,scale:92,opacity:95,rotate:0};
    }
    function getPreviewTransform(item, charKey=state.char, variantId=null){
      if(!item) return {x:0,y:0,scale:100,opacity:100,rotate:0};
      const resolvedVariant=variantId || (charKey===state.char ? (state.charVariant||'default') : 'default');
      const variantShop=getCharacterVariantData(charKey,resolvedVariant);
      const key=`${charKey}:${resolvedVariant}:${item.id}`;
      const saved=variantShop.transforms?.[item.id];
      if(saved&&!state.shopPreviewTransforms[key]) state.shopPreviewTransforms[key]={rotate:0,...saved};
      if(!state.shopPreviewTransforms[key]) state.shopPreviewTransforms[key]=getDefaultPreviewTransform(item);
      return state.shopPreviewTransforms[key];
    }
    function previewShopItem(id){
      state.shopPreviewItemId = state.shopPreviewItemId===id ? null : id;
      const item=getShopItem(id);
      if(item) getPreviewTransform(item);
      render();
    }
    function updateShopPreviewTransform(id,key,value){
      const item=getShopItem(id); if(!item) return;
      const t=getPreviewTransform(item);
      t[key]=Number(value);
      if(state.userData?.shop){
        const variantShop=getCharacterVariantData();
        variantShop.transforms[id]={...t};
      }
      const el=document.getElementById('shop-preview-moving-layer');
      if(el){
        el.style.left=`calc(50% + ${t.x}px)`;
        el.style.top=`calc(50% + ${t.y}px)`;
        el.style.width=`${t.scale}%`;
        el.style.opacity=String(t.opacity/100);
        el.style.transform=`translate(-50%,-50%) rotate(${t.rotate || 0}deg)`;
      }
      const label=document.getElementById(`preview-${key}-value`);
      if(label) label.textContent =
        key==='opacity' ? `${t[key]}%` :
        key==='scale' ? `${t[key]}%` :
        key==='rotate' ? `${t[key]}°` :
        `${t[key]}px`;
    }
    function resetShopPreviewTransform(id){
      const item=getShopItem(id); if(!item) return;
      const key=`${state.char}:${state.charVariant||'default'}:${id}`;
      state.shopPreviewTransforms[key]=getDefaultPreviewTransform(item);
      const variantShop=getCharacterVariantData();
      variantShop.transforms[id]={...state.shopPreviewTransforms[key]};
      render();
    }
    function renderShopItemPreview(item){
      if(!item) return '';
      const meta=getActiveCharacterMeta(state.char);
      const charShop=getCharacterShopData();
      const variantShop=getCharacterVariantData();
      const eq=variantShop.equipped||{};
      const equippedBg=getShopItem(eq.background);
      const equippedFrame=getShopItem(eq.frame);
      const t=getPreviewTransform(item);
      const charT=getCharacterTransform();
      const isBg=item.type==='background';
      const isFrame=item.type==='frame';
      const movable=item.type==='accessory'||item.type==='slogan';
      const movingClass=item.type==='slogan'?'preview-slogan':'preview-accessory';
      const movingStyle=`left:calc(50% + ${t.x}px);top:calc(50% + ${t.y}px);width:${t.scale}%;opacity:${t.opacity/100};transform:translate(-50%,-50%) rotate(${t.rotate || 0}deg);`;
      const charStyle=`left:calc(50% + ${charT.x}px);top:calc(50% + ${charT.y}px);width:${charT.scale}%;height:${charT.scale}%;transform:translate(-50%,-50%);`;
      const previewBg=isBg?item:equippedBg;
      const previewFrame=isFrame?item:equippedFrame;

      return `<div class="shop-preview-panel">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <div>
            <b>👀 ${item.name} 미리보기</b>
            <div style="font-size:10.5px;color:#64748B;margin-top:2px">
              ${isFrame?'프레임은 실제 프로필 테두리에 자동으로 맞춰집니다.':'왼쪽 실제 프로필과 같은 230×280 좌표계입니다.'}
            </div>
          </div>
          <button class="btn-pixel-white" onclick="previewShopItem('${item.id}')">닫기 ✕</button>
        </div>

        <div class="shop-preview-stage ${isBg?'':'cutout-stage'}">
          <div class="preview-stage-clip">
            ${previewBg?`<img class="preview-bg" src="${previewBg.file}" alt="${previewBg.name}" onerror="this.style.display='none';">`:''}
            ${characterCutoutImg(meta,'preview-char-cutout',charStyle,'shop-preview-character-live')}
          </div>

          ${movable?`<img id="shop-preview-moving-layer" class="${movingClass}" src="${item.file}" alt="${item.name}" style="${movingStyle}" onerror="this.style.display='none';">`:''}

          ${previewFrame?`<img class="preview-frame" src="${previewFrame.file}" alt="${previewFrame.name}" onerror="this.style.display='none';">`:''}
        </div>

        ${isBg?`
          <div style="font-size:11px;color:#64748B;text-align:center;font-weight:800">배경은 캐릭터 뒤에 꽉 차게 적용됩니다.</div>
        `:isFrame?`
          <div style="font-size:11px;color:#64748B;text-align:center;font-weight:800">프레임은 캐릭터·배경·액세서리보다 가장 위에 표시됩니다.</div>
        `:`
        <div class="preview-controls">
          <div class="preview-control"><label><span>↔ 좌우 위치</span><span id="preview-x-value">${t.x}px</span></label><input type="range" min="-180" max="180" step="1" value="${t.x}" oninput="updateShopPreviewTransform('${item.id}','x',this.value)"></div>
          <div class="preview-control"><label><span>↕ 위아래 위치</span><span id="preview-y-value">${t.y}px</span></label><input type="range" min="-220" max="220" step="1" value="${t.y}" oninput="updateShopPreviewTransform('${item.id}','y',this.value)"></div>
          <div class="preview-control"><label><span>🔍 크기</span><span id="preview-scale-value">${t.scale}%</span></label><input type="range" min="8" max="180" step="1" value="${t.scale}" oninput="updateShopPreviewTransform('${item.id}','scale',this.value)"></div>
          <div class="preview-control"><label><span>◐ 투명도</span><span id="preview-opacity-value">${t.opacity}%</span></label><input type="range" min="0" max="100" step="1" value="${t.opacity}" oninput="updateShopPreviewTransform('${item.id}','opacity',this.value)"></div>
          <div class="preview-control"><label><span>↻ 각도</span><span id="preview-rotate-value">${t.rotate || 0}°</span></label><input type="range" min="-180" max="180" step="1" value="${t.rotate || 0}" oninput="updateShopPreviewTransform('${item.id}','rotate',this.value)"></div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:8px;flex-wrap:wrap">
          <button class="btn-pixel-white" onclick="resetShopPreviewTransform('${item.id}')">↺ 아이템 위치 초기화</button>
          <button class="btn-pixel-black" onclick="savePreviewPosition('${item.id}')">💾 이 위치 저장</button>
        </div>`}
      </div>`;
    }
    function savePreviewPosition(id){
      const item=getShopItem(id); if(!item) return;
      const variantShop=getCharacterVariantData();
      variantShop.transforms[id]={...getPreviewTransform(item)};
      saveUserData();
      alert('이 위치를 저장했습니다.');
    }
    function setShopCategory(category){state.shopCategory=category;state.shopPreviewItemId=null;render()}

    function buyCheerTickets(bundle){const packs={1:{coins:20,tickets:1},3:{coins:50,tickets:3},5:{coins:75,tickets:5}},p=packs[bundle];if(!p)return;if(state.userData.coins<p.coins)return alert(`${p.coins} 코인이 필요합니다.`);state.userData.coins-=p.coins;state.userData.shop.tickets+=p.tickets;saveUserData();alert(`응원 티켓 ${p.tickets}장을 구매했습니다!`);render()}
    function buyShopItem(id){const item=getShopItem(id);if(!item)return;const s=getCharSchoolId(),charShop=getCharacterShopData();if(item.school!=='all'&&item.school!==s)return alert('이 아이템은 현재 캐릭터의 학교에서는 사용할 수 없습니다.');if(charShop.ownedItems.includes(id))return;if(state.userData.shop.tickets<item.price)return alert(`응원 티켓이 부족합니다. ${item.price}장이 필요합니다.`);state.userData.shop.tickets-=item.price;charShop.ownedItems.push(id);charShop.ownedItems=Array.from(new Set(charShop.ownedItems));saveUserData();render()}
    function equipShopItem(id){
      const item=getShopItem(id),charShop=getCharacterShopData(),variantShop=getCharacterVariantData();
      if(!item||!charShop.ownedItems.includes(id))return;
      const s=getCharSchoolId();
      if(item.school!=='all'&&item.school!==s)return alert('현재 캐릭터에게 장착할 수 없는 학교 전용 아이템입니다.');
      const slot=item.type==='accessory'?item.slot:item.type;
      variantShop.equipped[slot]=id;
      variantShop.transforms[id]={...getPreviewTransform(item)};
      saveUserData();
      render();
    }
    function unequipShopItem(id){
      const item=getShopItem(id);
      if(!item)return;
      const variantShop=getCharacterVariantData();
      const slot=item.type==='accessory'?item.slot:item.type;
      if(variantShop.equipped[slot]===id){
        variantShop.equipped[slot]=null;
        saveUserData();
      }
      render();
    }

    function selectUser(u) {
      state.user = u;
      state.lang = null;
      state.entered = false;
      state.variantSelecting = false;
      state.selectedDay = 'all';
      state.tab = 'practice';
      render();
    }

    function selectLang(l) { state.lang = l; render(); }
    function selectChar(c) {
      state.char = c;
      state.charVariant = 'default';
      state.variantSelecting = false;
      render();
    }

    async function enterGym() {
      saveSelectedVariant();
      state.variantSelecting = false;
      state.entered = true;
      await loadUserData();
      loadTimerRuntime();
      const lName = state.lang === 'ja' ? '일본어' : '영어';
      state.speech = getCharSpeech('enter', lName);

      initFlashcards();
      generateQuiz();
      generateHardQuiz();
      generateSpellQuiz();
      render();
    }

    function switchTab(t) {
      state.tab = t;
      if (t === 'practice') initFlashcards();
      if (t === 'quiz') generateQuiz();
      if (t === 'hard') generateHardQuiz();
      if (t === 'spell') generateSpellQuiz();
      render();
    }

    function onDayChange(val) {
      state.selectedDay = val;
      if (state.tab === 'practice') initFlashcards();
      if (state.tab === 'quiz') generateQuiz();
      if (state.tab === 'hard') generateHardQuiz();
      if (state.tab === 'spell') generateSpellQuiz();
      render();
    }

    function addCareExp(amount) {
      const oldLevel = getCharInfo().level;
      state.userData.exp = Number(state.userData.exp || 0) + amount;
      const newLevel = getCharInfo().level;
      if (newLevel > oldLevel) {
        setTimeout(() => alert(`🎉 파트너 승격! [Lv.${newLevel} ${STAGE_TITLES[newLevel - 1]}]`), 0);
      }
    }

    function feedPartner() {
      const meta = CHAR_META[state.char] || CHAR_META.kageyama;
      if (state.userData.coins < CARE_COSTS.food) {
        alert(`${meta.name}에게 ${meta.food}을(를) 주려면 ${CARE_COSTS.food}코인이 필요합니다.`);
        return;
      }

      state.userData.coins -= CARE_COSTS.food;
      addCareExp(10);
      state.userData.satisfaction = Math.min(4, Number(state.userData.satisfaction || 0) + 1);
      state.mood = 'happy';
      state.speech = getCharSpeech('food');
      saveUserData();
      render();
    }

    function actionPartner() {
      const meta = CHAR_META[state.char] || CHAR_META.kageyama;
      if (state.userData.coins < CARE_COSTS.train) {
        alert(`${meta.act}에는 ${CARE_COSTS.train}코인이 필요합니다.`);
        return;
      }

      state.userData.coins -= CARE_COSTS.train;
      addCareExp(20);
      state.userData.stamina = Math.min(4, Number(state.userData.stamina || 0) + 1);
      state.mood = 'happy';
      state.speech = getCharSpeech('train');
      saveUserData();
      render();
    }

    function toggleFlashcardMeaning() { state.fcShowMeaning = !state.fcShowMeaning; render(); }
    function prevFlashcard() { if (state.fcIdx > 0) { state.fcIdx--; state.fcShowMeaning = false; render(); } }
    function nextFlashcard() {
      const list = getFilteredVocab();
      if (state.fcIdx < list.length - 1) { state.fcIdx++; state.fcShowMeaning = false; render(); }
    }
    function shuffleFlashcards() {
      initFlashcards();
      state.speech = getCharSpeech('shuffle');
      render();
    }

    function addCurrentPracticeWord(id) {
      if (!id) return;
      if (!state.userData.myVocabIds.includes(id)) {
        state.userData.myVocabIds.push(id);
        state.userData.myVocabIds = Array.from(new Set(state.userData.myVocabIds));
        state.speech = getCharSpeech('saved'); saveUserData();
      }
      render();
    }

    function handleQuizOpt(opt) {
      if (state.quizAnswered) return;
      const q = state.quizQuestions[state.quizIdx];
      state.quizSelectedOpt = opt;
      state.quizAnswered = true;
      const isCorr = (opt === q.cAns);
      if (isCorr) {
        state.quizScore.correct++;
        state.mood = 'happy';
        state.speech = getCharSpeech('quizCorrect');
      } else {
        if (!state.quizScore.wrongIds.includes(q.id)) state.quizScore.wrongIds.push(q.id);
        state.mood = 'angry';
        state.speech = getCharSpeech('quizWrong');
      }
      render();
    }

    function nextQuiz() {
      if (state.quizIdx < state.quizQuestions.length - 1) {
        state.quizIdx++;
        state.quizAnswered = false;
        state.quizSelectedOpt = null;
      } else {
        state.quizScore.finished = true;
        const reward = calculateTestReward('quiz', state.quizScore.correct);
        state.lastTicketGain = awardCheerTickets('quiz', state.quizScore.correct, state.quizScore.total);
        addRewards(reward.exp, reward.coins);
        if (state.quizScore.wrongIds.length > 0) {
          state.userData.myVocabIds = Array.from(new Set([...state.userData.myVocabIds, ...state.quizScore.wrongIds]));
          const tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
          state.quizScore.wrongIds.forEach(id => {
            state.userData.spacedRepData[id] = { stage: 1, nextDate: tmr.toISOString().split('T')[0] };
          });
        }
        state.userData.studyHistory.push({
          date: new Date().toISOString().split('T')[0],
          total: state.quizScore.total,
          correct: state.quizScore.correct
        });
        saveUserData();
      }
      render();
    }

    function submitHard() {
      if (state.hardAnswered) return;
      const input = document.getElementById('hard-input');
      const val = input.value.replace(/\s+/g, '').trim();
      if (!val) return;
      const q = state.hardQuestions[state.hardIdx];
      const meanings = q.meaning.split(/[,/~;]/).map(m => m.replace(/\s+/g, '').trim());
      const isCorr = meanings.some(m => m.includes(val) || val.includes(m));
      state.hardAnswered = true;
      state.hardIsCorrect = isCorr;
      if (isCorr) {
        state.hardScore.correct++;
        state.mood = 'happy';
        state.speech = getCharSpeech('hardCorrect');
      } else {
        if (!state.hardScore.wrongIds.includes(q.id)) state.hardScore.wrongIds.push(q.id);
        state.mood = 'angry';
        state.speech = getCharSpeech('hardWrong');
      }
      render();
    }

    function nextHard() {
      if (state.hardIdx < state.hardQuestions.length - 1) {
        state.hardIdx++;
        state.hardAnswered = false;
        state.hardIsCorrect = false;
      } else {
        state.hardScore.finished = true;
        const reward = calculateTestReward('hard', state.hardScore.correct);
        state.lastTicketGain = awardCheerTickets('hard', state.hardScore.correct, state.hardScore.total);
        addRewards(reward.exp, reward.coins);
        if (state.hardScore.wrongIds.length > 0) {
          state.userData.myVocabIds = Array.from(new Set([...state.userData.myVocabIds, ...state.hardScore.wrongIds]));
        }
        saveUserData();
      }
      render();
    }

    function submitSpell() {
      if (state.spellAnswered) return;
      const input = document.getElementById('spell-input');
      const val = input.value.trim().toLowerCase();
      if (!val) return;
      const q = state.spellQuestions[state.spellIdx];
      const isCorr = (val === q.word.trim().toLowerCase());
      state.spellAnswered = true;
      state.spellIsCorrect = isCorr;
      if (isCorr) {
        state.spellScore.correct++;
        state.mood = 'happy';
        state.speech = getCharSpeech('spellCorrect');
      } else {
        if (!state.spellScore.wrongIds.includes(q.id)) state.spellScore.wrongIds.push(q.id);
        state.mood = 'angry';
        state.speech = getCharSpeech('spellWrong');
      }
      render();
    }

    function nextSpell() {
      if (state.spellIdx < state.spellQuestions.length - 1) {
        state.spellIdx++;
        state.spellAnswered = false;
        state.spellIsCorrect = false;
      } else {
        state.spellScore.finished = true;
        const reward = calculateTestReward('spell', state.spellScore.correct);
        state.lastTicketGain = awardCheerTickets('spell', state.spellScore.correct, state.spellScore.total);
        addRewards(reward.exp, reward.coins);
        if (state.spellScore.wrongIds.length > 0) {
          state.userData.myVocabIds = Array.from(new Set([...state.userData.myVocabIds, ...state.spellScore.wrongIds]));
        }
        saveUserData();
      }
      render();
    }

    function addCustomWord() {
      const d = document.getElementById('c-day').value.trim();
      const w = document.getElementById('c-word').value.trim();
      const m = document.getElementById('c-meaning').value.trim();
      if (!d || !w || !m) return alert('내용을 모두 입력해주세요.');
      const newWord = { id: `c_${Date.now()}`, day: d, word: w, raw_word: w, speech_word: w, meaning: m };
      state.userData.customWords.push(newWord);
      saveUserData();
      alert('단어가 추가되었습니다!');
      render();
    }

    function removeMyVocab(id) {
      state.userData.myVocabIds = state.userData.myVocabIds.filter(v => v !== id);
      saveUserData(); render();
    }

    function passSpacedRep(id) {
      const intervals = { 1: 3, 2: 7, 3: 14, 4: 30, 5: 30 };
      const cur = state.userData.spacedRepData[id] || { stage: 1 };
      const nextStage = Math.min(5, cur.stage + 1);
      const d = new Date();
      d.setDate(d.getDate() + (intervals[nextStage] || 30));
      state.userData.spacedRepData[id] = { stage: nextStage, nextDate: d.toISOString().split('T')[0] };
      saveUserData(); render();
    }

    window.addEventListener('beforeunload',()=>{if(state.studyTimer?.running)tickStudyTimer();saveTimerRuntime();});

    // 앱 초기화 및 CSV 데이터 자동 로딩
    (async function initApp() {
      await loadAllCSVData();
      render();
    })();
  </script>
</body>
</html>
