    function isConversationLang(){return String(state.lang||'').startsWith('conv-')}
    function conversationLangCode(){return String(state.lang||'').replace('conv-','')}
    function conversationLangLabel(){return conversationLangCode()==='en'?'🇺🇸 영어 회화':conversationLangCode()==='de'?'🇩🇪 독일어 회화':'🇯🇵 일본어 회화'}
    function conversationTTSLang(){return conversationLangCode()==='de'?'de-DE':conversationLangCode()==='ja'?'ja-JP':'en-US'}
    function playConversationTTS(text){
      if(!('speechSynthesis' in window))return;
      speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=conversationTTSLang();speechSynthesis.speak(u);
    }
    function encodeInlineText(v){return encodeURIComponent(String(v||'')).replace(/'/g,'%27')}
    function playConversationEncoded(v){try{playConversationTTS(decodeURIComponent(v))}catch(e){}}
    async function selectConversationLang(code){
      state.lang='conv-'+code;state.entered=true;state.conversationTab='today';
      await loadUserData();render();
    }
    function normalizeConversationPhrases(){
      state.userData.conversationPhrases=Array.isArray(state.userData.conversationPhrases)?state.userData.conversationPhrases:[];
      return state.userData.conversationPhrases;
    }
    function addConversationPhrase(){
      const target=String(document.getElementById('conv-target')?.value||'').trim();
      const meaning=String(document.getElementById('conv-meaning')?.value||'').trim();
      const category=String(document.getElementById('conv-category')?.value||'일상');

      normalizeConversationPhrases().unshift({id:`phrase_${Date.now()}_${Math.random().toString(36).slice(2,5)}`,target,meaning,category,createdAt:new Date().toISOString()});
      saveUserData();render();
    }
    function deleteConversationPhrase(id){state.userData.conversationPhrases=normalizeConversationPhrases().filter(x=>x.id!==id);saveUserData();render()}

      if(state.conversationTab==='phrases'){
        body=`<div class="conversation-hero"><h3 style="margin-top:0;">📚 나만의 회화 표현장</h3>

        </div>`;
      }else{

          shadow:'저장한 표현을 듣고 따라 말하는 쉐도잉 연습 공간이에요.',

        <div class="conversation-tabs">${tabs.map(([id,label])=>`<button class="conversation-tab ${state.conversationTab===id?'active':''}" onclick="state.conversationTab='${id}';render();">${label}</button>`).join('')}</div>
        ${body}

          }).join('')}

      `;

            ${renderTestScopeSelector()}
            <div style="text-align: center; padding: 40px 20px;">
              <h3 style="font-weight: 900; display:flex; justify-content:center; align-items:center; gap:7px;">${renderMikasaBall(22)} 1세트 객관식 결과</h3>
              <p style="font-size: 16px; color: #4B5563;">성공률: ${rate}% (${sc.correct}/${sc.total})</p>
              <h4 style="color: #EA580C; font-weight: 900;">+${calculateTestReward('quiz', sc.correct).exp} EXP | +${calculateTestReward('quiz', sc.correct).coins} 🪙 획득!</h4>
              <div class="ticket-result">🎟️ 응원 티켓 ${state.lastTicketGain > 0 ? `+${state.lastTicketGain}장` : '추가 획득 없음'}</div>
              <button class="btn-pixel-black" style="margin-top: 15px;" onclick="generateQuiz(); render();">다시 시작하기 ➔</button>
            </div>
          `;
        }
        if (state.quizQuestions.length === 0) return `${renderTestScopeSelector()}<p style="padding:20px;">선택한 시험 범위에 객관식 문제를 만들 단어가 부족합니다. (최소 4개 필요)</p>`;
        const q = state.quizQuestions[state.quizIdx];
        return `
          ${renderTestScopeSelector()}
          <div style="display:flex; justify-content:flex-end; align-items:center; margin-bottom:10px;">
            <span style="font-weight: 800;">문제: ${state.quizIdx + 1} / ${state.quizQuestions.length}</span>
          </div>
          <div style="text-align: center; padding: 10px 0;">
            <h2 style="font-weight: 900; color: #1E293B; margin: 5px 0 15px 0;">${q.word}</h2>
          </div>
          <div>
            ${q.opts.map((opt, i) => {
              let cls = "option-btn";
              if (state.quizAnswered) {
                if (opt === q.cAns) cls += " btn-correct";
                else if (opt === state.quizSelectedOpt) cls += " btn-wrong";
              }
              return `<button class="${cls}" onclick="handleQuizOpt('${opt.replace(/'/g, "\\'")}')">${i + 1}.  ${opt}</button>`;
            }).join('')}
          </div>
          ${state.quizAnswered ? `
            <div style="text-align: right; margin-top: 5px;">
              <button class="btn-pixel-black" onclick="nextQuiz()">
                ${state.quizIdx < state.quizQuestions.length - 1 ? '다음 문제 ➔' : '세트 결과 확인 ➔'}
              </button>
            </div>
          ` : ''}
        `;
      }

      if (state.tab === 'todayWrong') {
        const today=localDateKey();
        const allRows=(state.userData.todayWrongAnswers||[]).filter(x=>x&&x.date===today).slice().reverse();
        const unique=[]; const seen=new Set();
        allRows.forEach(x=>{
          const mode=x.mode||'hard';
          const k=`${mode}_${String(x.id||x.word)}`;
          if(!seen.has(k)){seen.add(k);unique.push({...x,mode})}
        });
        const mode=state.todayWrongMode||'all';
        const rows=mode==='all'?unique:unique.filter(x=>x.mode===mode);
        const counts={
          all:unique.length,
          quiz:unique.filter(x=>x.mode==='quiz').length,
          hard:unique.filter(x=>x.mode==='hard').length,
          spell:unique.filter(x=>x.mode==='spell').length
        };
        const labels={quiz:'객관식',hard:'주관식',spell:'스펠링'};
        const tabs=[['all','전체'],['quiz','객관식'],['hard','주관식'],...(state.lang!=='ja'?[['spell','스펠링']]:[])];
        const retryButtons=[
          counts.quiz?`<button class="btn-pixel-white" onclick="startTodayWrongReview('quiz')">객관식 ${counts.quiz}개 재시험</button>`:'',
          counts.hard?`<button class="btn-pixel-white" onclick="startTodayWrongReview('hard')">주관식 ${counts.hard}개 재시험</button>`:'',
          (state.lang!=='ja'&&counts.spell)?`<button class="btn-pixel-white" onclick="startTodayWrongReview('spell')">스펠링 ${counts.spell}개 재시험</button>`:''
        ].filter(Boolean).join('');
        return `<div style="margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;">
            <div><h3 style="margin:0;font-weight:900;">📕 오늘 오답</h3><div style="font-size:11px;color:#64748B;font-weight:700;margin-top:4px;">오늘 틀린 객관식 · 주관식 · 스펠링을 유형별로 자동 저장해요.</div></div>
            <div style="font-size:12px;font-weight:900;color:#DC2626;">총 ${counts.all}개</div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;">
            ${tabs.map(([k,label])=>`<button class="${mode===k?'btn-pixel-black':'btn-pixel-white'}" onclick="state.todayWrongMode='${k}';render();">${label} ${counts[k]||0}</button>`).join('')}
          </div>
          ${retryButtons?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;">${retryButtons}</div>`:''}
        </div>
        ${rows.length?rows.map((x,i)=>{
          const label=labels[x.mode]||'오답';
          const answer=x.mode==='spell'?(x.correctAnswer||x.word||''):(x.correctAnswer||x.meaning||'');
          const my=x.userAnswer||x.selectedAnswer||'(선택 기록 없음)';
          const sub=x.mode==='spell'&&x.meaning?`<div style="font-size:11px;margin-top:3px;color:#64748B;">뜻: ${escHtml(x.meaning)}</div>`:'';
          return `<div style="border:1.5px solid #E2E8F0;border-radius:10px;padding:11px;margin-bottom:8px;background:#FFF;"><div style="display:flex;justify-content:space-between;gap:8px;"><b>${i+1}. ${escHtml(x.word||'')}</b><span style="font-size:10px;font-weight:900;color:#7C3AED;">${label}</span></div><div style="font-size:12px;margin-top:6px;color:#DC2626;">내 답: ${escHtml(my)}</div><div style="font-size:12px;margin-top:3px;color:#166534;">정답: ${escHtml(answer)}</div>${sub}</div>`;
        }).join(''):`<div style="padding:36px;text-align:center;color:#94A3B8;font-weight:800;border:1.5px dashed #CBD5E1;border-radius:12px;">${mode==='all'?'오늘 저장된 오답이 없어요.':`${labels[mode]||''} 오답이 없어요.`}</div>`}`;
      }

      if (state.tab === 'hard') {
        const sc = state.hardScore;
        if (sc.finished) {
          return `
            ${renderTestScopeSelector()}
            <div style="text-align: center; padding: 40px 20px;">
              <h3 style="font-weight: 900;">🔥 주관식 Hard 세트 완료!</h3>
              <p style="font-size: 16px; color: #4B5563;">적중: ${sc.correct} / ${sc.total}</p>
              <h4 style="color: #EA580C; font-weight: 900;">+${calculateTestReward('hard', sc.correct).exp} EXP | +${calculateTestReward('hard', sc.correct).coins} 🪙 획득!</h4>
              <div class="ticket-result">🎟️ 응원 티켓 ${state.lastTicketGain > 0 ? `+${state.lastTicketGain}장` : '추가 획득 없음'}</div>
              <button class="btn-pixel-black" style="margin-top: 15px;" onclick="generateHardQuiz(); render();">다시 시작하기 ➔</button>
            </div>
          `;
        }
        if (state.hardQuestions.length === 0) return `${renderTestScopeSelector()}<p style="padding:20px;">선택한 시험 범위에 단어가 없습니다.</p>`;
        const q = state.hardQuestions[state.hardIdx];
        return `
          ${renderTestScopeSelector()}
          <div style="display:flex; justify-content:flex-end; align-items:center; margin-bottom:10px;">
            <span style="font-weight: 800;">문제: ${state.hardIdx + 1} / ${state.hardQuestions.length}</span>
          </div>
          <div style="text-align: center; padding: 15px 0;">
            <h2 style="font-weight: 900; color: #1E293B; margin: 0 0 10px 0;">${q.word}</h2>
            <p style="color: #64748B; font-size: 13px;">한국어 뜻을 직접 입력하세요.</p>
          </div>
          <div style="max-width: 440px; margin: 0 auto; width: 100%;">
            <input type="text" id="hard-input" class="std-input" placeholder="한국어 뜻 입력 (예: 잡다)" ${state.hardAnswered ? 'disabled' : ''} onkeydown="if(event.key==='Enter') submitHard();" />
            <div style="margin-top: 10px;">
              ${!state.hardAnswered ? `
                <button class="btn-pixel-black" style="width: 100%;" onclick="submitHard()">정답 확인</button>
              ` : `
                <div style="background: ${state.hardIsCorrect ? '#DCFCE7' : '#FEE2E2'}; color: ${state.hardIsCorrect ? '#166534' : '#991B1B'}; padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 8px; line-height:1.7;">
                  <div style="text-align:center;margin-bottom:5px;">${state.hardIsCorrect ? '● 정답입니다!' : '✕ 오답입니다'}</div>
                  <div>내가 쓴 답: <b>${escHtml(state.hardLastAnswer||'')}</b></div>
                  <div>실제 정답: <b>${escHtml(q.meaning)}</b></div>
                </div>
                <button class="btn-pixel-black" style="width: 100%;" onclick="nextHard()">
                  ${state.hardIdx < state.hardQuestions.length - 1 ? '다음 문제 ➔' : '세트 결과 확인 ➔'}
                </button>
              `}
            </div>
          </div>
        `;
      }

      if (state.tab === 'spell' && state.lang !== 'ja') {
        const sc = state.spellScore;
        if (sc.finished) {
          return `
            ${renderTestScopeSelector()}
            <div style="text-align: center; padding: 40px 20px;">
              <h3 style="font-weight: 900;">🔤 스펠링 게임 완료!</h3>
              <p style="font-size: 16px; color: #4B5563;">적중: ${sc.correct} / ${sc.total}</p>
              <h4 style="color: #EA580C; font-weight: 900;">+${calculateTestReward('spell', sc.correct).exp} EXP | +${calculateTestReward('spell', sc.correct).coins} 🪙 획득!</h4>
              <div class="ticket-result">🎟️ 응원 티켓 ${state.lastTicketGain > 0 ? `+${state.lastTicketGain}장` : '추가 획득 없음'}</div>
              <button class="btn-pixel-black" style="margin-top: 15px;" onclick="generateSpellQuiz(); render();">다시 시작하기 ➔</button>
            </div>
          `;
        }
        if (state.spellQuestions.length === 0) return `${renderTestScopeSelector()}<p style="padding:20px;">선택한 시험 범위에 단어가 없습니다.</p>`;
        const q = state.spellQuestions[state.spellIdx];
        return `
          ${renderTestScopeSelector()}
          <div style="display:flex; justify-content:flex-end; align-items:center; margin-bottom:10px;">
            <span style="font-weight: 800;">문제: ${state.spellIdx + 1} / ${state.spellQuestions.length}</span>
          </div>
          <div style="text-align: center; padding: 10px 0;">
            <h4 style="font-weight: 800; color: #4B5563; margin: 0;">${q.meaning}</h4>
            <div style="font-family: monospace; font-size: 30px; letter-spacing: 4px; font-weight: 900; margin: 12px 0;">${q.maskedWord}</div>
          </div>
          <div style="max-width: 440px; margin: 0 auto; width: 100%;">
            <input type="text" id="spell-input" class="std-input" placeholder="완성된 영단어 입력" ${state.spellAnswered ? 'disabled' : ''} onkeydown="if(event.key==='Enter') submitSpell();" />
            <div style="margin-top: 10px;">
              ${!state.spellAnswered ? `
                <button class="btn-pixel-black" style="width: 100%;" onclick="submitSpell()">철자 제출</button>
              ` : `
                <div style="background: ${state.spellIsCorrect ? '#DCFCE7' : '#FEE2E2'}; color: ${state.spellIsCorrect ? '#166534' : '#991B1B'}; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 8px;">
                  ${state.spellIsCorrect ? '● 정답: ' + q.word : '✕ 정답: ' + q.word}
                </div>
                <button class="btn-pixel-black" style="width: 100%;" onclick="nextSpell()">
                  ${state.spellIdx < state.spellQuestions.length - 1 ? '다음 문제 ➔' : '세트 결과 확인 ➔'}
                </button>
              `}
            </div>
          </div>
        `;
      }

      if (state.tab === 'custom') {
        const db = getCombinedVocab();
        const myVocab = db.filter(d => state.userData.myVocabIds.includes(d.id));
        return `
          <h4 style="font-weight: 900; margin-top: 0; color: #1E293B;">➕ 나만의 단어 추가</h4>
          <div class="custom-input-row">
            <input type="text" id="c-day" placeholder="${state.lang === 'ja' ? '품사' : 'Day 번호'}" style="width: 20%;" />
            <input type="text" id="c-word" placeholder="${state.lang === 'ja' ? '일본어 단어' : '영어 단어'}" style="width: 35%;" />
            <input type="text" id="c-meaning" placeholder="한국어 뜻 입력" style="width: 45%;" />
            <button class="btn-pixel-black" onclick="addCustomWord()">추가 ➕</button>
          </div>
          <hr style="border: 0; border-top: 1px solid #E2E8F0; margin: 15px 0;" />
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h4 style="font-weight: 900; margin: 0; color: #1E293B;">📑 내 오답 단어장 (${myVocab.length})</h4>
          </div>
          <div style="font-size:10.5px;color:#64748B;font-weight:700;margin-top:5px;">
            ${state.lang==='ja'?'각 단어의 🔊 발음 버튼으로 일본어 발음을 들을 수 있어요.':'각 단어에서 🇺🇸 미국식 / 🇬🇧 영국식 발음을 바로 들을 수 있어요.'}
          </div>
          <div style="max-height: 250px; overflow-y: auto; margin-top: 10px;">
            ${myVocab.length === 0 ? '<p style="color: #94A3B8; text-align: center; padding: 25px;">저장된 오답이 없습니다.</p>' :
              myVocab.map(r => `
                <div class="word-row" style="gap:8px;flex-wrap:wrap;">
                  <div style="flex:1;min-width:180px;">
                    <span style="font-weight: 800; color: #1E293B;">${r.word}</span>
                    <span style="color: #64748B; margin-left: 10px;">${r.meaning}</span>
                  </div>
                  ${renderListPronunciationButtons(r)}
                  <button class="btn-pixel-white" onclick="removeMyVocab('${r.id}')">외웠다 ✔</button>
                </div>
              `).join('')}
          </div>
        `;
      }

      if (state.tab === 'spaced') {
        const sData = state.userData.spacedRepData;
        const todayStr = new Date().toISOString().split('T')[0];
        const db = getCombinedVocab();
        const reviewIds = Object.keys(sData).filter(k => !k.startsWith('__') && sData[k] && sData[k].nextDate <= todayStr);
        const reviewList = db.filter(d => reviewIds.includes(d.id));

        if (reviewList.length === 0) {
          return `<div style="text-align: center; padding: 50px 20px;"><h4 style="font-weight: 800;">오늘 복습할 망각 단어가 없습니다! 🎉</h4></div>`;
        }
        return `
          <h4 style="font-weight: 900; margin-top: 0;">🧠 오늘의 주기 복습 단어 (${reviewList.length}개)</h4>
          <div style="font-size:10.5px;color:#64748B;font-weight:700;margin:-4px 0 9px;">
            ${state.lang==='ja'?'각 단어의 🔊 발음 버튼으로 일본어 발음을 들을 수 있어요.':'각 단어에서 🇺🇸 미국식 / 🇬🇧 영국식 발음을 바로 들을 수 있어요.'}
          </div>
          <div style="max-height: 380px; overflow-y: auto;">
            ${reviewList.map(r => `
              <div class="word-row" style="gap:8px;flex-wrap:wrap;">
                <div style="flex:1;min-width:180px;">
                  <span style="font-weight: 800; color: #1E293B;">${r.word}</span>
                  <span style="color: #64748B; margin-left: 10px;">${r.meaning}</span>
                </div>
                ${renderListPronunciationButtons(r)}
                <button class="btn-pixel-black" onclick="passSpacedRep('${r.id}')">복습완료</button>
              </div>
            `).join('')}
          </div>
        `;
      }

      if (state.tab === 'inventory') {
        const charShop=getCharacterShopData(),vd=getCharacterVariantData();
        const owned=Object.keys(charShop.ownedCounts||{}).filter(id=>getOwnedCount(id)>0).map(getShopItem).filter(Boolean);
        const previewItem=getShopItem(state.shopPreviewItemId);
        const instances=(vd.equippedAccessories||[]).map(inst=>({inst,item:getShopItem(inst.itemId)})).filter(x=>x.item);
        return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div><h4 style="font-weight:900;margin:0">🎒 ${CHAR_META[state.char].name} 인벤토리</h4><div style="font-size:10.5px;color:#64748B;margin-top:3px">액세서리는 여러 개 동시 장착 · 같은 액세서리도 여러 개 구매 가능</div></div><div style="font-weight:900;color:#7C3AED">🎟️ ${state.userData.shop.tickets}장</div></div>
        <div style="margin-top:10px;padding:9px 10px;border:1.5px solid #C4B5FD;border-radius:10px;background:#FAF5FF;font-size:10.5px;color:#6D28D9;font-weight:800;">🖼️ 현재 버전: ${getSelectedVariant().name}<br>같은 액세서리 복사본도 각각 위치·크기·투명도·각도를 따로 저장해요.</div>
        ${renderCharacterAdjustControls()}
        ${instances.length?`<div style="font-size:11.5px;font-weight:900;margin-top:10px;">현재 장착 중인 액세서리 ${instances.length}개</div><div class="equipped-instance-list">${instances.map(({inst,item},idx)=>`<div class="equipped-instance-row"><img src="${item.file}" onerror="this.style.display='none';"><div class="info"><div class="name">${item.name} #${idx+1}</div><div class="meta">${item.slot} · 개별 위치 저장</div></div><button class="btn-pixel-white" onclick="editAccessoryInstance('${inst.instanceId}')">위치 조정</button><button class="btn-pixel-white" onclick="unequipAccessoryInstance('${inst.instanceId}')">해제</button></div>`).join('')}</div>`:''}
        ${renderAccessoryInstanceEditor()}${previewItem?renderShopItemPreview(previewItem):''}
        ${owned.length?`<div class="shop-grid">${owned.map(item=>{const count=getOwnedCount(item.id);if(item.type==='accessory'){const eqCount=getEquippedAccessoryCount(item.id),available=count-eqCount;return `<div class="shop-card ${eqCount?'equipped':''}"><div class="shop-preview"><img src="${item.file}" alt="${item.name}" onerror="this.style.display='none';"></div><div class="shop-item-name">${item.name} × ${count}</div><div class="shop-item-meta">장착 ${eqCount}개 · 남은 ${available}개</div><button class="btn-pixel-white" onclick="previewShopItem('${item.id}')">👀 미리보기</button><button class="${available>0?'btn-pixel-black':'btn-pixel-white'}" style="width:100%;" onclick="equipAccessoryCopy('${item.id}')" ${available>0?'':'disabled'}>＋ 하나 장착</button></div>`}const equipped=vd.equipped[item.type]===item.id;return `<div class="shop-card ${equipped?'equipped':''}"><div class="shop-preview ${item.type==='background'?'bg':item.type==='frame'?'frame':''}"><img src="${item.file}" alt="${item.name}" onerror="this.style.display='none';"></div><div class="shop-item-name">${item.name}</div><div class="shop-item-meta">${equipped?'장착 중':'보유 중'}</div><button class="btn-pixel-white" onclick="previewShopItem('${item.id}')">${item.type==='slogan'?'🎛️ 위치 조정':'👀 미리보기'}</button><button class="${equipped?'btn-pixel-black':'btn-pixel-white'}" style="width:100%;" onclick="${equipped?`unequipShopItem('${item.id}')`:`equipShopItem('${item.id}')`}">${equipped?'장착 해제':'장착하기'}</button></div>`}).join('')}</div>`:`<div style="padding:30px;text-align:center;color:#94A3B8;font-weight:800">아직 구입한 아이템이 없어요.</div>`}`;
      }

      if (state.tab === 'shop') {
        const schoolId=getCharSchoolId(),vd=getCharacterVariantData(),visibleItems=getAllShopItems().filter(item=>item.type===state.shopCategory&&(item.school==='all'||item.school===schoolId));
        const labels={accessory:'🎀 액세서리',background:'🖼️ 배경',slogan:'🏳️ 슬로건',frame:'🖼️ 프레임'},previewItem=getShopItem(state.shopPreviewItemId);
        return `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap"><div><h4 style="font-weight:900;margin:0 0 4px">🛍️ 꾸미기 상점</h4><div style="font-size:11.5px;color:#64748B;font-weight:700">${CHAR_META[state.char].name} · ${SCHOOL_LABELS[schoolId]||CHAR_META[state.char].school}</div></div><div style="font-weight:900;color:#7C3AED;background:#F5F3FF;border:1.5px solid #C4B5FD;border-radius:9px;padding:7px 10px">🎟️ ${state.userData.shop.tickets}장</div></div>

    function getDefaultPreviewTransform(item){
      if(!item) return {x:0,y:0,scale:100,opacity:100,rotate:0};

      if(slot==='face') return {x:0,y:-10,scale:44,opacity:100,rotate:0};
      if(slot==='side') return {x:72,y:36,scale:36,opacity:100,rotate:0};
      return {x:0,y:0,scale:92,opacity:95,rotate:0};
    }
    function getPreviewTransform(item, charKey=state.char, variantId=null){
      if(!item) return {x:0,y:0,scale:100,opacity:100,rotate:0};
      const resolvedVariant=variantId || (charKey===state.char ? (state.charVariant||'default') : 'default');
      const variantShop=getCharacterVariantData(charKey,resolvedVariant);
      const key=`${charKey}:${resolvedVariant}:${item.id}`;
      const saved=variantShop.transforms?.[item.id];
      if(saved&&!state.shopPreviewTransforms[key]) state.shopPreviewTransforms[key]={rotate:0,...saved};
      if(!state.shopPreviewTransforms[key]) state.shopPreviewTransforms[key]=getDefaultPreviewTransform(item);
      return state.shopPreviewTransforms[key];
    }
    function previewShopItem(id){

      render();

    function updateShopPreviewTransform(id,key,value){
      const item=getShopItem(id); if(!item) return;
      const t=getPreviewTransform(item);
      t[key]=Number(value);
      if(state.userData?.shop){
        const variantShop=getCharacterVariantData();
        variantShop.transforms[id]={...t};
      }
      const el=document.getElementById('shop-preview-moving-layer');
      if(el){
        el.style.left=`calc(50% + ${t.x}px)`;
        el.style.top=`calc(50% + ${t.y}px)`;
        el.style.width=`${t.scale}%`;
        el.style.opacity=String(t.opacity/100);
        el.style.transform=`translate(-50%,-50%) rotate(${t.rotate || 0}deg)`;
      }
      const label=document.getElementById(`preview-${key}-value`);
      if(label) label.textContent =
        key==='opacity' ? `${t[key]}%` :
        key==='scale' ? `${t[key]}%` :
        key==='rotate' ? `${t[key]}°` :
        `${t[key]}px`;
    }
    function resetShopPreviewTransform(id){
      const item=getShopItem(id); if(!item) return;
      const key=`${state.char}:${state.charVariant||'default'}:${id}`;

      const variantShop=getCharacterVariantData();
      variantShop.transforms[id]={...state.shopPreviewTransforms[key]};
      render();
    }

    async function addExtraVariant(){
      const name=document.getElementById('custom-variant-name')?.value.trim();
      const file=document.getElementById('custom-variant-file')?.files?.[0];
      if(!name||!file)return alert('버전 이름과 이미지를 선택해주세요.');
      const id=`custom_variant_${Date.now()}`,assetId=`asset_${Date.now()}_variant`;

      let filePath='';
      try{
        const up=await uploadCustomFileToCloud(file,'characters',assetId);
        filePath=up.path;CUSTOM_ASSET_URLS[assetId]=up.url;
        setCustomCloudStatus('✅ 클라우드에 저장됨');
      }catch(e){
        console.warn('Cloud upload failed; saving locally:',e);
        await putCustomAsset(assetId,file);
        setCustomCloudStatus('⚠️ 클라우드 연결 실패 · 이 기기에 임시 저장됨', true);
      }

      CUSTOM_CONTENT.variants.push({id,name,charKey:state.char,assetId,filePath});
      saveCustomContent();
      if(filePath) await saveCloudCustomContent({cloudReadyOnly:true});
      state.charVariant=id;
      render();
    }

    async function addExtraItem(){
      const name=document.getElementById('custom-item-name')?.value.trim();
      const file=document.getElementById('custom-item-file')?.files?.[0];
      if(!name||!file)return alert('아이템 이름과 이미지를 선택해주세요.');
      const type=document.getElementById('custom-item-type').value;
      const id=`custom_item_${Date.now()}`,assetId=`asset_${Date.now()}_item`;
      let filePath='';

      try{
        const up=await uploadCustomFileToCloud(file,type==='background'?'backgrounds':type==='slogan'?'slogans':type==='frame'?'frames':'accessories',assetId);
        filePath=up.path;CUSTOM_ASSET_URLS[assetId]=up.url;
        setCustomCloudStatus('✅ 클라우드에 저장됨');
      }catch(e){
        console.warn('Cloud upload failed; saving locally:',e);
        await putCustomAsset(assetId,file);
        setCustomCloudStatus('⚠️ 클라우드 연결 실패 · 이 기기에 임시 저장됨', true);
      }

      const item={
        id,name,type,
        slot:type==='accessory'?document.getElementById('custom-item-slot').value:null,
        school:document.getElementById('custom-item-school').value||'all',
        price:Math.max(0,Number(document.getElementById('custom-item-price').value)||0),
        assetId,filePath,custom:true
      };
      CUSTOM_CONTENT.items.push(item);
      saveCustomContent();
      if(filePath) await saveCloudCustomContent({cloudReadyOnly:true});

      if(item.price===0){
        const charShop=getCharacterShopData();
        if(!charShop.ownedItems.includes(id))charShop.ownedItems.push(id);
        await saveUserDataToCloud(state.user,state.lang,state.char,state.userData);
      }
      alert(item.price===0?'아이템을 추가하고 현재 캐릭터 인벤토리에 넣었습니다.':'아이템을 상점에 추가했습니다.');
      render();
    }

    async function addExtraBgm(){
      const title=document.getElementById('custom-bgm-title')?.value.trim();
      const file=document.getElementById('custom-bgm-file')?.files?.[0];
      if(!title||!file)return alert('곡 이름과 MP3/오디오 파일을 선택해주세요.');
      const id=`custom_bgm_${Date.now()}`,assetId=`asset_${Date.now()}_bgm`;
      let filePath='';

      try{
        const up=await uploadCustomFileToCloud(file,'bgm',assetId);
        filePath=up.path;CUSTOM_ASSET_URLS[assetId]=up.url;
        setCustomCloudStatus('✅ 클라우드에 저장됨');
      }catch(e){
        console.warn('Cloud BGM upload failed; saving locally:',e);
        await putCustomAsset(assetId,file);
        setCustomCloudStatus('⚠️ 클라우드 연결 실패 · 이 기기에 임시 저장됨', true);
      }

      CUSTOM_CONTENT.bgm.push({id,title,assetId,filePath,custom:true});
      saveCustomContent();
      if(filePath) await saveCloudCustomContent({cloudReadyOnly:true});
      selectedBgmId=id;
      localStorage.setItem('haikyu_bgm_track',id);
      syncBgmSource(false);
      render();
    }

    async function saveExtraSpeech(){
      CUSTOM_CONTENT.speech[state.char]=CUSTOM_CONTENT.speech[state.char]||{};
      ['enter','quizCorrect','quizWrong','hardCorrect','hardWrong','spellCorrect','spellWrong','food','train','saved'].forEach(k=>{
        CUSTOM_CONTENT.speech[state.char][k]=document.getElementById(`speech-${k}`)?.value.trim()||'';
      });
      await saveCloudCustomContent();
      state.speech=getCharSpeech('enter',state.lang==='ja'?'일본어':'영어');
      alert('현재 캐릭터의 사용자 대사를 클라우드에 저장했습니다.');
      render();
    }

    async function deleteExtraVariant(id){
      const v=CUSTOM_CONTENT.variants.find(x=>x.id===id);if(!v)return;
      if(!confirm(`${v.name} 버전을 삭제할까요?`))return;
      if(v.filePath)await deleteCustomFileFromCloud(v.filePath);
      await deleteCustomAsset(v.assetId).catch(()=>{});
      CUSTOM_CONTENT.variants=CUSTOM_CONTENT.variants.filter(x=>x.id!==id);
      if(state.charVariant===id)state.charVariant='default';
      await saveCloudCustomContent();render();
    }

    async function deleteExtraBgm(id){
      const b=CUSTOM_CONTENT.bgm.find(x=>x.id===id);if(!b)return;
      if(!confirm(`${b.title} BGM을 삭제할까요?`))return;
      bgmAudio.pause();isBgmPlaying=false;
      if(b.filePath)await deleteCustomFileFromCloud(b.filePath);
      await deleteCustomAsset(b.assetId).catch(()=>{});
      CUSTOM_CONTENT.bgm=CUSTOM_CONTENT.bgm.filter(x=>x.id!==id);
      if(selectedBgmId===id)selectedBgmId=BGM_TRACKS[0].id;
      localStorage.setItem('haikyu_bgm_track',selectedBgmId);
      await saveCloudCustomContent();syncBgmSource(false);render();
    }

    function merryAddCustomQuestion(){
      const q=String(document.getElementById('merry-custom-q')?.value||'').trim();

        const opts=[0,1,2,3].map(i=>String(document.getElementById(`merry-custom-o${i}`)?.value||'').trim());

      const sets=normalizeCustomQuizSets();
      sets.unshift({
        id:`customquiz_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,

    function merryStartCustomQuiz(id){

      if(!set||!Array.isArray(set.questions)||!set.questions.length)return alert('문제가 없는 퀴즈입니다.');

    function merryStartStandalone(set){
      merryStopTimers();
      const customId=String(set||'').startsWith('custom:')?String(set).slice(7):null;
      const customSet=customId?normalizeCustomQuizSets().find(x=>x.id===customId):null;
      const source=customSet
        ? customSet.questions
        : set==='intransitive'
          ? MERRY_INTRANSITIVE
          : set==='collocation'
            ? MERRY_COLLOCATIONS
            : set==='collocationUpload'
              ? MERRY_COLLOCATION_UPLOAD
              : set==='partsOfSpeech'
                ? MERRY_PARTS_OF_SPEECH
                : set==='day1p5'
                  ? MERRY_DAY1_P5
                  : MERRY_PREP_NOUN_PREP;

      // 자료에 들어 있는 항목을 하나도 빼지 않고 전부 출제합니다.
      // 랜덤 10문제 제한 없이 원본 자료 순서를 그대로 유지합니다.
      merryStandalone={
        mode:'play',
        set,
        deck:source.map((x,i)=>({x,i,q:null})),
        idx:0,
        score:0,
        correct:0,
        wrong:[],
        locked:false,
        selected:null,
        reward:null,
        rewarded:false
      };
      merryState.screen='standalone';
      merryRenderOnly();
    }

    function merryStandaloneQuestion(){
      const entry=merryStandalone.deck[merryStandalone.idx];
      if(!entry)return null;

      // 같은 문제를 다시 렌더링해도 보기 순서가 절대 바뀌지 않도록 캐시
      if(entry.q)return entry.q;

      const item=entry.x;
      let q=null;

      if(String(merryStandalone.set||'').startsWith('custom:')){
        if(item.type==='subjective'){
          q={type:'subjective',stem:item.q,sub:'직접 만든 주관식 퀴즈',answer:item.answer,options:[],explain:item.e||`정답: ${item.answer}`};
        }else{
          const answer=item.o[item.a];
          q={type:'objective',stem:item.q,sub:'직접 만든 객관식 퀴즈',answer,options:[...item.o],explain:item.e||`정답: ${answer}`};
        }
      }else if(merryStandalone.set==='intransitive'){
        const [base,answer,meaning]=item;
        const distract=merryShuffle([...new Set(MERRY_INTRANSITIVE.map(x=>x[1]).filter(x=>x!==answer))]).slice(0,3);
        q={stem:`${base} ( □ )`,sub:meaning,answer,options:merryShuffle([answer,...distract])};
      }else if(merryStandalone.set==='collocation'){
        const [phrase,answer,meaning]=item;
        const stem=phrase.includes(answer)?phrase.replace(answer,'□'):`□ ${phrase}`;
        const distract=merryShuffle([...new Set(MERRY_COLLOCATIONS.map(x=>x[1]).filter(x=>x!==answer))]).slice(0,3);
        q={stem,sub:meaning,answer,options:merryShuffle([answer,...distract])};
      }else if(merryStandalone.set==='collocationUpload'){
        const [stem,answer,meaning]=item;
        const distract=merryShuffle([...new Set(MERRY_COLLOCATION_UPLOAD.map(x=>x[1]).filter(x=>x!==answer))]).slice(0,3);
        q={stem,sub:meaning,answer,options:merryShuffle([answer,...distract]),explain:`정답: ${answer} · ${meaning}`};
      }else if(merryStandalone.set==='partsOfSpeech'){
        const answer=item.o[item.a];
        q={stem:item.q,sub:'빈칸에 가장 알맞은 품사를 고르세요.',answer,options:[...item.o],explain:item.e};
      }else if(merryStandalone.set==='day1p5'){
        const answer=item.o[item.a];
        q={stem:item.q,sub:'Day 1 · Part 5 핵심 포인트',answer,options:[...item.o],explain:item.e};
      }else{
        const [phrase,meaning]=item;
        const distract=merryShuffle([...new Set(MERRY_PREP_NOUN_PREP.map(x=>x[0]).filter(x=>x!==phrase))]).slice(0,3);
        q={stem:meaning,sub:'뜻에 맞는 표현을 고르세요.',answer:phrase,options:merryShuffle([phrase,...distract])};
      }

      entry.q=q;
      return q;
    }

    function merryAnswerStandaloneByIndex(index){
      if(merryStandalone.locked)return;
      const q=merryStandaloneQuestion();
      if(!q)return;
      const choice=q.options[Number(index)];
      if(typeof choice==='undefined')return;

      merryStandalone.locked=true;
      merryStandalone.selected=choice;

      if(choice===q.answer){
        merryStandalone.correct++;
        merryStandalone.score+=10;
      }else{
        merryStandalone.wrong.push({q,chosen:choice});
      }
      merryRenderOnly(choice===q.answer?'ok':'no');
    }
    function merrySubmitStandaloneSubjective(){
      if(merryStandalone.locked)return;
      const q=merryStandaloneQuestion();
      if(!q||q.type!=='subjective')return;
      const input=document.getElementById('merry-standalone-subjective');
      const raw=String(input?.value||'').trim();
      if(!raw)return alert('답을 입력해주세요.');
      const norm=x=>String(x||'').toLowerCase().replace(/[\s·・.。,!！?？()（）\[\]{}'"“”‘’]/g,'').trim();
      const accepted=String(q.answer||'').split(/[,/;、]|(?:\s*[·・]\s*)/).map(norm).filter(Boolean);
      const correct=accepted.includes(norm(raw));
      merryStandalone.locked=true;
      merryStandalone.selected=raw;
      if(correct){merryStandalone.correct++;merryStandalone.score+=10;}
      else merryStandalone.wrong.push({q,chosen:raw});
      merryRenderOnly(correct?'ok':'no');
    }


    function merryNextStandalone(){
      if(!merryStandalone.locked)return;
      merryStandalone.idx++;
      if(merryStandalone.idx>=merryStandalone.deck.length){
        merryStandalone.mode='result';
        const reward=merryApplyStandaloneReward();

        merryStandalone.locked=false;

    }

    function merryStandaloneTitle(){

        :merryStandalone.set==='day1p5'?'Day 1 P5'
        :'전치사 + 명사 + 전치사';

    function merryTicketReward(correct,total){
      if(!total)return 0;
      const rate=correct/total;
      if(rate>=0.999)return 3;
      if(rate>=0.8)return 2;
      if(rate>=0.6)return 1;
      return 0;
    }

    function merryApplyStandaloneReward(){
      if(merryStandalone.rewarded)return merryStandalone.reward;
      const correct=Number(merryStandalone.correct||0);
      const total=Number(merryStandalone.deck.length||10);

      // 퀴즈 종료 보상: 정답 1개당 3 EXP + 4 코인
      const exp=correct*3;
      const coins=correct*4;
      const tickets=merryTicketReward(correct,total);

      state.userData.exp=Number(state.userData.exp||0)+exp;
      state.userData.coins=Number(state.userData.coins||0)+coins;
      state.userData.shop=normalizeShopData(state.userData.shop);
      state.userData.shop.tickets=Number(state.userData.shop.tickets||0)+tickets;

      merryStandalone.reward={exp,coins,tickets};
      merryStandalone.rewarded=true;
      return merryStandalone.reward;
    }

    function merryApplyMainReward(){
      if(merryState.rewarded)return merryState.reward;

      // ROUND 1은 60초라 문제 수가 무제한이므로 보상 파밍 방지를 위해
      // ROUND 2 실전 10문제 정확도를 기준으로 지급
      const correct=Number(merryState.r2Correct||0);
      const exp=correct*4;
      const coins=correct*5;
      const tickets=merryTicketReward(correct,10);

      state.userData.exp=Number(state.userData.exp||0)+exp;
      state.userData.coins=Number(state.userData.coins||0)+coins;
      state.userData.shop=normalizeShopData(state.userData.shop);
      state.userData.shop.tickets=Number(state.userData.shop.tickets||0)+tickets;

      merryState.reward={exp,coins,tickets};
      merryState.rewarded=true;
      return merryState.reward;
    }


    function merryFreshState(){return {screen:'start',round1Score:0,round2Score:0,combo:0,maxCombo:0,r1Time:60,r1Deck:[],r1Current:null,r1Locked:false,r1Feedback:'',r1Wrongs:[],r1Correct:0,r1Total:0,r2Questions:[],r2Index:0,r2Time:15,r2Locked:false,r2Selected:null,r2Correct:0,r2Wrongs:[],r2Feedback:'',reward:null,rewarded:false}}
    let merryState=merryFreshState(),merryR1Timer=null,merryR2Timer=null,merryFeedbackTimer=null;

    function merryShuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    function merryBuildR1Deck(){const out=[];Object.entries(MERRY_R1_POOL).forEach(([type,words])=>words.forEach(word=>out.push({word,type})));return merryShuffle(out)}
    function merryNextR1(){if(!merryState.r1Deck.length)merryState.r1Deck=merryBuildR1Deck();merryState.r1Current=merryState.r1Deck.pop();merryState.r1Locked=false;merryState.r1Feedback='';merryRenderOnly()}
    function merryStart(){merryStopTimers();merryState=merryFreshState();merryState.screen='r1';merryState.r1Deck=merryBuildR1Deck();merryNextR1();merryR1Timer=setInterval(()=>{merryState.r1Time--;if(merryState.r1Time<=0){merryState.r1Time=0;merryEndR1();return}merryUpdateTimerOnly()},1000)}
    function merryAnswerR1(choice){if(merryState.screen!=='r1'||merryState.r1Locked||!merryState.r1Current)return;merryState.r1Locked=true;merryState.r1Total++;const cur=merryState.r1Current,correct=choice===cur.type;if(correct){merryState.combo++;merryState.maxCombo=Math.max(merryState.maxCombo,merryState.combo);let add=10;if(merryState.combo%3===0)add+=5;merryState.round1Score+=add;merryState.r1Correct++;merryState.r1Feedback=`정답! +${add}점${add>10?' · 콤보 보너스':''}`}else{merryState.combo=0;merryState.r1Feedback=`정답은 ${cur.type}예요`;if(!merryState.r1Wrongs.some(x=>x.word===cur.word))merryState.r1Wrongs.push({word:cur.word,correct:cur.type,chosen:choice})}merryRenderOnly(correct?'ok':'no');clearTimeout(merryFeedbackTimer);merryFeedbackTimer=setTimeout(()=>{if(merryState.screen==='r1')merryNextR1()},800)}
    function merryEndR1(){clearInterval(merryR1Timer);merryR1Timer=null;clearTimeout(merryFeedbackTimer);merryState.screen='between';merryRenderOnly()}
    function merryStartR2(){merryState.screen='r2';merryState.r2Questions=merryShuffle(MERRY_R2_BANK).slice(0,10);merryState.r2Index=0;merryState.r2Correct=0;merryState.r2Wrongs=[];merryState.round2Score=0;merryPrepareR2()}
    function merryPrepareR2(){clearInterval(merryR2Timer);merryState.r2Time=15;merryState.r2Locked=false;merryState.r2Selected=null;merryState.r2Feedback='';merryRenderOnly();merryR2Timer=setInterval(()=>{merryState.r2Time--;if(merryState.r2Time<=0){merryState.r2Time=0;clearInterval(merryR2Timer);merryR2Timer=null;merryTimeoutR2();return}merryUpdateTimerOnly()},1000)}
    function merryAnswerR2(idx){if(merryState.screen!=='r2'||merryState.r2Locked)return;clearInterval(merryR2Timer);merryR2Timer=null;merryState.r2Locked=true;merryState.r2Selected=idx;const q=merryState.r2Questions[merryState.r2Index],correct=idx===q.a;if(correct){merryState.r2Correct++;merryState.round2Score+=20;merryState.r2Feedback='정답이에요!'}else{merryState.r2Feedback=q.e;merryState.r2Wrongs.push({...q,selected:idx,timeout:false})}merryRenderOnly(correct?'ok':'no')}
    function merryTimeoutR2(){if(merryState.r2Locked)return;merryState.r2Locked=true;merryState.r2Selected=-1;const q=merryState.r2Questions[merryState.r2Index];merryState.r2Feedback=`시간이 끝났어요. ${q.e}`;merryState.r2Wrongs.push({...q,selected:-1,timeout:true});merryRenderOnly('no')}
    function merryNextR2(){if(!merryState.r2Locked)return;merryState.r2Index++;if(merryState.r2Index>=merryState.r2Questions.length){
        clearInterval(merryR2Timer);merryR2Timer=null;merryState.screen='result';
        const reward=merryApplyMainReward();
        state.userData.studyHistory=Array.isArray(state.userData.studyHistory)?state.userData.studyHistory:[];
        state.userData.studyHistory.push({
          date:new Date().toISOString().split('T')[0],
          type:'merry_preposition_conjunction',
          total:10,
          correct:merryState.r2Correct,
          score:merryState.round1Score+merryState.round2Score,
          reward
        });
        saveUserData();
        merryRenderOnly();
        return
      }merryPrepareR2()}

      if(merryState.screen==='r1')return `<div class="merry-wrap merry-fade"><div class="merry-topline"><span class="merry-round-badge">ROUND 1 · 스피드 분류</span><span class="merry-score">점수 ${merryState.round1Score} · 콤보 ${merryState.combo}</span></div><div class="merry-topline"><span>60초 타임어택</span><span id="merry-timer-text">${merryState.r1Time}초</span></div><div class="merry-timer-track"><div id="merry-timer-fill" class="merry-timer-fill ${merryState.r1Time<=10?'danger':''}" style="width:${merryState.r1Time/60*100}%"></div></div><div class="merry-word-stage"><div class="merry-word">${merryState.r1Current?.word||''}</div><div class="merry-feedback ${merryState.r1Feedback.startsWith('정답!')?'ok':'no'}">${merryState.r1Feedback||'품사를 골라보세요 👉'}</div></div><div class="merry-choice-grid">${['전치사','접속사','접속부사'].map(x=>`<button type="button" class="merry-btn merry-choice" ${merryState.r1Locked?'disabled':''} onclick="merryAnswerR1('${x}')">${x}</button>`).join('')}</div></div>`;

      if(merryState.screen==='r2'){const q=merryState.r2Questions[merryState.r2Index];return `<div class="merry-wrap merry-fade"><div class="merry-topline"><span class="merry-round-badge">ROUND 2 · 실전 빈칸 저격</span><span>${merryState.r2Index+1} / 10</span></div><div class="merry-topline"><span class="merry-score">정답 ${merryState.r2Correct} · 점수 ${merryState.round2Score}</span><span id="merry-timer-text">${merryState.r2Time}초</span></div><div class="merry-timer-track"><div id="merry-timer-fill" class="merry-timer-fill ${merryState.r2Time<=10?'danger':''}" style="width:${merryState.r2Time/15*100}%"></div></div><div class="merry-card"><div class="merry-q">${q.q}</div><div class="merry-options">${q.o.map((opt,i)=>{let cls='';if(merryState.r2Locked&&i===q.a)cls='correct';else if(merryState.r2Locked&&i===merryState.r2Selected&&i!==q.a)cls='wrong';return `<button type="button" class="merry-btn merry-option ${cls}" ${merryState.r2Locked?'disabled':''} onclick="merryAnswerR2(${i})">(${String.fromCharCode(65+i)}) ${opt}</button>`}).join('')}</div>${merryState.r2Locked?`<div class="merry-explain">${merryState.r2Selected===q.a?'정답이에요! ':merryState.r2Selected===-1?'시간 초과! ':''}${q.e}</div><button type="button" class="merry-btn merry-primary merry-next" onclick="merryNextR2()">${merryState.r2Index===9?'결과 보기':'다음'}</button>`:''}</div></div>`}


      if(merryState.screen==='standalone'){
        if(merryStandalone.mode==='result'){
          return `<div class="merry-wrap merry-fade"><div class="merry-card"><div class="merry-brand">메리토익 · Merry TOEIC</div><div class="merry-title">${merryStandaloneTitle()} 결과</div><div class="merry-result-grid"><div class="merry-stat"><b>${merryStandalone.score}</b>점수</div><div class="merry-stat"><b>${merryStandalone.correct}/${merryStandalone.deck.length}</b>정답</div><div class="merry-stat"><b>${Math.round(merryStandalone.correct/merryStandalone.deck.length*100)}%</b>정확도</div></div><div style="margin:10px 0 16px;padding:12px;border-radius:12px;background:#FFFBEB;border:1px solid #FDE68A;font-size:13px;font-weight:900;">🎁 완료 보상 · +${merryStandalone.reward?.exp||0} EXP · +${merryStandalone.reward?.coins||0} 코인 · +${merryStandalone.reward?.tickets||0} 응원 티켓</div><div class="merry-wrong-section"><h3>오답 노트</h3>${merryStandalone.wrong.length?merryStandalone.wrong.map((w,i)=>`<div class="merry-wrong-item"><b>${i+1}. ${w.q.stem}</b><br>정답: ${w.q.answer}<br>내가 고른 답: ${w.chosen}<br><span style="color:#6B7280;">${w.q.explain||w.q.sub}</span></div>`).join(''):`<div class="merry-wrong-item">틀린 문제가 없어요. 아주 좋아요!</div>`}</div><button type="button" class="merry-btn merry-primary" style="margin-top:16px;" onclick="merryStartStandalone('${merryStandalone.set}')">다시 풀기</button><button type="button" class="merry-btn merry-choice" style="width:100%;margin-top:8px;" onclick="merryGoHome()">🏠 다른 퀴즈 풀러 가기</button></div></div>`;
        }
        const q=merryStandaloneQuestion();
        const isSubjective=q?.type==='subjective';
        const normalizedSelected=String(merryStandalone.selected||'').toLowerCase().replace(/[\s·・.。,!！?？()（）\[\]{}'"“”‘’]/g,'').trim();
        const accepted=String(q?.answer||'').split(/[,/;、]|(?:\s*[·・]\s*)/).map(x=>x.toLowerCase().replace(/[\s·・.。,!！?？()（）\[\]{}'"“”‘’]/g,'').trim()).filter(Boolean);
        const subjectiveCorrect=isSubjective&&merryStandalone.locked&&accepted.includes(normalizedSelected);
        return `<div class="merry-wrap merry-fade"><div class="merry-topline"><span class="merry-round-badge">${merryStandaloneTitle()}</span><span>${merryStandalone.idx+1} / ${merryStandalone.deck.length}</span></div><div class="merry-topline"><span class="merry-score">점수 ${merryStandalone.score}</span><span>정답 ${merryStandalone.correct}</span></div><div class="merry-card"><div class="merry-q">${q.stem}</div><div class="merry-sub" style="margin-bottom:12px;">${q.sub}</div>
          ${isSubjective?`
            <input id="merry-standalone-subjective" class="std-input" placeholder="정답을 입력하세요" ${merryStandalone.locked?'disabled':''} value="${merryStandalone.locked?escHtml(merryStandalone.selected||''):''}" onkeydown="if(event.key==='Enter')merrySubmitStandaloneSubjective();">
            ${!merryStandalone.locked?`<button type="button" class="merry-btn merry-primary" style="width:100%;margin-top:10px;" onclick="merrySubmitStandaloneSubjective()">정답 확인</button>`:''}
          `:`
            <div class="merry-options">${q.options.map((opt,optIndex)=>{let cls='';if(merryStandalone.locked&&opt===q.answer)cls='correct';else if(merryStandalone.locked&&opt===merryStandalone.selected&&opt!==q.answer)cls='wrong';return `<button type="button" class="merry-btn merry-option ${cls}" ${merryStandalone.locked?'disabled':''} onclick="merryAnswerStandaloneByIndex(${optIndex})">${opt}</button>`}).join('')}</div>
          `}
          ${merryStandalone.locked?`<div class="merry-explain">${isSubjective?(subjectiveCorrect?'정답이에요!':'정답은 '+q.answer+'예요.'):(merryStandalone.selected===q.answer?'정답이에요!':'정답은 '+q.answer+'예요.')}<br>${q.explain||q.sub}</div><button type="button" class="merry-btn merry-primary merry-next" onclick="merryNextStandalone()">${merryStandalone.idx===merryStandalone.deck.length-1?'결과 보기':'다음'}</button>`:''}</div></div>`;
      }

      const total=merryState.round1Score+merryState.round2Score,level=merryLevel();
      return `<div class="merry-wrap merry-fade"><div class="merry-card"><div class="merry-brand">메리토익 · Merry TOEIC</div><div class="merry-title">퀴즈 결과</div><div class="merry-level"><h3>${level.t}</h3><div style="font-weight:800;line-height:1.55;">${level.m}</div><div class="merry-note" style="margin-top:6px;">* 재미를 위한 레벨이며 실제 TOEIC 점수가 아니에요.</div></div><div class="merry-result-grid"><div class="merry-stat"><b>${total}</b>총점</div><div class="merry-stat"><b>${merryState.round1Score}</b>ROUND 1</div><div class="merry-stat"><b>${merryState.round2Score}</b>ROUND 2</div><div class="merry-stat"><b>${merryState.maxCombo}</b>최대 콤보</div><div class="merry-stat"><b>${merryState.r2Correct}/10</b>실전 정답</div><div class="merry-stat"><b>${merryState.r2Correct*10}%</b>ROUND 2 정확도</div></div><div style="margin:10px 0 16px;padding:12px;border-radius:12px;background:#FFFBEB;border:1px solid #FDE68A;font-size:13px;font-weight:900;">🎁 완료 보상 · +${merryState.reward?.exp||0} EXP · +${merryState.reward?.coins||0} 코인 · +${merryState.reward?.tickets||0} 응원 티켓</div><div class="merry-wrong-section"><h3>오답 노트</h3><h4>ROUND 1 · 헷갈린 단어</h4>${merryState.r1Wrongs.length?merryState.r1Wrongs.map(x=>`<div class="merry-wrong-item"><b>${x.word}</b> → ${x.correct} (${merryTypeHint(x.correct)}) · 내가 고른 품사: ${x.chosen}</div>`).join(''):`<div class="merry-wrong-item">틀린 단어가 없어요. 아주 좋아요!</div>`}<h4 style="margin-top:18px;">ROUND 2 · 틀린 문제</h4>${merryState.r2Wrongs.length?merryState.r2Wrongs.map((x,i)=>`<div class="merry-wrong-item"><b>${i+1}. ${x.q}</b><br>정답: (${String.fromCharCode(65+x.a)}) ${x.o[x.a]}<br><span style="color:#6B7280;">${x.e}</span>${x.timeout?'<br><span style="color:#DC2626;">시간 초과</span>':''}</div>`).join(''):`<div class="merry-wrong-item">라운드 2를 모두 맞혔어요!</div>`}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;">

        <button type="button" class="merry-btn merry-choice" onclick="merryGoHome()">🏠 다른 퀴즈 풀러 가기</button>
      </div>
      <div class="merry-note" style="text-align:center;margin-top:12px;">메리토익 (Merry TOEIC)</div></div></div>`;
    }

    function switchTab(t) {
      if(state.tab === 'merryChallenge' && t !== 'merryChallenge') merryStopTimers();
      state.tab = t;
      if (t === 'practice') initFlashcards();
      if (t === 'quiz') generateQuiz();
      if (t === 'hard') generateHardQuiz();
      if (t === 'spell') generateSpellQuiz();
      render();
    }

    function onDayChange(val) {
      state.selectedDay = val;
      if (state.tab === 'practice') clearPracticeShuffle();
      if (state.tab === 'quiz') generateQuiz();
      if (state.tab === 'hard') generateHardQuiz();
      if (state.tab === 'spell') generateSpellQuiz();
      render();
    }

    function addCareExp(amount) {
      const oldLevel = getCharInfo().level;
      state.userData.exp = Number(state.userData.exp || 0) + amount;
      const newLevel = getCharInfo().level;
      if (newLevel > oldLevel) {
        setTimeout(() => alert(`🎉 파트너 승격! [Lv.${newLevel} ${STAGE_TITLES[newLevel - 1]}]`), 0);
      }
    }

    function feedPartner() {
      const meta = CHAR_META[state.char] || CHAR_META.kageyama;
      if (state.userData.coins < CARE_COSTS.food) {
        alert(`${meta.name}에게 ${meta.food}을(를) 주려면 ${CARE_COSTS.food}코인이 필요합니다.`);
        return;
      }

      state.userData.coins -= CARE_COSTS.food;
      addCareExp(10);
      state.userData.satisfaction = Math.min(4, Number(state.userData.satisfaction || 0) + 1);
      state.mood = 'happy';
      state.speech = getCharSpeech('food');
      saveUserData();
      render();
    }

    function actionPartner() {
      const meta = CHAR_META[state.char] || CHAR_META.kageyama;
      if (state.userData.coins < CARE_COSTS.train) {
        alert(`${meta.act}에는 ${CARE_COSTS.train}코인이 필요합니다.`);
        return;
      }

      state.userData.coins -= CARE_COSTS.train;
      addCareExp(20);
      state.userData.stamina = Math.min(4, Number(state.userData.stamina || 0) + 1);
      state.mood = 'happy';
      state.speech = getCharSpeech('train');
      saveUserData();
      render();
    }

    function toggleFlashcardMeaning() { state.fcShowMeaning = !state.fcShowMeaning; render(); }
    function prevFlashcard() { if (state.fcIdx > 0) { state.fcIdx--; state.fcShowMeaning = false; render(); } }
    function nextFlashcard() {
      const list = getPracticeVocab();
      if (state.fcIdx < list.length - 1) { state.fcIdx++; state.fcShowMeaning = false; render(); }
    }
    function shuffleFlashcards() {
      const base=getFilteredVocab();
      if(base.length<2){
        initFlashcards();
        state.speech=getCharSpeech('shuffle');
        render();
        return;
      }
      const ids=base.map(x=>String(x.id));
      for(let i=ids.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [ids[i],ids[j]]=[ids[j],ids[i]];
      }
      // 아주 드물게 원래 순서 그대로 나온 경우 첫 두 장을 바꿔 체감상 반드시 섞이게 함
      if(ids.every((id,i)=>id===String(base[i].id))){
        [ids[0],ids[1]]=[ids[1],ids[0]];
      }
      state.practiceShuffleIds=ids;
      state.fcIdx=0;
      state.fcShowMeaning=false;
      state.speech = getCharSpeech('shuffle');
      render();
    }

    function addCurrentPracticeWord(id) {
      if (!id) return;
      if (!state.userData.myVocabIds.includes(id)) {
        state.userData.myVocabIds.push(id);
        state.userData.myVocabIds = Array.from(new Set(state.userData.myVocabIds));
        state.speech = getCharSpeech('saved'); saveUserData();
      }
      render();
    }

    function handleQuizOpt(opt) {
      if (state.quizAnswered) return;
      const q = state.quizQuestions[state.quizIdx];
      state.quizSelectedOpt = opt;
      state.quizAnswered = true;
      const isCorr = (opt === q.cAns);
      if (isCorr) {
        state.quizScore.correct++;
        state.mood = 'happy';
        state.speech = getCharSpeech('quizCorrect');
      } else {
        if (!state.quizScore.wrongIds.includes(q.id)) state.quizScore.wrongIds.push(q.id);
        const today=localDateKey();
        state.userData.todayWrongAnswers=Array.isArray(state.userData.todayWrongAnswers)?state.userData.todayWrongAnswers:[];
        state.userData.todayWrongAnswers.push({key:`${today}_quiz_${q.id}_${Date.now()}`,date:today,id:q.id,word:q.word,meaning:q.cAns,correctAnswer:q.cAns,userAnswer:opt,selectedAnswer:opt,mode:'quiz'});
        state.userData.todayWrongAnswers=state.userData.todayWrongAnswers.slice(-800);
        saveUserData();
        state.mood = 'angry';
        state.speech = getCharSpeech('quizWrong');
      }
      render();
    }

    function nextQuiz() {
      if (state.quizIdx < state.quizQuestions.length - 1) {
        state.quizIdx++;
        state.quizAnswered = false;
        state.quizSelectedOpt = null;
      } else {
        state.quizScore.finished = true;
        const reward = calculateTestReward('quiz', state.quizScore.correct);
        state.lastTicketGain = awardCheerTickets('quiz', state.quizScore.correct, state.quizScore.total);
        addRewards(reward.exp, reward.coins);
        if (state.quizScore.wrongIds.length > 0) {
          state.userData.myVocabIds = Array.from(new Set([...state.userData.myVocabIds, ...state.quizScore.wrongIds]));
          const tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
          state.quizScore.wrongIds.forEach(id => {
            state.userData.spacedRepData[id] = { stage: 1, nextDate: tmr.toISOString().split('T')[0] };
          });
        }
        state.userData.studyHistory.push({
          date: new Date().toISOString().split('T')[0],
          type: 'quiz',
          scope: getTestScopeKey(),
          total: state.quizScore.total,
          correct: state.quizScore.correct
        });
        saveUserData();
      }
      render();
    }

    function getTodayWrongRows(mode){
      const today=localDateKey(),seen=new Set(),rows=[];
      (state.userData.todayWrongAnswers||[]).slice().reverse().forEach(x=>{
        if(!x||x.date!==today||(mode&&x.mode!==mode))return;
        const k=`${x.mode||'hard'}_${x.id||x.word}`;
        if(!seen.has(k)){seen.add(k);rows.push(x)}
      });
      return rows;
    }

    function startTodayWrongReview(mode){
      const rows=getTodayWrongRows(mode);
      const ids=rows.map(x=>x.id).filter(Boolean);
      const pool=getAllWords().filter(w=>ids.includes(w.id));
      if(!pool.length)return alert('오늘 재시험할 해당 유형의 오답이 없습니다.');

      if(mode==='hard'){
        state.hardQuestions=pool.map(x=>({id:x.id,word:x.word,meaning:x.meaning}));
        state.hardIdx=0;state.hardAnswered=false;state.hardIsCorrect=false;state.hardLastAnswer='';
        state.hardScore={correct:0,total:pool.length,finished:false,wrongIds:[]};
        state.tab='hard';
      }else if(mode==='quiz'){
        const db=getAllWords();
        state.quizQuestions=pool.map(item=>{
          const others=db.filter(d=>d.id!==item.id&&d.meaning!==item.meaning).sort(()=>Math.random()-.5).slice(0,3);
          const opts=[item.meaning,...others.map(o=>o.meaning)];
          for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}
          return {id:item.id,word:item.word,cAns:item.meaning,opts};
        });
        state.quizIdx=0;state.quizAnswered=false;state.quizSelectedOpt=null;
        state.quizScore={correct:0,total:state.quizQuestions.length,wrongIds:[],finished:false};
        state.tab='quiz';
      }else if(mode==='spell'){
        if(state.lang==='ja')return alert('일본어에서는 스펠링 시험을 사용하지 않아요.');
        state.spellQuestions=pool.map(item=>{
          const word=item.raw_word||item.word;
          const chars=word.split(''),maskCount=Math.max(1,Math.round(chars.length*.4)),maskIndices=[];
          while(maskIndices.length<maskCount&&maskIndices.length<chars.length){
            const r=Math.floor(Math.random()*chars.length);if(!maskIndices.includes(r))maskIndices.push(r);
          }
          return {id:item.id,word,meaning:item.meaning,maskedWord:chars.map((c,i)=>maskIndices.includes(i)?'_':c).join(' ')};
        });
        state.spellIdx=0;state.spellAnswered=false;state.spellIsCorrect=false;
        state.spellScore={correct:0,total:state.spellQuestions.length,wrongIds:[],finished:false};
        state.tab='spell';
      }
      render();
    }

    function startTodayWrongHardReview(){startTodayWrongReview('hard')}

    function submitHard() {
      if (state.hardAnswered) return;
      const input = document.getElementById('hard-input');
      const rawVal = input.value.trim();
      const normalizeAnswer = x => String(x||'').toLowerCase().replace(/[\s·・.。,!！?？()（）\[\]{}'"“”‘’]/g,'').trim();
      const val = normalizeAnswer(rawVal);
      if (!val) return;
      const q = state.hardQuestions[state.hardIdx];
      const meanings = String(q.meaning||'').split(/[,/~;、]|(?:\s*[·・]\s*)/).map(normalizeAnswer).filter(Boolean);
      const isCorr = meanings.some(m => m === val);
      state.hardLastAnswer = rawVal;
      state.hardAnswered = true;
      state.hardIsCorrect = isCorr;
      if (isCorr) {
        state.hardScore.correct++;
        state.mood = 'happy';
        state.speech = getCharSpeech('hardCorrect');
      } else {
        if (!state.hardScore.wrongIds.includes(q.id)) state.hardScore.wrongIds.push(q.id);
        const today=localDateKey();
        state.userData.todayWrongAnswers = Array.isArray(state.userData.todayWrongAnswers) ? state.userData.todayWrongAnswers : [];
        state.userData.todayWrongAnswers.push({key:`${today}_${q.id}_${Date.now()}`,date:today,id:q.id,word:q.word,meaning:q.meaning,userAnswer:rawVal,mode:'hard'});
        state.userData.todayWrongAnswers=state.userData.todayWrongAnswers.slice(-500);
        saveUserData();
        state.mood = 'angry';
        state.speech = getCharSpeech('hardWrong');
      }
      render();
    }

    function nextHard() {
      if (state.hardIdx < state.hardQuestions.length - 1) {
        state.hardIdx++;
        state.hardAnswered = false;
        state.hardIsCorrect = false;
        state.hardLastAnswer = '';
      } else {
        state.hardScore.finished = true;
        const reward = calculateTestReward('hard', state.hardScore.correct);
        state.lastTicketGain = awardCheerTickets('hard', state.hardScore.correct, state.hardScore.total);
        addRewards(reward.exp, reward.coins);
        if (state.hardScore.wrongIds.length > 0) {
          state.userData.myVocabIds = Array.from(new Set([...state.userData.myVocabIds, ...state.hardScore.wrongIds]));
        }
        state.userData.studyHistory.push({
          date: new Date().toISOString().split('T')[0],
          type: 'hard',
          scope: getTestScopeKey(),
          total: state.hardScore.total,
          correct: state.hardScore.correct
        });
        saveUserData();
      }
      render();
    }

    function submitSpell() {
      if (state.spellAnswered) return;
      const input = document.getElementById('spell-input');
      const val = input.value.trim().toLowerCase();
      if (!val) return;
      const q = state.spellQuestions[state.spellIdx];
      const isCorr = (val === q.word.trim().toLowerCase());
      state.spellAnswered = true;
      state.spellIsCorrect = isCorr;
      if (isCorr) {
        state.spellScore.correct++;
        state.mood = 'happy';
        state.speech = getCharSpeech('spellCorrect');
      } else {
        if (!state.spellScore.wrongIds.includes(q.id)) state.spellScore.wrongIds.push(q.id);
        const today=localDateKey();
        state.userData.todayWrongAnswers=Array.isArray(state.userData.todayWrongAnswers)?state.userData.todayWrongAnswers:[];
        state.userData.todayWrongAnswers.push({key:`${today}_spell_${q.id}_${Date.now()}`,date:today,id:q.id,word:q.word,meaning:q.meaning,correctAnswer:q.word,userAnswer:input.value.trim(),mode:'spell'});
        state.userData.todayWrongAnswers=state.userData.todayWrongAnswers.slice(-800);
        saveUserData();
        state.mood = 'angry';
        state.speech = getCharSpeech('spellWrong');
      }
      render();
    }

    function nextSpell() {
      if (state.spellIdx < state.spellQuestions.length - 1) {
        state.spellIdx++;
        state.spellAnswered = false;
        state.spellIsCorrect = false;
      } else {
        state.spellScore.finished = true;
        const reward = calculateTestReward('spell', state.spellScore.correct);
        state.lastTicketGain = awardCheerTickets('spell', state.spellScore.correct, state.spellScore.total);
        addRewards(reward.exp, reward.coins);
        if (state.spellScore.wrongIds.length > 0) {
          state.userData.myVocabIds = Array.from(new Set([...state.userData.myVocabIds, ...state.spellScore.wrongIds]));
        }
        state.userData.studyHistory.push({
          date: new Date().toISOString().split('T')[0],
          type: 'spell',
          scope: getTestScopeKey(),
          total: state.spellScore.total,
          correct: state.spellScore.correct
        });
        saveUserData();
      }
      render();
    }

    function addCustomWord() {
      const d = document.getElementById('c-day').value.trim();
      const w = document.getElementById('c-word').value.trim();
      const m = document.getElementById('c-meaning').value.trim();
      if (!d || !w || !m) return alert('내용을 모두 입력해주세요.');
      const newWord = { id: `c_${Date.now()}`, day: d, word: w, raw_word: w, speech_word: w, meaning: m };
      state.userData.customWords.push(newWord);
      saveUserData();
      alert('단어가 추가되었습니다!');
      render();
    }

    function removeMyVocab(id) {
      state.userData.myVocabIds = state.userData.myVocabIds.filter(v => v !== id);
      saveUserData(); render();
    }

    function passSpacedRep(id) {
      const intervals = { 1: 3, 2: 7, 3: 14, 4: 30, 5: 30 };
      const cur = state.userData.spacedRepData[id] || { stage: 1 };
      const nextStage = Math.min(5, cur.stage + 1);
      const d = new Date();
      d.setDate(d.getDate() + (intervals[nextStage] || 30));
      state.userData.spacedRepData[id] = { stage: nextStage, nextDate: d.toISOString().split('T')[0] };
      saveUserData(); render();
    }

    window.addEventListener('beforeunload',()=>{if(state.studyTimer?.running)tickStudyTimer();saveTimerRuntime();});

    // 앱 초기화 및 CSV 데이터 자동 로딩
    (async function initApp() {
      await loadAllCSVData();
      await hydrateCustomAssets();
      if(getSelectedBgmTrack()?.file) syncBgmSource(false);
      render();
    })();
  </script>
