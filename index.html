<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer" />
  <title>하이큐 단어 훈련소</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" />
  <!-- CSV 파싱 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: 'Pretendard', sans-serif;
      background-color: #1E293B;
      color: #1E293B;
    }
    .bg-cover-wrapper {
      min-height: 100vh; width: 100%;
      background-image: url('gym.png');
      background-size: cover; background-position: center; background-repeat: no-repeat;
      background-color: #0F172A;
      display: flex; align-items: center; justify-content: center;
      padding: 20px 10px;
    }

    .login-card-gym {
      max-width: 480px; width: 100%; background: #FFFFFF;
      padding: 35px 30px; border-radius: 20px; border: 3.5px solid #1E293B;
      box-shadow: 8px 8px 0px rgba(0,0,0,0.6); text-align: center;
    }
    .lang-choice-card {
      border: 3px solid #1E293B; border-radius: 16px; padding: 20px; margin: 12px 0;
      cursor: pointer; background: #FFFFFF; transition: all 0.2s ease; display: flex;
      align-items: center; justify-content: space-between; font-weight: 900; font-size: 17px;
      box-shadow: 4px 4px 0px #1E293B;
    }
    .lang-choice-card:hover {
      background: #FFF7ED; border-color: #EA580C; transform: translateY(-3px);
      box-shadow: 6px 6px 0px #EA580C; color: #EA580C;
    }
    .char-select-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-bottom: 20px; }
    .char-radio-card {
      border: 2px solid #D4D4D8; border-radius: 12px; padding: 10px 4px 8px 4px; cursor: pointer;
      background: #FFFFFF; transition: all 0.15s ease; text-align: center;
    }
    .char-radio-card:hover { border-color: #1E293B; transform: translateY(-2px); }
    .char-radio-card.active { border-color: #EA580C; background: #FFF7ED; box-shadow: 2px 2px 0px #EA580C; }
    .mini-avatar-circle {
      width: 46px; height: 46px; border-radius: 50%; border: 2px solid #1E293B;
      background: #FFFFFF; margin: 0 auto 4px auto; overflow: hidden; display: flex;
      align-items: center; justify-content: center;
    }
    .mini-avatar-circle svg, .mini-avatar-circle img {
      width: 100%; height: 100%; object-fit: cover;
    }

    .variant-select-grid {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
      margin:14px 0 18px;
    }
    .variant-card {
      border:2px solid #D4D4D8;
      border-radius:12px;
      background:#FFFFFF;
      padding:9px;
      cursor:pointer;
      transition:all .15s ease;
      text-align:center;
    }
    .variant-card:hover {
      border-color:#EA580C;
      transform:translateY(-2px);
    }
    .variant-card.active {
      border-color:#EA580C;
      background:#FFF7ED;
      box-shadow:2px 2px 0 #EA580C;
    }
    .variant-preview {
      width:100%;
      aspect-ratio:1/1;
      border-radius:9px;
      overflow:hidden;
      border:1.5px solid #CBD5E1;
      background:#F8FAFC;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:6px;
    }
    .variant-preview img {
      width:100%;
      height:100%;
      object-fit:contain;
    }

    .minihompy-window {
      width: 1180px; max-width: 98vw;
      background: #FFFFFF; border-radius: 20px;
      border: 3.5px solid #1E293B;
      box-shadow: 0 20px 45px rgba(0,0,0,0.55);
      display: flex; flex-direction: column;
    }
    .window-top-bar {
      background: #1E293B; color: #FFFFFF;
      padding: 12px 22px; display: flex; justify-content: space-between; align-items: center;
      font-weight: 800; font-size: 14.5px;
    }
    .window-url-bar {
      background: #F1F5F9; border-bottom: 2px solid #CBD5E1;
      padding: 8px 20px; font-family: monospace; font-size: 13px; color: #475569;
    }
    .minihompy-body {
      padding: 16px 18px; background: #F8FAFC;
      display: flex; gap: 12px; min-height: 640px; align-items: stretch;
    }
    .hompy-left-side {
      width: 270px; flex-shrink: 0; background: #FFFFFF;
      border: 2px solid #CBD5E1; border-radius: 16px;
      padding: 14px 12px; display: flex; flex-direction: column; gap: 9px;
    }
    .bgm-widget-box {
      background: #F1F5F9; border: 1.5px solid #CBD5E1; border-radius: 10px;
      padding: 6px 10px; display: flex; justify-content: space-between; align-items: center;
    }

    .blind-widget-box {
      background: #F8FAFC; border: 1.5px solid #CBD5E1; border-radius: 10px;
      padding: 7px 8px; display: flex; align-items: center; gap: 7px;
    }
    .blind-toggle-btn {
      flex-shrink: 0; min-width: 92px;
      border: 2px solid #1E293B; border-radius: 8px;
      background: #FFFFFF; color: #1E293B;
      font-size: 10.5px; font-weight: 900;
      padding: 5px 7px; cursor: pointer;
    }
    .blind-toggle-btn.active { background: #1E293B; color: #FFFFFF; }
    .blind-slider-wrap {
      min-width: 0; flex: 1;
      display: flex; align-items: center; gap: 5px;
    }
    .blind-slider {
      width: 100%; min-width: 0; height: 4px;
      accent-color: #EA580C; cursor: pointer;
    }
    .blind-slider:disabled { opacity: 0.35; cursor: not-allowed; }
    .blind-opacity-value {
      width: 28px; flex-shrink: 0;
      text-align: right; font-size: 9.5px;
      font-weight: 800; color: #64748B;
    }
    .character-privacy-target { transition: opacity 0.18s ease; }
    .bgm-title { font-size: 11px; font-weight: 800; color: #1E293B; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 145px; }
    .bgm-widget-box.multi-bgm {
      display:flex;
      flex-direction:column;
      align-items:stretch;
      gap:6px;
      padding:8px 9px;
    }
    .bgm-top-row {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:6px;
    }
    .bgm-select {
      width:100%;
      height:30px;
      border:1.5px solid #CBD5E1;
      border-radius:7px;
      background:#FFFFFF;
      color:#1E293B;
      font-size:10.5px;
      font-weight:800;
      padding:3px 6px;
      outline:none;
    }
    .bgm-controls-row {
      display:flex;
      align-items:center;
      gap:5px;
    }
    .bgm-mini-btn {
      flex:0 0 auto;
      min-width:34px;
      padding:4px 6px !important;
      font-size:10px !important;
    }
    .bgm-play-btn {
      flex:1;
      padding:4px 7px !important;
      font-size:10px !important;
    }
    .stat-counter-bar {
      display: flex; justify-content: space-around; font-size: 11.5px; font-weight: 800;
      padding-bottom: 6px; border-bottom: 1.5px dashed #CBD5E1;
    }
    .mini-room-box {
      background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: 12px;
      padding: 10px 4px; text-align: center; position: relative;
    }
    .large-mii-frame {
      width: 115px; height: 115px; border-radius: 50%;
      border: 3px solid #1E293B; background: #FDE047;
      margin: 0 auto; overflow: hidden; display: flex; align-items: center; justify-content: center;
      box-shadow: 2px 2px 0px rgba(0,0,0,0.15);
    }
    .large-mii-frame svg, .large-mii-frame img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .character-stage{width:100%;display:flex;align-items:center;justify-content:center;position:relative;margin:8px auto 2px}
    .character-profile-viewport{width:200px;height:244px;position:relative;overflow:visible;border:3px solid #1E293B;border-radius:14px;background:#E5E7EB;box-shadow:2px 2px 0 rgba(0,0,0,.15)}
    .character-frame-stack{width:230px;height:280px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.87);transform-origin:center center;overflow:visible;background:transparent}
    .character-frame-clip{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;border-radius:12px;background:#E5E7EB}
    .character-bg-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
    .character-base-layer{position:absolute;z-index:2;pointer-events:none;object-fit:contain}
    .character-accessory-layer{position:absolute;z-index:6;pointer-events:none;object-fit:contain}
    .character-slogan-layer{position:absolute;z-index:7;object-fit:contain;pointer-events:none}
    .character-frame-overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:12;pointer-events:none}
.shop-summary-box{display:flex;justify-content:space-between;align-items:center;background:#FFF7ED;border:1.5px solid #FDBA74;border-radius:10px;padding:7px 9px;font-size:11px;font-weight:900}.shop-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.shop-card{border:2px solid #E2E8F0;border-radius:12px;padding:9px;background:#FFF;display:flex;flex-direction:column;gap:7px;min-width:0}.shop-card.equipped{border-color:#EA580C;background:#FFF7ED}.shop-preview{width:100%;aspect-ratio:1.45/1;border-radius:9px;overflow:hidden;background:#F1F5F9;border:1px solid #E2E8F0;display:flex;align-items:center;justify-content:center}.shop-preview img{width:100%;height:100%;object-fit:contain}.shop-preview.bg img{object-fit:cover}.shop-preview.frame img{object-fit:contain;background:#F8FAFC}.shop-item-name{font-size:12px;font-weight:900;line-height:1.25}.shop-item-meta{font-size:10.5px;color:#64748B;font-weight:700;line-height:1.3}.shop-category-tabs{display:flex;gap:6px;flex-wrap:wrap}.shop-category-btn{border:2px solid #CBD5E1;background:#FFF;color:#334155;border-radius:8px;padding:7px 10px;font-size:11.5px;font-weight:900;cursor:pointer}.shop-category-btn.active{background:#1E293B;color:#FFF;border-color:#1E293B}.ticket-result{margin-top:8px;font-size:13px;font-weight:900;color:#7C3AED}
    .shop-card.previewing{border-color:#7C3AED;background:#F5F3FF}
    .shop-preview-btn{width:100%;padding:7px 4px;font-size:11px;border-color:#7C3AED;color:#6D28D9}
    .shop-preview-panel{margin-top:14px;border:2px solid #C4B5FD;background:#FAF5FF;border-radius:14px;padding:12px}
    .shop-preview-stage{width:230px;height:280px;max-width:100%;margin:14px auto 10px;position:relative;overflow:visible;border:3px solid #1E293B;border-radius:16px;background:#E5E7EB}
    .preview-stage-clip{position:absolute;inset:0;overflow:hidden;border-radius:13px;background:#E5E7EB}
    .shop-preview-stage .preview-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
    .shop-preview-stage .preview-char{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
    .shop-preview-stage.cutout-stage{background:
      linear-gradient(45deg,#eef2f7 25%,transparent 25%),
      linear-gradient(-45deg,#eef2f7 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#eef2f7 75%),
      linear-gradient(-45deg,transparent 75%,#eef2f7 75%);
      background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0}
    .shop-preview-stage .preview-char-cutout,
    .character-frame-stack .character-base-cutout{
      position:absolute;z-index:2;pointer-events:none;
      object-fit:contain;object-position:center bottom;transform-origin:center center;
    }
    .character-frame-stack{overflow:visible}
    .character-frame-clip{position:absolute;inset:0;border-radius:12px;overflow:hidden}
    .character-frame-clip .character-bg-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
    .character-frame-clip .character-base-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
    .character-frame-stack .character-accessory-layer{z-index:6}
    .character-slogan-layer{position:absolute;z-index:7;object-fit:contain;pointer-events:none}

    .shop-preview-stage .preview-slogan{position:absolute;z-index:5;object-fit:contain;pointer-events:none}
    .shop-preview-stage .preview-accessory{position:absolute;z-index:6;object-fit:contain;pointer-events:none}
    .shop-preview-stage .preview-frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:12;pointer-events:none}
    .preview-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
    .preview-control{background:#FFF;border:1.5px solid #E2E8F0;border-radius:9px;padding:7px}
    .preview-control label{display:flex;justify-content:space-between;font-size:10.5px;font-weight:900;color:#475569;margin-bottom:4px}
    .preview-control input{width:100%}
    .character-adjust-box{margin-top:12px;padding:12px;border:2px solid #93C5FD;border-radius:13px;background:#EFF6FF}
    .character-adjust-title{font-size:12px;font-weight:900;color:#1E3A8A;margin-bottom:3px}
    .character-adjust-help{font-size:10.5px;color:#64748B;margin-bottom:9px;line-height:1.4}
    .character-adjust-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:8px;flex-wrap:wrap}

    .left-emotion-badge {
      position: absolute; top: 18px; right: 40px;
      width: 32px; height: 32px; background: #FFFFFF; border: 2px solid #1E293B;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 16px; box-shadow: 1px 1px 0px #1E293B;
    }
    .char-spec-box {
      background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: 10px;
      padding: 8px 10px; font-size: 11.5px; text-align: left; line-height: 1.4;
    }
    .streak-week-box {
      display: flex; justify-content: space-between; background: #F8FAFC;
      border: 1.5px solid #E2E8F0; border-radius: 10px; padding: 6px 8px;
    }
    .streak-day-item { text-align: center; }
    .streak-day-name { font-size: 10px; color: #64748B; font-weight: 800; }
    .streak-day-icon { font-size: 12px; margin-top: 2px; min-height: 16px; display:flex; align-items:center; justify-content:center; }
    .streak-today-tag { font-size: 9px; color: #EA580C; font-weight: 900; }
    .stamina-progress-bg {
      width: 100%; height: 8px; background: #E2E8F0; border-radius: 6px;
      overflow: hidden; margin-top: 4px; border: 1px solid #CBD5E1;
    }
    .stamina-progress-fill { height: 100%; background: #EA580C; transition: width 0.3s ease; }
    
    .hompy-nav-tabs {
      width: 78px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;
    }
    .btn-tab-menu {
      width: 100%; padding: 12px 4px; background: #1E293B; color: #FFFFFF;
      border: 2px solid #1E293B; border-radius: 10px; font-size: 12.5px; font-weight: 800;
      cursor: pointer; text-align: center; transition: all 0.15s ease;
    }
    .btn-tab-menu:hover, .btn-tab-menu.active {
      background: #EA580C !important; border-color: #EA580C !important; color: #FFFFFF !important;
    }
    .hompy-main-content {
      flex-grow: 1; background: #FFFFFF; border: 2px solid #CBD5E1;
      border-radius: 16px; padding: 20px 22px; display: flex; flex-direction: column;
      min-width: 0; overflow: hidden;
    }
    .main-speech-bubble {
      background: #F8FAFC; border: 2px solid #1E293B; border-radius: 12px;
      padding: 12px 18px; font-weight: 800; font-size: 14px; color: #1E293B;
      margin-bottom: 16px; box-shadow: 2px 2px 0px #1E293B;
    }
    .flashcard-box {
      background: #F8FAFC; border: 2.5px solid #1E293B; border-radius: 16px;
      min-height: 250px; display: flex; flex-direction: column; justify-content: center;
      align-items: center; padding: 25px; text-align: center; box-shadow: 3px 3px 0px #1E293B; cursor: pointer;
    }
    .option-btn {
      width: 100%; text-align: left; margin-bottom: 10px;
      padding: 12px 16px; border-radius: 10px; font-weight: 700;
      border: 2px solid #CBD5E1; background: #FFFFFF; font-size: 14.5px; cursor: pointer;
    }
    .option-btn:hover { background: #F1F5F9; border-color: #1E293B; }
    .btn-correct { background-color: #1E293B !important; color: #FFFFFF !important; }
    .btn-wrong { background-color: #FEE2E2 !important; color: #DC2626 !important; }
    .btn-pixel-black {
      background: #1E293B; border: 2px solid #1E293B; color: #FFFFFF;
      font-weight: 800; border-radius: 8px; padding: 8px 16px; cursor: pointer;
    }
    .btn-pixel-black:hover { background: #EA580C; border-color: #EA580C; }
    .btn-pixel-white {
      background: #FFFFFF; border: 2px solid #1E293B; color: #1E293B;
      font-weight: 800; border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer;
    }
    .btn-pixel-white:hover { background: #F1F5F9; }
    .word-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #E2E8F0; }
    .history-table { width: 100%; border-collapse: collapse; }
    .history-table th { background: #F1F5F9; padding: 8px; font-size: 12.5px; border-bottom: 2px solid #CBD5E1; text-align: center; }
    .history-table td { padding: 10px 8px; border-bottom: 1px solid #E2E8F0; font-size: 13px; text-align: center; }
    .custom-input-row { display: flex; gap: 8px; align-items: center; width: 100%; margin-bottom: 12px; }
    .custom-input-row input, .std-input {
      border: 2px solid #CBD5E1; border-radius: 8px; padding: 8px 10px; font-size: 13.5px; height: 38px; width: 100%;
    }

    .accent-btn-group {
      display: inline-flex; gap: 4px; background: #E2E8F0; padding: 3px; border-radius: 8px;
    }
    .accent-btn {
      border: none; background: transparent; padding: 4px 8px; font-size: 11.5px;
      font-weight: 800; border-radius: 6px; cursor: pointer; color: #475569;
    }
    .accent-btn.active {
      background: #1E293B; color: #FFFFFF;
    }

    .study-timer-wrap{display:flex;flex-direction:column;gap:12px;height:100%}
    .study-timer-settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}

    function getShopItem(id){return SHOP_ITEMS.find(x=>x.id===id)||null}
    function getCharacterShopData(charKey=state.char){
      const shop=state.userData.shop;
      shop.characterData=shop.characterData||{};

      if(!shop.characterData[charKey]){
        shop.characterData[charKey]={
          ownedItems:[],
          variantData:{}
        };
      }

      const d=shop.characterData[charKey];
      d.ownedItems=Array.isArray(d.ownedItems)?Array.from(new Set(d.ownedItems)):[];
      d.variantData=d.variantData&&typeof d.variantData==='object'?d.variantData:{};

      // 기존 캐릭터 단위 장착/위치 데이터를 현재 버전으로 1회 이전
      if(!d._variantMigrationDone){
        const legacyEquipped=d.equipped&&typeof d.equipped==='object'?d.equipped:null;
        const legacyTransforms=d.transforms&&typeof d.transforms==='object'?d.transforms:null;
        const legacyCharacterTransform=d.characterTransform&&typeof d.characterTransform==='object'?d.characterTransform:null;
        const variantId=(charKey===state.char ? (state.charVariant||'default') : 'default');

        if(!d.variantData[variantId]){
          d.variantData[variantId]={
            equipped:{background:null,slogan:null,frame:null,head:null,face:null,side:null,effect:null},
            transforms:{},
            characterTransform:{x:0,y:34,scale:78}
          };
        }

        const vd=d.variantData[variantId];
        if(legacyEquipped && Object.values(legacyEquipped).some(Boolean)){
          vd.equipped={background:null,slogan:null,frame:null,head:null,face:null,side:null,effect:null,...legacyEquipped};
        }
        if(legacyTransforms && Object.keys(legacyTransforms).length){
          vd.transforms={...legacyTransforms};
        }
        if(legacyCharacterTransform){
          vd.characterTransform={
            x:Number(legacyCharacterTransform.x ?? 0),
            y:Number(legacyCharacterTransform.y ?? 34),
            scale:Number(legacyCharacterTransform.scale ?? 78)
          };
        }

        delete d.equipped;
        delete d.transforms;
        delete d.characterTransform;
        d._variantMigrationDone=true;
      }

      // 더 오래된 global shop 구매 데이터를 캐릭터 공용 인벤토리로 이전
      if(!d._legacyMigrated){
        const legacyOwned=Array.isArray(shop.ownedItems)?shop.ownedItems:[];
        if(legacyOwned.length && d.ownedItems.length===0){
          d.ownedItems=Array.from(new Set(legacyOwned));
        }
        d._legacyMigrated=true;
      }

      return d;
    }

    function getCharacterVariantData(charKey=state.char, variantId=null){
      const charShop=getCharacterShopData(charKey);
      const resolvedVariant=variantId || (charKey===state.char ? (state.charVariant||'default') : 'default');

      charShop.variantData=charShop.variantData||{};
      if(!charShop.variantData[resolvedVariant]){
        charShop.variantData[resolvedVariant]={
          equipped:{background:null,slogan:null,frame:null,head:null,face:null,side:null,effect:null},
          transforms:{},
          characterTransform:{x:0,y:34,scale:78}
        };
      }

      const vd=charShop.variantData[resolvedVariant];
      vd.equipped={background:null,slogan:null,frame:null,head:null,face:null,side:null,effect:null,...(vd.equipped||{})};
      vd.transforms=vd.transforms&&typeof vd.transforms==='object'?vd.transforms:{};
      vd.characterTransform={
        x:Number(vd.characterTransform?.x ?? 0),
        y:Number(vd.characterTransform?.y ?? 34),
        scale:Number(vd.characterTransform?.scale ?? 78)
      };
      return vd;
    }

    function getShopDefaultData(){return {tickets:0,legacySeedRemoved:true,ownedItems:[],equipped:{background:null,slogan:null,frame:null,head:null,face:null,side:null,effect:null},ticketClaims:{},transforms:{},characterData:{}}}
    function normalizeShopData(v){
      const b=getShopDefaultData(),s=v&&typeof v==='object'?v:{};
      const isExistingShop = v && typeof v==='object';
      let tickets=Number(s.tickets||0);
      let legacySeedRemoved = s.legacySeedRemoved === true;

      // 예전 버전에서 캐릭터마다 자동 지급되던 50장을 딱 한 번 제거.
      // 예: 50장 → 0장, 63장 → 실제로 공부/교환해서 번 13장만 유지.
      if(isExistingShop && !legacySeedRemoved){
        tickets=Math.max(0,tickets-50);
        legacySeedRemoved=true;
      }

      return {
        tickets,
        legacySeedRemoved,
        ownedItems:Array.isArray(s.ownedItems)?Array.from(new Set(s.ownedItems)):[],
        equipped:{...b.equipped,...(s.equipped&&typeof s.equipped==='object'?s.equipped:{})},
        ticketClaims:s.ticketClaims&&typeof s.ticketClaims==='object'?s.ticketClaims:{},
        transforms:s.transforms&&typeof s.transforms==='object'?s.transforms:{},
        characterData:s.characterData&&typeof s.characterData==='object'?s.characterData:{}
      }
    }

    // WORD3 같은 파일이 CP949로 저장되어 있어도 품사/Day 글자가 깨지지 않게 하기 위함.
    async function fetchCSVText(fileName) {
      const res = await fetch(fileName);
      if (!res.ok) throw new Error(`${fileName} HTTP ${res.status}`);

      const bytes = await res.arrayBuffer();
      let text = '';

      // 1순위: 정상 UTF-8
      try {
        text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      } catch (utf8Error) {
        // 2순위: Windows 한글 CSV에서 흔한 CP949/EUC-KR
        try {
          text = new TextDecoder('euc-kr').decode(bytes);
          console.info(`${fileName}: CP949/EUC-KR 인코딩으로 읽었습니다.`);
        } catch (krError) {
          // 최후 백업
          text = new TextDecoder('utf-8').decode(bytes);
        }
      }

      // UTF-8 BOM 제거
      return text.replace(/^\uFEFF/, '');
    }

    // CSV 파일 자동 로드 및 파싱 함수
    async function loadAllCSVData() {
      BUILTIN_EN = [];
      BUILTIN_JA = [];

      // 1. 영어 CSV 로드
      const enFiles = ['toeic_vocab.csv', 'WORD2.csv', 'WORD3.csv'];
      for (const fn of enFiles) {
        try {
          const text = await fetchCSVText(fn);
          const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
          parsed.data.forEach((row, i) => {
            const w = String(row['word'] || row[' 단어'] || row['단어'] || '').trim();
            const m = String(row['meaning'] || row[' 뜻'] || row['의미'] || '').trim();
            const d = String(row['day'] || row['Day'] || '1').trim();
            if (w && m) {
              BUILTIN_EN.push({
                id: `${fn}_${i}`,
                day: d,
                word: w,
                raw_word: w,
                meaning: m
              });
            }
          });
        } catch (e) {
          console.warn(`Error loading ${fn}:`, e);
        }
      }

      // 2. 일본어 CSV 로드
      const jaFiles = ['japanese_vocabulary.csv', 'japanese_vocabulary2.csv'];
      for (const fn of jaFiles) {
        try {
          const text = await fetchCSVText(fn);
          const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
          parsed.data.forEach((row, i) => {
            const cat = String(row['품사'] || row['분류'] || '명사').trim();
            const kanji = String(row['표기'] || '').trim();
            const yomi = String(row['요미가나'] || '').trim();
            const mean = String(row['한국어 뜻'] || row['뜻'] || '').trim();
            if (kanji && mean) {
              const disp = (yomi && yomi !== kanji) ? `${kanji} (${yomi})` : kanji;
              BUILTIN_JA.push({
                id: `${fn}_${i}`,
                day: cat,
                word: disp,
                raw_word: kanji,
                // 발음은 한자보다 요미가나를 우선 사용
                speech_word: yomi || kanji,
                meaning: mean
              });
            }
          });
        } catch (e) {
          console.warn(`Error loading ${fn}:`, e);
        }
      }
    }

      } catch (e) {
        console.warn('Local backup load failed:', e);
        return null;
      }
    }

    async function loadUserData() {
      const requestedUser = state.user;
      const requestedLang = state.lang;
      const requestedChar = state.char;
      const userKey = getUserKey();

      const localBackup = loadLocalBackup(userKey);

      // Supabase가 로드되지 않았거나 네트워크 연결이 실패하면 로컬 백업 사용
      if (!supabaseClient) {
        state.userData = localBackup || getDefaultUserData();
        recordAttendance();
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from('haikyu_voca_data')
          .select('*')
          .eq('user_name', requestedUser)
          .eq('lang', requestedLang)
          .eq('character', requestedChar)
          .maybeSingle();

        // 기다리는 동안 사용자가 다른 계정/언어/캐릭터로 이동했다면 결과 무시
        if (
          state.user !== requestedUser ||
          state.lang !== requestedLang ||
          state.char !== requestedChar
        ) {
          return;
        }

        if (error) throw error;

        if (data) {
          state.userData = normalizeUserData(data);
          saveLocalBackup(userKey, state.userData);

          // 기본 50장 제거 마이그레이션 결과를 Supabase에도 바로 동기화
          await saveUserDataToCloud(requestedUser, requestedLang, requestedChar, state.userData);
        } else {
          // Supabase에 아직 데이터가 없으면 기존 기기의 localStorage 데이터를
          // 첫 클라우드 데이터로 자동 이전한다.
          state.userData = localBackup || getDefaultUserData();
          await saveUserDataToCloud(requestedUser, requestedLang, requestedChar, state.userData);
        }
      } catch (e) {
        console.warn('Supabase load failed. Using local backup:', e);
        state.userData = localBackup || getDefaultUserData();
      }

      recordAttendance();
    }

    async function saveUserDataToCloud(userName, lang, character, data) {
      if (!supabaseClient || !userName || !lang || !character) return false;

      const payload = {
        user_name: userName,
        lang,
        character,
        exp: Number(data.exp || 0),
        coins: Number(data.coins ?? 200),
        satisfaction: Number(data.satisfaction ?? 3),
        stamina: Number(data.stamina ?? 3),
        my_vocab_ids: Array.isArray(data.myVocabIds) ? data.myVocabIds : [],
        attendance_dates: Array.isArray(data.attendanceDates) ? data.attendanceDates : [],
        study_history: Array.isArray(data.studyHistory) ? data.studyHistory : [],
        spaced_rep_data: { ...(data.spacedRepData && typeof data.spacedRepData === 'object' ? data.spacedRepData : {}), __shop: normalizeShopData(data.shop), __timer: normalizeTimerData(data.timerData) },
        custom_words: Array.isArray(data.customWords) ? data.customWords : [],
        updated_at: new Date().toISOString()
      };

      const { error } = await supabaseClient
        .from('haikyu_voca_data')
        .upsert(payload, {
          onConflict: 'user_name,lang,character'
        });

      if (error) {
        console.warn('Supabase save failed:', error);
        return false;
      }
      return true;
    }

    function saveUserData() {
      // 저장 버튼을 누르거나 보상을 받을 때 UI를 기다리게 하지 않도록
      // localStorage는 즉시 저장하고 Supabase는 비동기로 동기화한다.
      const userName = state.user;
      const lang = state.lang;
      const character = state.char;
      const userKey = getUserKey();
      const snapshot = normalizeUserData(JSON.parse(JSON.stringify(state.userData)));

      saveLocalBackup(userKey, snapshot);

      saveUserDataToCloud(userName, lang, character, snapshot).catch(e => {
        console.warn('Background Supabase sync failed:', e);
      });
    }

    function recordAttendance() {
      const today = new Date().toISOString().split('T')[0];
      if (!state.userData.attendanceDates.includes(today)) {
        state.userData.attendanceDates.push(today);
        saveUserData();
      }
    }

    function getCombinedVocab() {
      const base = state.lang === 'ja' ? BUILTIN_JA : BUILTIN_EN;
      return [...base, ...state.userData.customWords];
    }

    function getDaysList() {
      const db = getCombinedVocab();
      const raw = Array.from(new Set(db.map(d => String(d.day)))).filter(Boolean);
      
      const numericDays = raw.filter(d => !isNaN(d)).sort((a, b) => Number(a) - Number(b));
      const strDays = raw.filter(d => isNaN(d)).sort((a, b) => a.localeCompare(b));
      
      return ['all', ...numericDays, ...strDays];
    }

    function getFilteredVocab() {
      const db = getCombinedVocab();
      if (state.selectedDay === 'all') return db;
      return db.filter(d => String(d.day) === String(state.selectedDay));
    }

    function getCharInfo() {
      const exp = state.userData.exp;
      let lvl = 1;
      for (let i = 0; i < EXP_THRESHOLDS.length; i++) {
        if (exp >= EXP_THRESHOLDS[i]) lvl = i + 1;
      }
      if (lvl > 10) lvl = 10;
      const nextThresh = lvl < 10 ? EXP_THRESHOLDS[lvl] : EXP_THRESHOLDS[9];
      const currThresh = EXP_THRESHOLDS[lvl - 1];
      const remExp = exp - currThresh;
      const reqExp = nextThresh - currThresh;
      const meta = getActiveCharacterMeta(state.char);

      return {
        level: lvl, exp: remExp, maxExp: reqExp, title: STAGE_TITLES[lvl - 1],
        ...meta
      };
    }

    // 시험 종료 시에만 호출하는 보상 함수
    function addRewards(expPts, coinPts) {
      const oldLvl = getCharInfo().level;
      state.userData.exp += expPts;
      state.userData.coins += coinPts;
      const newLvl = getCharInfo().level;
      if (newLvl > oldLvl) {
        alert(`🎉 파트너 승격! [Lv.${newLvl} ${STAGE_TITLES[newLvl - 1]}]`);
      }
      saveUserData();
      render();
    }

    function syncBgmSource(shouldPlay = false) {
      const track = getSelectedBgmTrack();
      const wasPlaying = isBgmPlaying || shouldPlay;

      bgmAudio.pause();
      bgmAudio.src = track.file;
      bgmAudio.loop = true;
      bgmAudio.volume = BGM_FIXED_VOLUME;
      bgmAudio.load();

      if (wasPlaying) {
        bgmAudio.play().then(() => {
          isBgmPlaying = true;
          render();
        }).catch(err => {
          isBgmPlaying = false;
          console.warn('BGM play failed:', err);
          alert(`BGM 파일을 재생할 수 없습니다.\n${track.file}\nGitHub의 bgm 폴더와 파일명을 확인해주세요.`);
          render();
        });
      } else {
        isBgmPlaying = false;
      }
    }

    function selectBgm(trackId) {
      if (!BGM_TRACKS.some(t => t.id === trackId)) return;
      const shouldResume = isBgmPlaying;
      selectedBgmId = trackId;
      localStorage.setItem('haikyu_bgm_track', selectedBgmId);
      syncBgmSource(shouldResume);
      render();
    }

    function changeBgmBy(step) {
      const idx = Math.max(0, BGM_TRACKS.findIndex(t => t.id === selectedBgmId));
      const next = (idx + step + BGM_TRACKS.length) % BGM_TRACKS.length;
      selectBgm(BGM_TRACKS[next].id);
    }


    function toggleBgm() {
      if (isBgmPlaying) {
        bgmAudio.pause();
        isBgmPlaying = false;
        render();
        return;
      }

      const track = getSelectedBgmTrack();

      // 현재 Audio 객체가 다른 파일을 가리키고 있으면 선택 곡으로 교체
      const currentSrc = decodeURIComponent(bgmAudio.src || '');
      const wantedFile = track.file;
      if (!currentSrc.includes(wantedFile)) {
        bgmAudio.src = wantedFile;
        bgmAudio.loop = true;
        bgmAudio.volume = BGM_FIXED_VOLUME;
        bgmAudio.load();
      }

      bgmAudio.play().then(() => {
        isBgmPlaying = true;
        render();
      }).catch(err => {
        isBgmPlaying = false;
        console.warn('BGM play failed:', err);
        alert(`BGM 파일을 재생할 수 없습니다.\n${track.file}\nGitHub의 bgm 폴더와 파일명을 확인해주세요.`);
        render();
      });
    }

    function setBlindOpacity(value) {
      const parsed = Number(value);
      state.blindOpacity = Math.min(1, Math.max(0, Number.isFinite(parsed) ? parsed : 0));
      localStorage.setItem('haikyu_blind_opacity', String(state.blindOpacity));

    function normalizeVoiceLang(lang) {
      return String(lang || '').replace('_', '-').toLowerCase();
    }

    function pickBestVoice(langCode) {
      const target = langCode.toLowerCase();
      const candidates = availableVoices.filter(v => normalizeVoiceLang(v.lang).startsWith(target));
      if (candidates.length === 0) return null;

      const preferred = candidates.find(v => /Google|Natural|Neural|Enhanced|Premium|Online/i.test(v.name));
      return preferred || candidates[0];
    }

    async function speakWithBrowserTTS(text, langCode) {
      if (!('speechSynthesis' in window)) return false;
      await ensureVoicesLoaded();

      const voice = pickBestVoice(langCode);
      if (!voice && langCode === 'ja-JP') {
        console.warn('Japanese TTS voice is not installed/available in this browser.');
      }

      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = langCode;
      if (voice) u.voice = voice;
      u.rate = langCode === 'ja-JP' ? 0.9 : 0.92;
      u.pitch = 1.0;
      window.speechSynthesis.speak(u);
      return true;
    }

    function stopPronunciation() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      pronunciationAudio.pause();
      pronunciationAudio.onerror = null;
      pronunciationAudio.onended = null;
      pronunciationAudio.currentTime = 0;
    }

    // URL 음원이 실패하면 다음 URL을 시도하고, 모두 실패하면 브라우저 TTS로 넘어간다.
    async function playAudioCandidates(urls, fallbackFn) {
      stopPronunciation();
      let idx = 0;

      const tryNext = async () => {
        if (idx >= urls.length) {
          pronunciationAudio.onerror = null;
          await fallbackFn();
          return;
        }

        const url = urls[idx++];
        pronunciationAudio.src = url;
        pronunciationAudio.load();
        pronunciationAudio.onerror = () => {
          console.warn('Pronunciation source failed:', url);
          tryNext();
        };

        try {
          await pronunciationAudio.play();
        } catch (err) {
          console.warn('Pronunciation play() failed:', url, err);
          await tryNext();
        }
      };

      await tryNext();
    }

    async function playTTS(word, accent) {
      const clean = String(word || '')
        .split('(')[0]
        .replace(/[^a-zA-Z0-9\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF\s'-]/g, '')
        .trim();
      if (!clean) return;

      // 일본어: RStudio Viewer처럼 일본어 시스템 voice가 없는 환경에서도 들리도록
      // 네트워크 일본어 음원을 먼저 재생하고, 실패할 때만 ja-JP 브라우저 TTS를 사용한다.
      // CSV의 요미가나(speech_word)가 전달되므로 한자 오독도 줄어든다.
      if (state.lang === 'ja') {
        const encoded = encodeURIComponent(clean);
        const jaUrls = [
          `https://translate.google.com/translate_tts?ie=UTF-8&client=gtx&tl=ja&q=${encoded}`,
          `https://translate.google.com/translate_tts?ie=UTF-8&client=webapp&tl=ja&q=${encoded}`
        ];
        await playAudioCandidates(jaUrls, () => speakWithBrowserTTS(clean, 'ja-JP'));
        return;
      }

      // 영어: app.R에서 사용하던 실제 US / UK 발음 음원을 사용한다.
      // 호주식은 요청대로 완전히 제거.
      const encodedWord = encodeURIComponent(clean.toLowerCase());
      let audioUrl;
      let fallbackLang;

      if (accent === 'UK') {
        audioUrl = `https://dict.youdao.com/dictvoice?audio=${encodedWord}&type=1`;
        fallbackLang = 'en-GB';
      } else {
        audioUrl = `https://dict.youdao.com/dictvoice?audio=${encodedWord}&type=2`;
        fallbackLang = 'en-US';
      }

      await playAudioCandidates([audioUrl], () => speakWithBrowserTTS(clean, fallbackLang));
    }

    function generateQuiz() {
      const db = getFilteredVocab();
      if (db.length < 4) {
        state.quizQuestions = [];
        return;
      }
      const shuf = [...db].sort(() => 0.5 - Math.random());
      state.quizQuestions = shuf.map(item => {
        const others = db.filter(d => d.id !== item.id).sort(() => 0.5 - Math.random()).slice(0, 3);
        const opts = [item.meaning, ...others.map(o => o.meaning)].sort(() => 0.5 - Math.random());
        return { id: item.id, word: item.word, cAns: item.meaning, opts };
      });
      state.quizIdx = 0;
      state.quizAnswered = false;
      state.quizSelectedOpt = null;
      state.quizScore = { correct: 0, total: state.quizQuestions.length, wrongIds: [], finished: false };
      state.lastTicketGain = 0;
      state.mood = 'normal';
    }

    function generateHardQuiz() {
      const db = getFilteredVocab();
      if (db.length === 0) {
        state.hardQuestions = [];
        return;
      }
      const shuf = [...db].sort(() => 0.5 - Math.random());
      state.hardQuestions = shuf.map(item => ({ id: item.id, word: item.word, meaning: item.meaning }));
      state.hardIdx = 0;
      state.hardAnswered = false;
      state.hardIsCorrect = false;
      state.hardScore = { correct: 0, total: state.hardQuestions.length, wrongIds: [], finished: false };
      state.lastTicketGain = 0;
      state.mood = 'normal';
    }

    function generateSpellQuiz() {
      if (state.lang === 'ja') return;
      const db = getFilteredVocab();
      if (db.length === 0) {
        state.spellQuestions = [];
        return;
      }
      const shuf = [...db].sort(() => 0.5 - Math.random());
      state.spellQuestions = shuf.map(item => {
        const chars = item.raw_word.split('');
        const maskCount = Math.max(1, Math.round(chars.length * 0.4));
        const maskIndices = [];
        while (maskIndices.length < maskCount) {
          const r = Math.floor(Math.random() * chars.length);
          if (!maskIndices.includes(r)) maskIndices.push(r);
        }
        const masked = chars.map((c, i) => maskIndices.includes(i) ? '_' : c).join(' ');
        return { id: item.id, word: item.raw_word, meaning: item.meaning, maskedWord: masked };
      });
      state.spellIdx = 0;
      state.spellAnswered = false;
      state.spellIsCorrect = false;
      state.spellScore = { correct: 0, total: state.spellQuestions.length, wrongIds: [], finished: false };
      state.lastTicketGain = 0;
      state.mood = 'normal';
    }

      const expPct = charInfo.maxExp > 0 ? Math.min(100, (charInfo.exp / charInfo.maxExp) * 100) : 100;

      const today = new Date();
      const currDay = today.getDay() === 0 ? 6 : today.getDay() - 1;
      const weekDays = ['월', '화', '수', '목', '금', '토', '일'];
      const streakHtml = weekDays.map((w, i) => {
        const d = new Date(today);
        d.setDate(today.getDate() - currDay + i);
        const dStr = d.toISOString().split('T')[0];
        const isAtt = state.userData.attendanceDates.includes(dStr);
        const isToday = i === currDay;
        return `
          <div class="streak-day-item">
            <div class="streak-day-name">${w}</div>
            <div class="streak-day-icon">${isAtt ? renderMikasaBall(15) : '▫️'}</div>
            ${isToday ? '<div class="streak-today-tag">오늘</div>' : ''}
          </div>
        `;
      }).join('');

      app.innerHTML = `
        <div class="minihompy-window">
          <div class="window-top-bar">
            <span style="display:flex; align-items:center; gap:6px;">飛べ 카라스노 고교 체육관 · ${getUserDisplayName()} [${state.lang === 'ja' ? '🇯🇵 일본어' : '🇺🇸 영어'}] : ${charInfo.name} · ${charInfo.variantName || '기본'} ${renderMikasaBall(17)} <span title="Supabase + localStorage 백업" style="font-size:10px; opacity:.72;">☁ 저장</span></span>
            <div style="display: flex; gap: 6px;">
              <div style="width: 12px; height: 12px; background: #FFFFFF; border-radius: 3px;"></div>
              <div style="width: 12px; height: 12px; background: #FFFFFF; border-radius: 3px;"></div>
              <div style="width: 12px; height: 12px; background: #FFFFFF; border-radius: 3px;"></div>
            </div>
          </div>
          <div class="window-url-bar">
            http://karasuno.gym.club/?lang=${state.lang}&char=${state.char}&variant=${state.charVariant}&level=${charInfo.level}
          </div>
          <div class="minihompy-body">
            <div class="hompy-left-side">
              <div class="blind-widget-box">
                <button
                  class="blind-toggle-btn ${state.blindMode ? 'active' : ''}"
                  onclick="toggleBlindMode()"
                  title="캐릭터 프로필을 희미하게 표시합니다."
                >
                  ${state.blindMode ? '블라인드 ON' : '블라인드 OFF'}
                </button>
                <div class="blind-slider-wrap">
                  <input
                    class="blind-slider"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="${state.blindOpacity}"
                    ${state.blindMode ? '' : 'disabled'}
                    oninput="setBlindOpacity(this.value)"
                    aria-label="캐릭터 불투명도"
                  />
                  <span id="blind-opacity-value" class="blind-opacity-value">${Math.round(state.blindOpacity * 100)}%</span>
                </div>
              </div>
              <div class="bgm-widget-box multi-bgm">
                <div class="bgm-top-row">
                  <span class="bgm-title">🎵 BGM · ${getSelectedBgmTrack().title}</span>
                </div>

                <select class="bgm-select" onchange="selectBgm(this.value)" aria-label="BGM 선택">
                  ${BGM_TRACKS.map(track => `
                    <option value="${track.id}" ${selectedBgmId === track.id ? 'selected' : ''}>${track.title}</option>
                  `).join('')}
                </select>

                <div class="bgm-controls-row">
                  <button class="btn-pixel-white bgm-mini-btn" onclick="changeBgmBy(-1)" title="이전 곡">◀</button>
                  <button class="btn-pixel-black bgm-play-btn" onclick="toggleBgm()">${isBgmPlaying ? '⏸ 정지' : '▶ 재생'}</button>
                  <button class="btn-pixel-white bgm-mini-btn" onclick="changeBgmBy(1)" title="다음 곡">▶</button>
                </div>
              </div>
              <div class="stat-counter-bar">
                <span style="color: #EA580C;">TODAY ${totC}</span>
                <span style="color: #1E293B;">TOTAL ${totQ}</span>
              </div>
              <div
                class="mini-room-box character-privacy-target"
                style="opacity: ${state.blindMode ? state.blindOpacity : 1};"
              >
                ${renderDecoratedCharacter(state.char)}
                <div style="flex-grow: 1;">
                  <div style="font-weight: 900; font-size: 14px; margin-top: 2px;">${charInfo.name}</div>
                </div>
                <div class="left-emotion-badge">${state.mood === 'happy' ? '🔥' : (state.mood === 'angry' ? '💢' : '✨')}</div>
              </div>
              <div class="char-spec-box">
                <div><span style="color:#64748B; font-weight:700;">소속:</span> <b>${charInfo.school}</b> | <span style="color:#64748B; font-weight:700;">등번호:</span> <b>#${charInfo.num}</b></div>
                <div><span style="color:#64748B; font-weight:700;">포지션:</span> <b>${charInfo.pos}</b></div>
                <div style="color: #EA580C; font-weight: 800; margin-top: 4px; font-style: italic;">"${charInfo.motto}"</div>
              </div>
              <div class="streak-week-box">${streakHtml}</div>
              <div>
                <div style="display:flex; justify-content:space-between; font-size: 11px; font-weight: 800; color: #475569;">
                  <span>토스 정확도</span><span>${accPct}%</span>
                </div>
                <div class="stamina-progress-bg"><div class="stamina-progress-fill" style="width: ${accPct}%;"></div></div>
                <div style="display:flex; justify-content:space-between; font-size: 11px; font-weight: 800; color: #475569; margin-top: 6px;">
                  <span>Lv.${charInfo.level} ${charInfo.title}</span><span>${charInfo.exp}/${charInfo.maxExp} EXP</span>
                </div>
                <div class="stamina-progress-bg"><div class="stamina-progress-fill" style="width: ${expPct}%; background: #3B82F6;"></div></div>
              </div>
              <div class="shop-summary-box"><span>응원 티켓 🎟️</span><span style="color:#7C3AED;">${state.userData.shop.tickets}장</span></div>
              <button class="btn-pixel-white" style="width:100%;padding:7px;font-size:11px;border-color:#7C3AED;color:#6D28D9;" onclick="switchTab('shop')">🛍️ 꾸미기 상점</button>
              <div style="display:flex; justify-content:space-between; align-items:center; font-size:10.5px; font-weight:900; color:#475569; margin-top:2px;">
                <span>보유 코인</span><span style="color:#EA580C;">${state.userData.coins} 🪙</span>
              </div>
              <div style="display:flex; gap:4px; margin-top:4px;">
                <button class="btn-pixel-white" style="flex:1; padding:6px 3px; font-size:10.5px;" onclick="feedPartner()">🍙 ${charInfo.food} · ${CARE_COSTS.food}🪙</button>
                <button class="btn-pixel-white" style="flex:1; padding:6px 3px; font-size:10.5px; display:flex; align-items:center; justify-content:center; gap:3px;" onclick="actionPartner()">${renderMikasaBall(13)} ${charInfo.act} · ${CARE_COSTS.train}🪙</button>
              </div>
              <div style="margin-top: 2px; display: flex; gap: 4px; flex-wrap:wrap;">
                <button class="btn-pixel-white" style="flex: 1; padding: 6px; font-size: 11px;" onclick="state.entered=false; state.variantSelecting=false; render();">🔄 선수 교체</button>
                <button class="btn-pixel-white" style="flex: 1; padding: 6px; font-size: 11px;" onclick="state.entered=false; state.variantSelecting=true; loadSavedVariant(state.char); render();">🖼️ 버전 변경</button>
                <button class="btn-pixel-white" style="flex: 1; padding: 6px; font-size: 11px;" onclick="changeLanguage()">🌐 언어 변경</button>
                <button class="btn-pixel-white" style="flex: 1; padding: 6px; font-size: 11px;" onclick="resetToUserSelect()">👥 사용자 변경</button>
              </div>
            </div>

            <div class="hompy-nav-tabs">
              <button class="btn-tab-menu ${state.tab === 'practice' ? 'active' : ''}" onclick="switchTab('practice')">연습</button>
              <button class="btn-tab-menu ${state.tab === 'quiz' ? 'active' : ''}" onclick="switchTab('quiz')">객관식</button>
              <button class="btn-tab-menu ${state.tab === 'hard' ? 'active' : ''}" onclick="switchTab('hard')">주관식</button>
              ${state.lang !== 'ja' ? `<button class="btn-tab-menu ${state.tab === 'spell' ? 'active' : ''}" onclick="switchTab('spell')">스펠링</button>` : ''}
              <button class="btn-tab-menu ${state.tab === 'custom' ? 'active' : ''}" onclick="switchTab('custom')">단어장</button>
              <button class="btn-tab-menu ${state.tab === 'spaced' ? 'active' : ''}" onclick="switchTab('spaced')">복습</button>
              <button class="btn-tab-menu ${state.tab === 'shop' ? 'active' : ''}" onclick="switchTab('shop')">상점</button>
              <button class="btn-tab-menu ${state.tab === 'inventory' ? 'active' : ''}" onclick="switchTab('inventory')">인벤토리</button>
              <button class="btn-tab-menu ${state.tab === 'history' ? 'active' : ''}" onclick="switchTab('history')">기록</button>
              <button class="btn-tab-menu ${state.tab === 'timer' ? 'active' : ''}" onclick="switchTab('timer')">공부<br>타이머</button>
            </div>

            <div class="hompy-main-content">
              <div class="main-speech-bubble">💬 ${renderSpeechWithBall(state.speech)}</div>
              <div id="tab-content" style="flex-grow: 1; display: flex; flex-direction: column;">
                ${renderTabContent()}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderDaySelect(changeHandler) {
      const days = getDaysList();
      return `
        <select class="std-input" style="width: 150px; height: 34px;" onchange="${changeHandler}(this.value)">
          ${days.map(d => {
            let label = d;
            if (d === 'all') label = '전체 범위';
            else if (!isNaN(d)) label = `Day ${d}`;
            return `<option value="${d}" ${state.selectedDay === d ? 'selected' : ''}>${label}</option>`;
          }).join('')}
        </select>
      `;
    }

    function renderTabContent() {
      if (state.tab === 'practice') {
        const list = getFilteredVocab();
        if (list.length === 0) {
          return `
            <div style="display:flex; justify-content:space-between; margin-bottom:12px;">${renderDaySelect('onDayChange')}</div>
            <p style="color:#64748B; text-align:center; margin-top:50px;">선택된 범위에 단어가 없습니다.</p>
          `;
        }
        const item = list[state.fcIdx] || list[0];
        
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
            ${renderDaySelect('onDayChange')}
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-size:12.5px; font-weight:900; color:#475569; white-space:nowrap;">단어 ${state.fcIdx + 1} / ${list.length}</span>
              <button class="btn-pixel-white" onclick="shuffleFlashcards()">🔀 셔플</button>
            </div>
          </div>
          <div class="flashcard-box" onclick="toggleFlashcardMeaning()">
            <div style="font-size: 32px; font-weight: 900; color: #1E293B;">${item.word}</div>
            
            <div style="margin: 14px 0;" onclick="event.stopPropagation();">
              ${state.lang === 'ja' ? `
                <button class="btn-pixel-white" onclick="playTTS('${item.speech_word || item.raw_word}', 'JA')">🔊 일본어 발음 듣기</button>
              ` : `
                <div class="accent-btn-group">
                  <button class="accent-btn ${state.selectedAccent === 'US' ? 'active' : ''}" onclick="setAccent('US'); playTTS('${item.raw_word}', 'US');">🇺🇸 미국식</button>
                  <button class="accent-btn ${state.selectedAccent === 'UK' ? 'active' : ''}" onclick="setAccent('UK'); playTTS('${item.raw_word}', 'UK');">🇬🇧 영국식</button>
                </div>
              `}
            </div>

            ${state.fcShowMeaning
              ? `<div style="font-size: 20px; font-weight: 800; color: #EA580C; margin-top: 10px;">${item.meaning}</div>`
              : `<div style="font-size: 13px; color: #94A3B8; margin-top: 10px;">[카드를 탭하여 뜻 확인]</div>`}
          </div>
          <div style="display:flex; justify-content:center; gap:8px; margin-top:15px; flex-wrap:wrap;">
            <button class="btn-pixel-white" ${state.fcIdx === 0 ? 'disabled' : ''} onclick="prevFlashcard()">◀ 이전</button>
            <button class="btn-pixel-black" onclick="toggleFlashcardMeaning()">${state.fcShowMeaning ? '단어만 보기' : '뜻 보기'}</button>
            <button class="btn-pixel-white" style="${state.userData.myVocabIds.includes(item.id) ? 'border-color:#10B981; color:#059669;' : 'border-color:#EA580C; color:#EA580C;'}" onclick="addCurrentPracticeWord('${item.id}')" ${state.userData.myVocabIds.includes(item.id) ? 'disabled' : ''}>${state.userData.myVocabIds.includes(item.id) ? '✓ 단어장 저장됨' : '＋ 단어장 추가하기'}</button>
            <button class="btn-pixel-white" ${state.fcIdx >= list.length - 1 ? 'disabled' : ''} onclick="nextFlashcard()">다음 ▶</button>
          </div>
        `;
      }

      if (state.tab === 'quiz') {
        const sc = state.quizScore;
        if (sc.finished) {
          const rate = sc.total > 0 ? ((sc.correct / sc.total) * 100).toFixed(1) : 100;
          return `
            <div style="text-align: center; padding: 40px 20px;">
              <h3 style="font-weight: 900; display:flex; justify-content:center; align-items:center; gap:7px;">${renderMikasaBall(22)} 1세트 객관식 결과</h3>
              <p style="font-size: 16px; color: #4B5563;">성공률: ${rate}% (${sc.correct}/${sc.total})</p>
              <h4 style="color: #EA580C; font-weight: 900;">+${calculateTestReward('quiz', sc.correct).exp} EXP | +${calculateTestReward('quiz', sc.correct).coins} 🪙 획득!</h4>
              <div class="ticket-result">🎟️ 응원 티켓 ${state.lastTicketGain > 0 ? `+${state.lastTicketGain}장` : '추가 획득 없음'}</div>
              <button class="btn-pixel-black" style="margin-top: 15px;" onclick="generateQuiz(); render();">다시 시작하기 ➔</button>
            </div>
          `;
        }
        if (state.quizQuestions.length === 0) return `<p style="padding:20px;">문제를 생성 중이거나 단어가 부족합니다 (최소 4개 필요).</p>`;
        const q = state.quizQuestions[state.quizIdx];
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            ${renderDaySelect('onDayChange')}
            <span style="font-weight: 800;">문제: ${state.quizIdx + 1} / ${state.quizQuestions.length}</span>
          </div>
          <div style="text-align: center; padding: 10px 0;">
            <h2 style="font-weight: 900; color: #1E293B; margin: 5px 0 15px 0;">${q.word}</h2>
          </div>
          <div>
            ${q.opts.map((opt, i) => {
              let cls = "option-btn";
              if (state.quizAnswered) {
                if (opt === q.cAns) cls += " btn-correct";
                else if (opt === state.quizSelectedOpt) cls += " btn-wrong";
              }
              return `<button class="${cls}" onclick="handleQuizOpt('${opt.replace(/'/g, "\\'")}')">${i + 1}.  ${opt}</button>`;
            }).join('')}
          </div>
          ${state.quizAnswered ? `
            <div style="text-align: right; margin-top: 5px;">
              <button class="btn-pixel-black" onclick="nextQuiz()">
                ${state.quizIdx < state.quizQuestions.length - 1 ? '다음 문제 ➔' : '세트 결과 확인 ➔'}
              </button>
            </div>
          ` : ''}
        `;
      }

      if (state.tab === 'hard') {
        const sc = state.hardScore;
        if (sc.finished) {
          return `
            <div style="text-align: center; padding: 40px 20px;">
              <h3 style="font-weight: 900;">🔥 주관식 Hard 세트 완료!</h3>
              <p style="font-size: 16px; color: #4B5563;">적중: ${sc.correct} / ${sc.total}</p>
              <h4 style="color: #EA580C; font-weight: 900;">+${calculateTestReward('hard', sc.correct).exp} EXP | +${calculateTestReward('hard', sc.correct).coins} 🪙 획득!</h4>
              <div class="ticket-result">🎟️ 응원 티켓 ${state.lastTicketGain > 0 ? `+${state.lastTicketGain}장` : '추가 획득 없음'}</div>
              <button class="btn-pixel-black" style="margin-top: 15px;" onclick="generateHardQuiz(); render();">다시 시작하기 ➔</button>
            </div>
          `;
        }
        if (state.hardQuestions.length === 0) return `<p style="padding:20px;">단어가 없습니다.</p>`;
        const q = state.hardQuestions[state.hardIdx];
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            ${renderDaySelect('onDayChange')}
            <span style="font-weight: 800;">문제: ${state.hardIdx + 1} / ${state.hardQuestions.length}</span>
          </div>
          <div style="text-align: center; padding: 15px 0;">
            <h2 style="font-weight: 900; color: #1E293B; margin: 0 0 10px 0;">${q.word}</h2>
            <p style="color: #64748B; font-size: 13px;">한국어 뜻을 직접 입력하세요.</p>
          </div>
          <div style="max-width: 440px; margin: 0 auto; width: 100%;">
            <input type="text" id="hard-input" class="std-input" placeholder="한국어 뜻 입력 (예: 잡다)" ${state.hardAnswered ? 'disabled' : ''} onkeydown="if(event.key==='Enter') submitHard();" />
            <div style="margin-top: 10px;">
              ${!state.hardAnswered ? `
                <button class="btn-pixel-black" style="width: 100%;" onclick="submitHard()">정답 확인</button>
              ` : `
                <div style="background: ${state.hardIsCorrect ? '#DCFCE7' : '#FEE2E2'}; color: ${state.hardIsCorrect ? '#166534' : '#991B1B'}; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 8px;">
                  ${state.hardIsCorrect ? '● 정답입니다!' : '✕ 정답: ' + q.meaning}
                </div>
                <button class="btn-pixel-black" style="width: 100%;" onclick="nextHard()">
                  ${state.hardIdx < state.hardQuestions.length - 1 ? '다음 문제 ➔' : '세트 결과 확인 ➔'}
                </button>
              `}
            </div>
          </div>
        `;
      }

      if (state.tab === 'spell' && state.lang !== 'ja') {
        const sc = state.spellScore;
        if (sc.finished) {
          return `
            <div style="text-align: center; padding: 40px 20px;">
              <h3 style="font-weight: 900;">🔤 스펠링 게임 완료!</h3>
              <p style="font-size: 16px; color: #4B5563;">적중: ${sc.correct} / ${sc.total}</p>
              <h4 style="color: #EA580C; font-weight: 900;">+${calculateTestReward('spell', sc.correct).exp} EXP | +${calculateTestReward('spell', sc.correct).coins} 🪙 획득!</h4>
              <div class="ticket-result">🎟️ 응원 티켓 ${state.lastTicketGain > 0 ? `+${state.lastTicketGain}장` : '추가 획득 없음'}</div>
              <button class="btn-pixel-black" style="margin-top: 15px;" onclick="generateSpellQuiz(); render();">다시 시작하기 ➔</button>
            </div>
          `;
        }
        if (state.spellQuestions.length === 0) return `<p style="padding:20px;">단어가 없습니다.</p>`;
        const q = state.spellQuestions[state.spellIdx];
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            ${renderDaySelect('onDayChange')}
            <span style="font-weight: 800;">문제: ${state.spellIdx + 1} / ${state.spellQuestions.length}</span>
          </div>
          <div style="text-align: center; padding: 10px 0;">
            <h4 style="font-weight: 800; color: #4B5563; margin: 0;">${q.meaning}</h4>
            <div style="font-family: monospace; font-size: 30px; letter-spacing: 4px; font-weight: 900; margin: 12px 0;">${q.maskedWord}</div>
          </div>
          <div style="max-width: 440px; margin: 0 auto; width: 100%;">
            <input type="text" id="spell-input" class="std-input" placeholder="완성된 영단어 입력" ${state.spellAnswered ? 'disabled' : ''} onkeydown="if(event.key==='Enter') submitSpell();" />
            <div style="margin-top: 10px;">
              ${!state.spellAnswered ? `
                <button class="btn-pixel-black" style="width: 100%;" onclick="submitSpell()">철자 제출</button>
              ` : `
                <div style="background: ${state.spellIsCorrect ? '#DCFCE7' : '#FEE2E2'}; color: ${state.spellIsCorrect ? '#166534' : '#991B1B'}; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 8px;">
                  ${state.spellIsCorrect ? '● 정답: ' + q.word : '✕ 정답: ' + q.word}
                </div>
                <button class="btn-pixel-black" style="width: 100%;" onclick="nextSpell()">
                  ${state.spellIdx < state.spellQuestions.length - 1 ? '다음 문제 ➔' : '세트 결과 확인 ➔'}
                </button>
              `}
            </div>
          </div>
        `;
      }

      if (state.tab === 'custom') {
        const db = getCombinedVocab();
        const myVocab = db.filter(d => state.userData.myVocabIds.includes(d.id));
        return `
          <h4 style="font-weight: 900; margin-top: 0; color: #1E293B;">➕ 나만의 단어 추가</h4>
          <div class="custom-input-row">
            <input type="text" id="c-day" placeholder="${state.lang === 'ja' ? '품사' : 'Day 번호'}" style="width: 20%;" />
            <input type="text" id="c-word" placeholder="${state.lang === 'ja' ? '일본어 단어' : '영어 단어'}" style="width: 35%;" />
            <input type="text" id="c-meaning" placeholder="한국어 뜻 입력" style="width: 45%;" />
            <button class="btn-pixel-black" onclick="addCustomWord()">추가 ➕</button>
          </div>
          <hr style="border: 0; border-top: 1px solid #E2E8F0; margin: 15px 0;" />

      }

      if (state.tab === 'shop') {
        const schoolId=getCharSchoolId(),charShop=getCharacterShopData(),variantShop=getCharacterVariantData(),visibleItems=SHOP_ITEMS.filter(item=>item.type===state.shopCategory&&(item.school==='all'||item.school===schoolId));
        const labels={accessory:'🎀 액세서리',background:'🖼️ 배경',slogan:'🏳️ 슬로건',frame:'🖼️ 프레임'};

        <div style="font-size:10.5px;color:#94A3B8;margin-top:8px">모든 아이템은 구매 전에 미리보기할 수 있습니다. 액세서리와 슬로건은 위치·크기·투명도·각도를 조정할 수 있고, 프레임은 프로필 테두리에 자동으로 맞춰집니다.</div><div style="margin-top:10px;padding:10px;border:1.5px solid #FCD34D;border-radius:10px;background:#FFFBEB"><div style="font-size:11px;font-weight:900;color:#92400E;margin-bottom:6px">🪙 코인으로 응원 티켓 구매 · 보유 ${state.userData.coins}🪙</div><div style="display:flex;gap:5px;flex-wrap:wrap"><button class="btn-pixel-white" onclick="buyCheerTickets(1)">20🪙 → 🎟️1</button><button class="btn-pixel-white" onclick="buyCheerTickets(3)">50🪙 → 🎟️3</button><button class="btn-pixel-black" onclick="buyCheerTickets(5)">75🪙 → 🎟️5</button></div></div>

        <div class="shop-grid">${visibleItems.map(item=>{const owned=charShop.ownedItems.includes(item.id),slot=item.type==='accessory'?item.slot:item.type,equipped=variantShop.equipped[slot]===item.id,canBuy=state.userData.shop.tickets>=item.price,previewing=state.shopPreviewItemId===item.id;return `<div class="shop-card ${equipped?'equipped':''} ${previewing?'previewing':''}"><div class="shop-preview ${item.type==='background'?'bg':item.type==='frame'?'frame':''}"><img src="${item.file}" alt="${item.name}" onerror="this.style.display='none';"></div><div class="shop-item-name">${item.name}</div><div class="shop-item-meta">${item.school==='all'?'전 캐릭터 공용':`${SCHOOL_LABELS[item.school]} 전용`}${item.type==='accessory'?` · ${item.slot==='head'?'머리':item.slot==='face'?'얼굴':item.slot==='effect'?'효과':'주변 소품'}`:item.type==='frame'?' · 프로필 프레임':''}</div><button class="btn-pixel-white shop-preview-btn" onclick="previewShopItem('${item.id}')">${previewing?'미리보기 닫기':'👀 미리보기'}</button>${owned?`<button class="${equipped?'btn-pixel-black':'btn-pixel-white'}" style="width:100%;padding:7px 4px;font-size:11px" onclick="${equipped?`unequipShopItem('${item.id}')`:`equipShopItem('${item.id}')`}">${equipped?'장착 해제':'장착하기'}</button>`:`<button class="btn-pixel-white" style="width:100%;padding:7px 4px;font-size:11px;${canBuy?'border-color:#7C3AED;color:#6D28D9;':'opacity:.55;'}" onclick="buyShopItem('${item.id}')" ${canBuy?'':'disabled'}>🎟️ ${item.price} · 구매</button>`}</div>`}).join('')}</div>`;

      if (state.tab === 'timer') {

        return `<div class="study-timer-wrap">
          <div><h4 style="font-weight:900;margin:0 0 4px;">⏱️ 공부 타이머 · 뽀모도로</h4><div style="font-size:11px;color:#64748B;font-weight:700;">집중 시간만 최종 공부 시간으로 기록됩니다. 휴식 시간은 보상 계산에서 제외됩니다.</div></div>
          <div class="study-timer-settings">
            <div class="study-timer-setting-card"><label>📚 공부 시간 (분)</label><input type="number" min="1" max="180" value="${t.studyMinutes}" ${t.running?'disabled':''} onchange="setStudyTimerSetting('studyMinutes',this.value)"></div>

          </div>
          <div class="study-timer-card">
            <div id="study-timer-phase" class="study-timer-phase">${t.phase==='focus'?'📚 집중 공부':'☕ 휴식'}</div>
            <div id="study-timer-clock" class="study-timer-clock">${formatTimerClock(t.remainingSec)}</div>

            <div style="font-size:11px;color:#64748B;font-weight:800;">이번 세션 집중 공부 <b id="study-timer-session" style="color:#EA580C;">${formatStudyTime(t.sessionFocusSec)}</b> · 완료 뽀모도로 ${t.completedFocusBlocks}회</div>

          <div class="study-timer-stats"><div class="study-timer-stat"><div class="value">${formatStudyTime(todaySec)}</div><div class="label">오늘 기록</div></div><div class="study-timer-stat"><div class="value">${formatStudyTime(timerData.totalStudySeconds)}</div><div class="label">누적 공부 시간</div></div><div class="study-timer-stat"><div class="value">${timerData.completedPomodoros}회</div><div class="label">완료 뽀모도로</div></div></div>
          <div class="study-timer-reward-box"><b>🎁 공부 시간 보상</b><br>10분 이상 → 2 EXP + 2코인<br>25분 이상 → 6 EXP + 5코인<br>50분 이상 → 15 EXP + 12코인 + 응원 티켓 1장<br>100분 이상 → 35 EXP + 30코인 + 응원 티켓 2장<br><span style="color:#92400E;font-weight:900;">현재 세션 예상 보상: +${reward.exp} EXP / +${reward.coins}코인${reward.tickets?` / +${reward.tickets}티켓`:''}</span></div>
          <div><div style="font-size:11.5px;font-weight:900;margin-bottom:6px;">📒 최근 공부 타이머 기록</div><div class="study-timer-history">${history.length?history.map(h=>`<div class="study-timer-history-row"><span>${new Date(h.date).toLocaleDateString('ko-KR')}</span><b>${formatStudyTime(h.seconds)}</b><span style="color:#64748B;">+${h.exp||0}EXP · +${h.coins||0}🪙${h.tickets?` · +${h.tickets}🎟️`:''}</span></div>`).join(''):`<div style="padding:24px;text-align:center;color:#94A3B8;font-size:11px;font-weight:800;">아직 공부 타이머 기록이 없습니다.</div>`}</div></div>
        </div>`;
      }

      if (state.tab === 'history') {
        const hList = [...state.userData.studyHistory].reverse();
        const timerData = state.userData.timerData || getDefaultTimerData();
        return `
          <h4 style="font-weight: 900; margin-top: 0;">📊 나의 훈련 통계</h4>
          <div class="study-timer-stats" style="margin-bottom:12px;"><div class="study-timer-stat"><div class="value">${formatStudyTime(getTodayTimerSeconds())}</div><div class="label">오늘 공부</div></div><div class="study-timer-stat"><div class="value">${formatStudyTime(timerData.totalStudySeconds)}</div><div class="label">누적 공부</div></div><div class="study-timer-stat"><div class="value">${timerData.completedPomodoros}회</div><div class="label">뽀모도로</div></div></div>
          ${hList.length === 0 ? '<p style="color: #94A3B8; text-align: center; padding: 40px;">기록이 없습니다.</p>' : `
            <table class="history-table">
