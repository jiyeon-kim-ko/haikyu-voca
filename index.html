<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer" />
  <title>하이큐 단어 훈련소</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" />
  <!-- CSV 파싱 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: 'Pretendard', sans-serif;
      background-color: #1E293B;
      color: #1E293B;
    }
    .bg-cover-wrapper {
      min-height: 100vh; width: 100%;
      background-image: url('gym.png');
      background-size: cover; background-position: center; background-repeat: no-repeat;
      background-color: #0F172A;
      display: flex; align-items: center; justify-content: center;
      padding: 20px 10px;
    }

    .login-card-gym {
      max-width: 480px; width: 100%; background: #FFFFFF;
      padding: 35px 30px; border-radius: 20px; border: 3.5px solid #1E293B;
      box-shadow: 8px 8px 0px rgba(0,0,0,0.6); text-align: center;
    }
    .lang-choice-card {
      border: 3px solid #1E293B; border-radius: 16px; padding: 20px; margin: 12px 0;
      cursor: pointer; background: #FFFFFF; transition: all 0.2s ease; display: flex;
      align-items: center; justify-content: space-between; font-weight: 900; font-size: 17px;
      box-shadow: 4px 4px 0px #1E293B;
    }
    .lang-choice-card:hover {
      background: #FFF7ED; border-color: #EA580C; transform: translateY(-3px);
      box-shadow: 6px 6px 0px #EA580C; color: #EA580C;
    }
    .char-select-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-bottom: 20px; }
    .char-radio-card {
      border: 2px solid #D4D4D8; border-radius: 12px; padding: 10px 4px 8px 4px; cursor: pointer;
      background: #FFFFFF; transition: all 0.15s ease; text-align: center;
    }
    .char-radio-card:hover { border-color: #1E293B; transform: translateY(-2px); }
    .char-radio-card.active { border-color: #EA580C; background: #FFF7ED; box-shadow: 2px 2px 0px #EA580C; }
    .mini-avatar-circle {
      width: 46px; height: 46px; border-radius: 50%; border: 2px solid #1E293B;
      background: #FFFFFF; margin: 0 auto 4px auto; overflow: hidden; display: flex;
      align-items: center; justify-content: center;
    }
    .mini-avatar-circle svg, .mini-avatar-circle img {
      width: 100%; height: 100%; object-fit: cover;
    }

    .variant-select-grid {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
      margin:14px 0 18px;
    }
    .variant-card {
      border:2px solid #D4D4D8;
      border-radius:12px;
      background:#FFFFFF;
      padding:9px;
      cursor:pointer;
      transition:all .15s ease;
      text-align:center;
    }
    .variant-card:hover {
      border-color:#EA580C;
      transform:translateY(-2px);
    }
    .variant-card.active {
      border-color:#EA580C;
      background:#FFF7ED;
      box-shadow:2px 2px 0 #EA580C;
    }
    .variant-preview {
      width:100%;
      aspect-ratio:1/1;
      border-radius:9px;
      overflow:hidden;
      border:1.5px solid #CBD5E1;
      background:#F8FAFC;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:6px;
    }
    .variant-preview img {
      width:100%;
      height:100%;
      object-fit:contain;
    }

    .minihompy-window {
      width: 1180px; max-width: 98vw;
      background: #FFFFFF; border-radius: 20px;
      border: 3.5px solid #1E293B;
      box-shadow: 0 20px 45px rgba(0,0,0,0.55);
      display: flex; flex-direction: column;
    }
    .window-top-bar {
      background: #1E293B; color: #FFFFFF;
      padding: 12px 22px; display: flex; justify-content: space-between; align-items: center;
      font-weight: 800; font-size: 14.5px;
    }
    .window-url-bar {
      background: #F1F5F9; border-bottom: 2px solid #CBD5E1;
      padding: 8px 20px; font-family: monospace; font-size: 13px; color: #475569;
    }
    .minihompy-body {
      padding: 16px 18px; background: #F8FAFC;
      display: flex; gap: 12px; min-height: 640px; align-items: stretch;
    }
    .hompy-left-side {
      width: 270px; flex-shrink: 0; background: #FFFFFF;
      border: 2px solid #CBD5E1; border-radius: 16px;
      padding: 14px 12px; display: flex; flex-direction: column; gap: 9px;
    }
    .bgm-widget-box {
      background: #F1F5F9; border: 1.5px solid #CBD5E1; border-radius: 10px;
      padding: 6px 10px; display: flex; justify-content: space-between; align-items: center;
    }

    .blind-widget-box {
      background: #F8FAFC; border: 1.5px solid #CBD5E1; border-radius: 10px;
      padding: 7px 8px; display: flex; align-items: center; gap: 7px;
    }
    .blind-toggle-btn {
      flex-shrink: 0; min-width: 92px;
      border: 2px solid #1E293B; border-radius: 8px;
      background: #FFFFFF; color: #1E293B;
      font-size: 10.5px; font-weight: 900;
      padding: 5px 7px; cursor: pointer;
    }
    .blind-toggle-btn.active { background: #1E293B; color: #FFFFFF; }
    .blind-slider-wrap {
      min-width: 0; flex: 1;
      display: flex; align-items: center; gap: 5px;
    }
    .blind-slider {
      width: 100%; min-width: 0; height: 4px;
      accent-color: #EA580C; cursor: pointer;
    }
    .blind-slider:disabled { opacity: 0.35; cursor: not-allowed; }
    .blind-opacity-value {
      width: 28px; flex-shrink: 0;
      text-align: right; font-size: 9.5px;
      font-weight: 800; color: #64748B;
    }
    .character-privacy-target { transition: opacity 0.18s ease; }
    .bgm-title { font-size: 11px; font-weight: 800; color: #1E293B; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 145px; }
    .bgm-widget-box.multi-bgm {
      display:flex;
      flex-direction:column;
      align-items:stretch;
      gap:6px;
      padding:8px 9px;
    }
    .bgm-top-row {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:6px;
    }
    .bgm-select {
      width:100%;
      height:30px;
      border:1.5px solid #CBD5E1;
      border-radius:7px;
      background:#FFFFFF;
      color:#1E293B;
      font-size:10.5px;
      font-weight:800;
      padding:3px 6px;
      outline:none;
    }
    .bgm-controls-row {
      display:flex;
      align-items:center;
      gap:5px;
    }
    .bgm-mini-btn {
      flex:0 0 auto;
      min-width:34px;
      padding:4px 6px !important;
      font-size:10px !important;
    }
    .bgm-play-btn {
      flex:1;
      padding:4px 7px !important;
      font-size:10px !important;
    }
    .stat-counter-bar {
      display: flex; justify-content: space-around; font-size: 11.5px; font-weight: 800;
      padding-bottom: 6px; border-bottom: 1.5px dashed #CBD5E1;
    }
    .mini-room-box {
      background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: 12px;
      padding: 10px 4px; text-align: center; position: relative;
    }
    .large-mii-frame {
      width: 115px; height: 115px; border-radius: 50%;
      border: 3px solid #1E293B; background: #FDE047;
      margin: 0 auto; overflow: hidden; display: flex; align-items: center; justify-content: center;
      box-shadow: 2px 2px 0px rgba(0,0,0,0.15);
    }
    .large-mii-frame svg, .large-mii-frame img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .character-stage{width:100%;display:flex;align-items:center;justify-content:center;position:relative;margin:8px auto 2px}
    .character-profile-viewport{width:200px;height:244px;position:relative;overflow:visible;border:3px solid #1E293B;border-radius:14px;background:#E5E7EB;box-shadow:2px 2px 0 rgba(0,0,0,.15)}
    .character-frame-stack{width:230px;height:280px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.87);transform-origin:center center;overflow:visible;background:transparent}
    .character-frame-clip{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;border-radius:12px;background:#E5E7EB}
    .character-bg-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
    .character-base-layer{position:absolute;z-index:2;pointer-events:none;object-fit:contain}
    .character-accessory-layer{position:absolute;z-index:6;pointer-events:none;object-fit:contain}
    .character-slogan-layer{position:absolute;z-index:7;object-fit:contain;pointer-events:none}
    .character-frame-overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:12;pointer-events:none}
.shop-summary-box{display:flex;justify-content:space-between;align-items:center;background:#FFF7ED;border:1.5px solid #FDBA74;border-radius:10px;padding:7px 9px;font-size:11px;font-weight:900}.shop-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.shop-card{border:2px solid #E2E8F0;border-radius:12px;padding:9px;background:#FFF;display:flex;flex-direction:column;gap:7px;min-width:0}.shop-card.equipped{border-color:#EA580C;background:#FFF7ED}.shop-preview{width:100%;aspect-ratio:1.45/1;border-radius:9px;overflow:hidden;background:#F1F5F9;border:1px solid #E2E8F0;display:flex;align-items:center;justify-content:center}.shop-preview img{width:100%;height:100%;object-fit:contain}.shop-preview.bg img{object-fit:cover}.shop-preview.frame img{object-fit:contain;background:#F8FAFC}.shop-item-name{font-size:12px;font-weight:900;line-height:1.25}.shop-item-meta{font-size:10.5px;color:#64748B;font-weight:700;line-height:1.3}.shop-category-tabs{display:flex;gap:6px;flex-wrap:wrap}.shop-category-btn{border:2px solid #CBD5E1;background:#FFF;color:#334155;border-radius:8px;padding:7px 10px;font-size:11.5px;font-weight:900;cursor:pointer}.shop-category-btn.active{background:#1E293B;color:#FFF;border-color:#1E293B}.ticket-result{margin-top:8px;font-size:13px;font-weight:900;color:#7C3AED}
    .shop-card.previewing{border-color:#7C3AED;background:#F5F3FF}
    .shop-preview-btn{width:100%;padding:7px 4px;font-size:11px;border-color:#7C3AED;color:#6D28D9}
    .shop-preview-panel{margin-top:14px;border:2px solid #C4B5FD;background:#FAF5FF;border-radius:14px;padding:12px}
    .shop-preview-stage{width:230px;height:280px;max-width:100%;margin:14px auto 10px;position:relative;overflow:visible;border:3px solid #1E293B;border-radius:16px;background:#E5E7EB}
    .preview-stage-clip{position:absolute;inset:0;overflow:hidden;border-radius:13px;background:#E5E7EB}
    .shop-preview-stage .preview-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
    .shop-preview-stage .preview-char{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
    .shop-preview-stage.cutout-stage{background:
      linear-gradient(45deg,#eef2f7 25%,transparent 25%),
      linear-gradient(-45deg,#eef2f7 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#eef2f7 75%),
      linear-gradient(-45deg,transparent 75%,#eef2f7 75%);
      background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0}
    .shop-preview-stage .preview-char-cutout,
    .character-frame-stack .character-base-cutout{
      position:absolute;z-index:2;pointer-events:none;
      object-fit:contain;object-position:center bottom;transform-origin:center center;
    }
    .character-frame-stack{overflow:visible}
    .character-frame-clip{position:absolute;inset:0;border-radius:12px;overflow:hidden}
    .character-frame-clip .character-bg-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
    .character-frame-clip .character-base-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
    .character-frame-stack .character-accessory-layer{z-index:6}
    .character-slogan-layer{position:absolute;z-index:7;object-fit:contain;pointer-events:none}

    .shop-preview-stage .preview-slogan{position:absolute;z-index:5;object-fit:contain;pointer-events:none}
    .shop-preview-stage .preview-accessory{position:absolute;z-index:6;object-fit:contain;pointer-events:none}
    .shop-preview-stage .preview-frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:12;pointer-events:none}
    .preview-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
    .preview-control{background:#FFF;border:1.5px solid #E2E8F0;border-radius:9px;padding:7px}
    .preview-control label{display:flex;justify-content:space-between;font-size:10.5px;font-weight:900;color:#475569;margin-bottom:4px}
    .preview-control input{width:100%}
    .character-adjust-box{margin-top:12px;padding:12px;border:2px solid #93C5FD;border-radius:13px;background:#EFF6FF}
    .character-adjust-title{font-size:12px;font-weight:900;color:#1E3A8A;margin-bottom:3px}
    .character-adjust-help{font-size:10.5px;color:#64748B;margin-bottom:9px;line-height:1.4}
    .character-adjust-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:8px;flex-wrap:wrap}

    .left-emotion-badge {
      position: absolute; top: 18px; right: 40px;
      width: 32px; height: 32px; background: #FFFFFF; border: 2px solid #1E293B;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 16px; box-shadow: 1px 1px 0px #1E293B;
    }
    .char-spec-box {
      background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: 10px;
      padding: 8px 10px; font-size: 11.5px; text-align: left; line-height: 1.4;
    }
    .streak-week-box {
      display: flex; justify-content: space-between; background: #F8FAFC;
      border: 1.5px solid #E2E8F0; border-radius: 10px; padding: 6px 8px;
    }
    .streak-day-item { text-align: center; }
    .streak-day-name { font-size: 10px; color: #64748B; font-weight: 800; }
    .streak-day-icon { font-size: 12px; margin-top: 2px; min-height: 16px; display:flex; align-items:center; justify-content:center; }
    .streak-today-tag { font-size: 9px; color: #EA580C; font-weight: 900; }
    .stamina-progress-bg {
      width: 100%; height: 8px; background: #E2E8F0; border-radius: 6px;
      overflow: hidden; margin-top: 4px; border: 1px solid #CBD5E1;
    }
    .stamina-progress-fill { height: 100%; background: #EA580C; transition: width 0.3s ease; }
    
    .hompy-nav-tabs {
      width: 78px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;
    }
    .btn-tab-menu {
      width: 100%; padding: 12px 4px; background: #1E293B; color: #FFFFFF;
      border: 2px solid #1E293B; border-radius: 10px; font-size: 12.5px; font-weight: 800;
      cursor: pointer; text-align: center; transition: all 0.15s ease;
    }
    .btn-tab-menu:hover, .btn-tab-menu.active {
      background: #EA580C !important; border-color: #EA580C !important; color: #FFFFFF !important;
    }
    .hompy-main-content {
      flex-grow: 1; background: #FFFFFF; border: 2px solid #CBD5E1;
      border-radius: 16px; padding: 20px 22px; display: flex; flex-direction: column;
      min-width: 0; overflow: hidden;
    }
    .main-speech-bubble {
      background: #F8FAFC; border: 2px solid #1E293B; border-radius: 12px;
      padding: 12px 18px; font-weight: 800; font-size: 14px; color: #1E293B;
      margin-bottom: 16px; box-shadow: 2px 2px 0px #1E293B;
    }
    .flashcard-box {
      background: #F8FAFC; border: 2.5px solid #1E293B; border-radius: 16px;
      min-height: 250px; display: flex; flex-direction: column; justify-content: center;
      align-items: center; padding: 25px; text-align: center; box-shadow: 3px 3px 0px #1E293B; cursor: pointer;
    }
    .option-btn {
      width: 100%; text-align: left; margin-bottom: 10px;
      padding: 12px 16px; border-radius: 10px; font-weight: 700;
      border: 2px solid #CBD5E1; background: #FFFFFF; font-size: 14.5px; cursor: pointer;
    }
    .option-btn:hover { background: #F1F5F9; border-color: #1E293B; }
    .btn-correct { background-color: #1E293B !important; color: #FFFFFF !important; }
    .btn-wrong { background-color: #FEE2E2 !important; color: #DC2626 !important; }
    .btn-pixel-black {
      background: #1E293B; border: 2px solid #1E293B; color: #FFFFFF;
      font-weight: 800; border-radius: 8px; padding: 8px 16px; cursor: pointer;
    }
    .btn-pixel-black:hover { background: #EA580C; border-color: #EA580C; }
    .btn-pixel-white {
      background: #FFFFFF; border: 2px solid #1E293B; color: #1E293B;
      font-weight: 800; border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer;
    }
    .btn-pixel-white:hover { background: #F1F5F9; }
    .word-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #E2E8F0; }
    .history-table { width: 100%; border-collapse: collapse; }
    .history-table th { background: #F1F5F9; padding: 8px; font-size: 12.5px; border-bottom: 2px solid #CBD5E1; text-align: center; }
    .history-table td { padding: 10px 8px; border-bottom: 1px solid #E2E8F0; font-size: 13px; text-align: center; }
    .custom-input-row { display: flex; gap: 8px; align-items: center; width: 100%; margin-bottom: 12px; }
    .custom-input-row input, .std-input {
      border: 2px solid #CBD5E1; border-radius: 8px; padding: 8px 10px; font-size: 13.5px; height: 38px; width: 100%;
    }
    .scan-import-box{margin-top:12px;padding:13px;border:1.5px solid #93C5FD;border-radius:12px;background:#EFF6FF}
    .scan-import-grid{display:grid;grid-template-columns:130px 1fr auto;gap:8px;align-items:end}
    .scan-import-grid label{font-size:10.5px;font-weight:900;color:#1E3A8A;display:flex;flex-direction:column;gap:5px}
    .scan-import-grid input{height:38px;border:1.5px solid #93C5FD;border-radius:8px;background:#FFF;padding:0 9px;font:inherit}
    .scan-preview{margin-top:10px;display:grid;grid-template-columns:170px 1fr;gap:10px}
    .scan-image-box{min-height:140px;border:1.5px dashed #93C5FD;border-radius:9px;background:#FFF;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#94A3B8;font-size:10px;font-weight:800;text-align:center;padding:8px}
    .scan-image-box img{max-width:100%;max-height:230px;object-fit:contain}
    .scan-result-list{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:7px;margin-top:8px}
    .scan-result-row{display:grid;grid-template-columns:1fr 1.2fr auto;gap:6px;align-items:center}
    .scan-result-row input{height:34px;border:1px solid #CBD5E1;border-radius:7px;padding:0 8px;font-size:11px}
    @media(max-width:700px){.scan-import-grid,.scan-preview,.scan-result-row{grid-template-columns:1fr}}


    .accent-btn-group {
      display: inline-flex; gap: 4px; background: #E2E8F0; padding: 3px; border-radius: 8px;
    }
    .accent-btn {
      border: none; background: transparent; padding: 4px 8px; font-size: 11.5px;
      font-weight: 800; border-radius: 6px; cursor: pointer; color: #475569;
    }
    .accent-btn.active {
      background: #1E293B; color: #FFFFFF;
    }

    .test-scope-box{
      border:1.5px solid #CBD5E1;
      border-radius:12px;
      background:#F8FAFC;
      padding:10px;
      margin-bottom:12px;
    }
    .test-source-tabs{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      margin-bottom:9px;
    }
    .test-source-btn{
      border:2px solid #CBD5E1;
      border-radius:8px;
      background:#FFF;
      color:#334155;
      padding:6px 9px;
      font-size:11px;
      font-weight:900;
      cursor:pointer;
    }
    .test-source-btn.active{
      background:#1E293B;
      border-color:#1E293B;
      color:#FFF;
    }
    .test-day-list{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      align-items:center;
    }
    .test-day-chip{
      border:2px solid #CBD5E1;
      border-radius:999px;
      background:#FFF;
      color:#475569;
      padding:5px 9px;
      font-size:10.5px;
      font-weight:900;
      cursor:pointer;
    }
    .test-day-chip.active{
      background:#EA580C;
      border-color:#EA580C;
      color:#FFF;
    }

    .multi-day-dropdown{position:relative;width:190px;}
    .multi-day-dropdown summary{
      list-style:none;border:2px solid #CBD5E1;border-radius:8px;background:#FFF;
      padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer;
      display:flex;justify-content:space-between;align-items:center;
    }
    .multi-day-dropdown summary::-webkit-details-marker{display:none}
    .multi-day-menu{
      position:absolute;z-index:50;left:0;top:39px;width:190px;max-height:250px;overflow-y:auto;
      border:2px solid #CBD5E1;border-radius:8px;background:#FFF;box-shadow:0 8px 20px rgba(15,23,42,.15);
      padding:5px;

    // 커스텀 파일 기기 간 동기화를 위해 Supabase Storage에

      tsumu: `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="50" fill="#CA8A04"/><circle cx="50" cy="55" r="28" fill="#FDDFB7"/><path d="M22 45 C25 18 75 18 78 45 C65 30 55 32 50 30 C45 32 35 30 22 45 Z" fill="#EAB308"/><path d="M45 25 L75 35 L65 45 Z" fill="#CA8A04"/><ellipse cx="38" cy="52" rx="4" ry="5" fill="#1E293B"/><ellipse cx="62" cy="52" rx="4" ry="5" fill="#1E293B"/><circle cx="39" cy="50" r="1.5" fill="#FFF"/><circle cx="63" cy="50" r="1.5" fill="#FFF"/><path d="M34 46 L44 45" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/><path d="M66 46 L56 45" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/><path d="M44 66 Q50 70 56 66" stroke="#1E293B" stroke-width="2" fill="none"/><path d="M30 82 L70 82 L65 100 L35 100 Z" fill="#18181B"/></svg>`,
      osamu: `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="50" fill="#475569"/><circle cx="50" cy="55" r="28" fill="#FDDFB7"/><path d="M22 45 C25 18 75 18 78 45 C65 30 55 32 50 30 C45 32 35 30 22 45 Z" fill="#64748B"/><ellipse cx="38" cy="52" rx="4" ry="5" fill="#1E293B"/><ellipse cx="62" cy="52" rx="4" ry="5" fill="#1E293B"/><circle cx="39" cy="50" r="1.5" fill="#FFF"/><circle cx="63" cy="50" r="1.5" fill="#FFF"/><path d="M34 47 L44 47" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/><path d="M66 47 L56 47" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/><path d="M45 67 L55 67" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/><path d="M30 82 L70 82 L65 100 L35 100 Z" fill="#18181B"/></svg>`
    };


    // --------------------------------------------------------------
    // 사용자 추가 커스터마이징
    // 기존 캐릭터/아이템/BGM은 그대로 유지하고 사용자 파일을 추가로 합칩니다.
    // 업로드 파일은 현재 브라우저 IndexedDB에 저장됩니다.
    // --------------------------------------------------------------
    const CUSTOM_META_KEY = 'haikyu_extra_custom_content_v1';
    const CUSTOM_DB_NAME = 'haikyu_extra_custom_assets_v1';
    const CUSTOM_STORE = 'assets';
    let CUSTOM_CONTENT = loadCustomContent();
    const CUSTOM_ASSET_URLS = {};

    function loadCustomContent(){
      try{
        const v=JSON.parse(localStorage.getItem(CUSTOM_META_KEY)||'null');
        return {
          variants:Array.isArray(v?.variants)?v.variants:[],
          items:Array.isArray(v?.items)?v.items:[],
          bgm:Array.isArray(v?.bgm)?v.bgm:[],
          speech:v?.speech&&typeof v.speech==='object'?v.speech:{}
        };
      }catch(e){
        return {variants:[],items:[],bgm:[],speech:{}};
      }
    }
    function saveCustomContent(){
      localStorage.setItem(CUSTOM_META_KEY,JSON.stringify(CUSTOM_CONTENT));
    }
    function openCustomDB(){
      return new Promise((resolve,reject)=>{
        const req=indexedDB.open(CUSTOM_DB_NAME,1);
        req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(CUSTOM_STORE))req.result.createObjectStore(CUSTOM_STORE)};
        req.onsuccess=()=>resolve(req.result);
        req.onerror=()=>reject(req.error);
      });
    }
    async function putCustomAsset(id,file){
      const db=await openCustomDB();
      await new Promise((resolve,reject)=>{
        const tx=db.transaction(CUSTOM_STORE,'readwrite');
        tx.objectStore(CUSTOM_STORE).put(file,id);
        tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
      });
      await hydrateCustomAsset(id);
    }
    async function getCustomAsset(id){
      const db=await openCustomDB();
      return new Promise((resolve,reject)=>{
        const req=db.transaction(CUSTOM_STORE).objectStore(CUSTOM_STORE).get(id);
        req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
      });
    }
    async function deleteCustomAsset(id){
      const db=await openCustomDB();
      await new Promise((resolve,reject)=>{
        const tx=db.transaction(CUSTOM_STORE,'readwrite');
        tx.objectStore(CUSTOM_STORE).delete(id);
        tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
      });
      if(CUSTOM_ASSET_URLS[id])URL.revokeObjectURL(CUSTOM_ASSET_URLS[id]);
      delete CUSTOM_ASSET_URLS[id];
    }
    async function hydrateCustomAsset(id){
      const blob=await getCustomAsset(id);
      if(!blob)return;
      if(CUSTOM_ASSET_URLS[id])URL.revokeObjectURL(CUSTOM_ASSET_URLS[id]);
      CUSTOM_ASSET_URLS[id]=URL.createObjectURL(blob);
    }
    async function hydrateCustomAssets(){
      const ids=new Set();
      CUSTOM_CONTENT.variants.forEach(v=>ids.add(v.assetId));
      CUSTOM_CONTENT.items.forEach(v=>ids.add(v.assetId));
      CUSTOM_CONTENT.bgm.forEach(v=>ids.add(v.assetId));
      for(const id of ids)if(id)await hydrateCustomAsset(id);
    }
    function customAssetUrl(assetId){return CUSTOM_ASSET_URLS[assetId]||''}


    // --------------------------------------------------------------
    // 기기 간 커스터마이징 동기화 (Supabase Storage + 기존 DB 테이블)
    //
    // Supabase에서 아래 이름의 PUBLIC bucket을 한 번 만들어주세요:
    //   custom-assets
    //
    // 이 코드는 기존 haikyu_voca_data 테이블에 character="__custom_content__"
    // 특수 행을 하나 사용해 커스텀 메타데이터를 저장합니다.
    // 실제 PNG/JPG/MP3 파일은 Storage bucket에 저장합니다.
    // --------------------------------------------------------------
    const CUSTOM_STORAGE_BUCKET = 'custom-assets';
    const CUSTOM_CLOUD_CHARACTER = '__custom_content__';

    // 같은 사용자 + 같은 언어에서는 어떤 캐릭터를 선택해도 공부 데이터가 공유됩니다.
    // 지연/경민은 user_name이 다르므로 서로 완전히 분리됩니다.
    const SHARED_STUDY_CHARACTER = '__shared_study__';

    function safeCloudPart(v){
      return String(v||'guest')
        .normalize('NFKC')
        .replace(/[^a-zA-Z0-9가-힣._-]+/g,'_')
        .slice(0,80) || 'guest';
    }

    function getCustomCloudScope(){
      // 같은 사용자라면 영어/일본어와 상관없이 같은 커스텀 파일 목록을 사용
      return safeCloudPart(state.user||'guest');
    }

    function getCustomCloudPublicUrl(path){
      if(!supabaseClient || !path) return '';
      const { data } = supabaseClient.storage.from(CUSTOM_STORAGE_BUCKET).getPublicUrl(path);
      return data?.publicUrl || '';
    }

    function refreshCustomCloudUrls(){
      const all=[...CUSTOM_CONTENT.variants,...CUSTOM_CONTENT.items,...CUSTOM_CONTENT.bgm];
      all.forEach(x=>{
        if(x.assetId && x.filePath){
          const url=getCustomCloudPublicUrl(x.filePath);
          if(url) CUSTOM_ASSET_URLS[x.assetId]=url;
        }
      });
    }

    async function uploadCustomFileToCloud(file, kind, assetId){
      if(!supabaseClient) throw new Error('Supabase 연결이 없습니다.');
      const ext=(file.name.split('.').pop()||'bin').replace(/[^a-zA-Z0-9]/g,'').toLowerCase() || 'bin';
      const scope=getCustomCloudScope();
      const path=`${scope}/${kind}/${Date.now()}_${safeCloudPart(assetId)}.${ext}`;

      const { error }=await supabaseClient.storage
        .from(CUSTOM_STORAGE_BUCKET)
        .upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||undefined});

      if(error) throw error;
      return {path,url:getCustomCloudPublicUrl(path)};
    }

    async function deleteCustomFileFromCloud(path){
      if(!supabaseClient || !path) return;
      const { error }=await supabaseClient.storage.from(CUSTOM_STORAGE_BUCKET).remove([path]);
      if(error) console.warn('Storage delete failed:',error);
    }

    function getCustomCloudPayload(){
      // blob URL은 저장하지 않고 Storage 경로만 저장
      return {
        version:2,
        variants:CUSTOM_CONTENT.variants.map(v=>({...v})),
        items:CUSTOM_CONTENT.items.map(i=>({...i})),
        bgm:CUSTOM_CONTENT.bgm.map(b=>({...b})),
        speech:CUSTOM_CONTENT.speech||{}
      };
    }

    async function saveCloudCustomContent(options={}){
      saveCustomContent(); // 로컬 백업도 유지
      if(!supabaseClient || !state.user) return false;

      const cloudReadyOnly=!!options.cloudReadyOnly;
      const original=CUSTOM_CONTENT;
      const cloudContent=cloudReadyOnly?{
        variants:(CUSTOM_CONTENT.variants||[]).filter(x=>x.filePath),
        items:(CUSTOM_CONTENT.items||[]).filter(x=>x.filePath),
        bgm:(CUSTOM_CONTENT.bgm||[]).filter(x=>x.filePath),
        speech:CUSTOM_CONTENT.speech||{}
      }:CUSTOM_CONTENT;

      const payload={
        user_name:state.user,
        lang:'__shared__',
        character:CUSTOM_CLOUD_CHARACTER,
        exp:0,
        coins:0,
        satisfaction:3,
        stamina:3,
        my_vocab_ids:[],
        attendance_dates:[],
        study_history:[],
        spaced_rep_data:{__custom_content:{
          version:3,
          variants:cloudContent.variants.map(v=>({...v})),
          items:cloudContent.items.map(i=>({...i})),
          bgm:cloudContent.bgm.map(b=>({...b})),
          speech:cloudContent.speech||{}
        }},
        custom_words:[],
        updated_at:new Date().toISOString()
      };

      const {error}=await supabaseClient
        .from('haikyu_voca_data')
        .upsert(payload,{onConflict:'user_name,lang,character'});

      if(error){
        console.warn('Custom metadata cloud save failed:',error);
        return false;
      }
      return true;
    }


    function mergeCustomContent(localContent,cloudContent){
      const mergeById=(a,b)=>{
        const map=new Map();
        [...(a||[]),...(b||[])].forEach(x=>{
          if(!x||!x.id)return;
          map.set(x.id,{...(map.get(x.id)||{}),...x});
        });
        return [...map.values()];
      };
      return {
        variants:mergeById(localContent?.variants,cloudContent?.variants),
        items:mergeById(localContent?.items,cloudContent?.items),
        bgm:mergeById(localContent?.bgm,cloudContent?.bgm),
        speech:{...(localContent?.speech||{}),...(cloudContent?.speech||{})}
      };
    }

    async function loadCloudCustomContent(){
      if(!supabaseClient || !state.user){
        await hydrateCustomAssets();
        return false;
      }

      try{
        const localBefore=JSON.parse(JSON.stringify(CUSTOM_CONTENT));
        const {data,error}=await supabaseClient
          .from('haikyu_voca_data')
          .select('spaced_rep_data,updated_at')
          .eq('user_name',state.user)
          .eq('lang','__shared__')
          .eq('character',CUSTOM_CLOUD_CHARACTER)
          .maybeSingle();

        if(error)throw error;

        const cloud=data?.spaced_rep_data?.__custom_content;
        if(cloud&&typeof cloud==='object'){
          // 클라우드 내용을 로컬 위에 덮어써서 로컬 전용 파일을 잃지 않고 병합
          CUSTOM_CONTENT=mergeCustomContent(localBefore,{
            variants:Array.isArray(cloud.variants)?cloud.variants:[],
            items:Array.isArray(cloud.items)?cloud.items:[],
            bgm:Array.isArray(cloud.bgm)?cloud.bgm:[],
            speech:cloud.speech&&typeof cloud.speech==='object'?cloud.speech:{}
          });
          saveCustomContent();
          refreshCustomCloudUrls();

          // 이 기기에만 남은 예전 파일이 있으면 즉시 Storage 업로드 재시도
          await migrateLocalCustomContentToCloud();
          refreshCustomCloudUrls();
          return true;
        }

        // 클라우드 메타가 아직 없다면 이 기기의 커스텀 파일을 최초 업로드
        const hasLocal=CUSTOM_CONTENT.variants.length||CUSTOM_CONTENT.items.length||CUSTOM_CONTENT.bgm.length||Object.keys(CUSTOM_CONTENT.speech||{}).length;
        if(hasLocal){
          await migrateLocalCustomContentToCloud();
          refreshCustomCloudUrls();
          return true;
        }
      }catch(e){
        console.warn('Custom cloud load failed; local custom content used:',e);
        await hydrateCustomAssets();
      }
      return false;
    }

    async function migrateLocalCustomContentToCloud(){
      if(!supabaseClient||!state.user)return false;
      let changed=false,failed=0,pending=0;
      const groups=[['variants','characters'],['items','items'],['bgm','bgm']];

      for(const [key,kind] of groups){
        for(const entry of CUSTOM_CONTENT[key]){
          if(entry.filePath)continue;
          if(!entry.assetId)continue;
          const blob=await getCustomAsset(entry.assetId);
          if(!blob){pending++;continue;}
          try{
            const ext=(blob.type||'application/octet-stream').split('/').pop()||'bin';
            const pseudoName=`${entry.name||entry.title||entry.id}.${ext}`;
            const file=new File([blob],pseudoName,{type:blob.type||'application/octet-stream'});
            const up=await uploadCustomFileToCloud(file,kind,entry.assetId);
            entry.filePath=up.path;
            CUSTOM_ASSET_URLS[entry.assetId]=up.url;
            changed=true;
          }catch(e){
            failed++;
            console.warn('Local custom migration failed:',entry,e);
          }
        }
      }

      saveCustomContent();

      // 중요: 파일 업로드에 실패한 항목을 filePath="" 상태로 클라우드 메타에
      // 먼저 공개하면 다른 기기에서는 이미지/BGM을 절대 불러올 수 없습니다.
      // 따라서 실제 Storage 업로드가 끝난 항목만 클라우드 메타로 저장합니다.
      if(changed||Object.keys(CUSTOM_CONTENT.speech||{}).length){
        await saveCloudCustomContent({cloudReadyOnly:true});
      }
      return {changed,failed,pending};
    }

    async function cloudSyncCustomNow(){
      const el=document.getElementById('custom-cloud-status');
      if(el){el.textContent='☁️ 동기화 중...';el.style.color='';}
      try{
        await loadCloudCustomContent();
        const result=await migrateLocalCustomContentToCloud();
        refreshCustomCloudUrls();
        const localOnly=[...CUSTOM_CONTENT.variants,...CUSTOM_CONTENT.items,...CUSTOM_CONTENT.bgm].filter(x=>x.assetId&&!x.filePath);
        if(localOnly.length){
          if(el){el.textContent=`⚠️ ${localOnly.length}개 파일이 아직 이 기기에만 있어요 · Supabase Storage 설정을 확인해주세요.`;el.style.color='#B45309';}
        }else{
          if(el){el.textContent='✅ 모든 커스텀 파일이 클라우드에 동기화됨';el.style.color='#15803D';}
        }
        render();
      }catch(e){
        console.warn('Custom cloud sync failed:',e);
        if(el){el.textContent='⚠️ 동기화 실패 · Supabase Storage 연결/정책을 확인해주세요.';el.style.color='#B45309';}
      }
    }

    function setCustomCloudStatus(message, isError=false){
      const el=document.getElementById('custom-cloud-status');
      if(!el) return;
      el.textContent=message;
      el.style.color=isError?'#B45309':'#0F766E';

      },
      tsumu: {

        num: "7", school: "이나리자키", pos: "Setter (세터)", food: "참치 뱃살", act: "2도류 서브", motto: "내 토스 칠 자격 있나? 증명해봐라."

    function getCharacterVariants(charKey=state.char){
      const meta=CHAR_META[charKey]||CHAR_META.kageyama;
      const base=CHAR_VARIANTS[charKey] || [{id:"default",name:`기본 ${meta.name}`,file:meta.imgFile}];
      const extra=CUSTOM_CONTENT.variants
        .filter(v=>v.charKey===charKey)
        .map(v=>({...v,file:customAssetUrl(v.assetId)}));
      return [...base,...extra];
    }

    function getSelectedVariant(charKey=state.char){
      const list=getCharacterVariants(charKey);
      const wanted=(charKey===state.char ? state.charVariant : null) || "default";
      return list.find(v=>v.id===wanted) || list[0];
    }

    function getActiveCharacterMeta(charKey=state.char){
      const meta=CHAR_META[charKey]||CHAR_META.kageyama;
      const variant=(charKey===state.char)
        ? getSelectedVariant(charKey)
        : (getCharacterVariants(charKey)[0] || {file:meta.imgFile});
      return {...meta,imgFile:variant.file,variantName:variant.name,variantId:variant.id};
    }

    function getVariantStorageKey(charKey=state.char){
      return `haikyu_char_variant_${state.user||'guest'}_${state.lang||'en'}_${charKey}`;
    }

    function loadSavedVariant(charKey=state.char){
      const list=getCharacterVariants(charKey);

      state.charVariant=list.some(v=>v.id===saved)?saved:(list[0]?.id||"default");
    }

    }

    function getManagedShopItem(id){const raw=getRawShopItems().find(x=>x.id===id),edits=state.userData?.shop?.catalogEdits||{};return raw?({...raw,...(edits[id]||{})}):null}
    function getCharacterShopData(charKey=state.char){
      const shop=state.userData.shop;
      shop.characterData=shop.characterData||{};

      if(!shop.characterData[charKey]){
        shop.characterData[charKey]={ownedItems:[],ownedCounts:{},variantData:{}};
      }

      const d=shop.characterData[charKey];
      d.ownedItems=Array.isArray(d.ownedItems)?Array.from(new Set(d.ownedItems)):[];
      d.ownedCounts=d.ownedCounts&&typeof d.ownedCounts==='object'?d.ownedCounts:{};
      d.ownedItems.forEach(id=>{if(!Number(d.ownedCounts[id]))d.ownedCounts[id]=1;});
      d.variantData=d.variantData&&typeof d.variantData==='object'?d.variantData:{};

      // 기존 캐릭터 단위 장착/위치 데이터를 현재 버전으로 1회 이전
      if(!d._variantMigrationDone){
        const legacyEquipped=d.equipped&&typeof d.equipped==='object'?d.equipped:null;
        const legacyTransforms=d.transforms&&typeof d.transforms==='object'?d.transforms:null;
        const legacyCharacterTransform=d.characterTransform&&typeof d.characterTransform==='object'?d.characterTransform:null;
        const variantId=(charKey===state.char ? (state.charVariant||'default') : 'default');

        if(!d.variantData[variantId]){
          d.variantData[variantId]={
            equipped:{background:null,slogan:null,frame:null,head:null,face:null,side:null,effect:null},
            transforms:{},
            characterTransform:{x:0,y:34,scale:78}
          };
        }

        const vd=d.variantData[variantId];
        if(legacyEquipped && Object.values(legacyEquipped).some(Boolean)){
          vd.equipped={background:null,slogan:null,frame:null,head:null,face:null,side:null,effect:null,...legacyEquipped};
        }
        if(legacyTransforms && Object.keys(legacyTransforms).length){
          vd.transforms={...legacyTransforms};
        }
        if(legacyCharacterTransform){
          vd.characterTransform={
            x:Number(legacyCharacterTransform.x ?? 0),
            y:Number(legacyCharacterTransform.y ?? 34),
            scale:Number(legacyCharacterTransform.scale ?? 78)
          };
        }

        delete d.equipped;
        delete d.transforms;
        delete d.characterTransform;
        d._variantMigrationDone=true;
      }

      // 더 오래된 global shop 구매 데이터를 캐릭터 공용 인벤토리로 이전
      if(!d._legacyMigrated){
        const legacyOwned=Array.isArray(shop.ownedItems)?shop.ownedItems:[];
        if(legacyOwned.length && d.ownedItems.length===0){

    function getCharacterVariantData(charKey=state.char, variantId=null){
      const charShop=getCharacterShopData(charKey);
      const resolvedVariant=variantId || (charKey===state.char ? (state.charVariant||'default') : 'default');

      charShop.variantData=charShop.variantData||{};
      if(!charShop.variantData[resolvedVariant]){
        charShop.variantData[resolvedVariant]={
          equipped:{background:null,slogan:null,frame:null,head:null,face:null,side:null,effect:null},
          transforms:{},
          characterTransform:{x:0,y:34,scale:78}
        };
      }

      const vd=charShop.variantData[resolvedVariant];
      vd.equipped={background:null,slogan:null,frame:null,head:null,face:null,side:null,effect:null,...(vd.equipped||{})};
      vd.equippedAccessories=Array.isArray(vd.equippedAccessories)?vd.equippedAccessories:[];
      if(!vd._multiAccessoryMigrated){
        ['head','face','side','effect'].forEach(slot=>{
          const itemId=vd.equipped[slot];
          if(itemId&&!vd.equippedAccessories.some(x=>x.itemId===itemId)){
            const item=getManagedShopItem(itemId);
            vd.equippedAccessories.push({instanceId:`legacy_${slot}_${itemId}`,itemId,slot,transform:{...(vd.transforms?.[itemId]||(item?getDefaultTransform(item):{x:0,y:0,scale:30,opacity:100,rotate:0}))}});
          }
          vd.equipped[slot]=null;
        });
        vd._multiAccessoryMigrated=true;
      }
      vd.transforms=vd.transforms&&typeof vd.transforms==='object'?vd.transforms:{};
      vd.characterTransform={
        x:Number(vd.characterTransform?.x ?? 0),
        y:Number(vd.characterTransform?.y ?? 34),
        scale:Number(vd.characterTransform?.scale ?? 78)
      };
      return vd;
    }

    function getShopDefaultData(){return {tickets:0,legacySeedRemoved:true,ownedItems:[],equipped:{background:null,slogan:null,frame:null,head:null,face:null,side:null,effect:null},ticketClaims:{},transforms:{},characterData:{},catalogEdits:{},deletedItemIds:[]}}
    function normalizeShopData(v){
      const b=getShopDefaultData(),s=v&&typeof v==='object'?v:{};
      const isExistingShop = v && typeof v==='object';
      let tickets=Number(s.tickets||0);
      let legacySeedRemoved = s.legacySeedRemoved === true;

      // 예전 버전에서 캐릭터마다 자동 지급되던 50장을 딱 한 번 제거.
      // 예: 50장 → 0장, 63장 → 실제로 공부/교환해서 번 13장만 유지.
      if(isExistingShop && !legacySeedRemoved){
        tickets=Math.max(0,tickets-50);
        legacySeedRemoved=true;
      }

      return {
        tickets,
        legacySeedRemoved,
        ownedItems:Array.isArray(s.ownedItems)?Array.from(new Set(s.ownedItems)):[],
        equipped:{...b.equipped,...(s.equipped&&typeof s.equipped==='object'?s.equipped:{})},
        ticketClaims:s.ticketClaims&&typeof s.ticketClaims==='object'?s.ticketClaims:{},
        transforms:s.transforms&&typeof s.transforms==='object'?s.transforms:{},
        characterData:s.characterData&&typeof s.characterData==='object'?s.characterData:{},
        catalogEdits:s.catalogEdits&&typeof s.catalogEdits==='object'?s.catalogEdits:{},
        deletedItemIds:Array.isArray(s.deletedItemIds)?Array.from(new Set(s.deletedItemIds)):[]
      }
    }

    function getCharSpeech(type, subject='') {
      const custom=CUSTOM_CONTENT.speech?.[state.char]?.[type];
      if(typeof custom==='string' && custom.trim()) return custom.replaceAll('{subject}',subject||'');
      const set = CHAR_SPEECH[state.char] || CHAR_SPEECH.kageyama;
      const value = set[type];
      return typeof value === 'function' ? value(subject) : (value || '');
    }

    function calculateTestReward(testType, correctCount) {
      const rule = REWARD_RULES[testType];
      if (!rule) return { exp:0, coins:0 };
      return { exp:correctCount*rule.expPerCorrect, coins:correctCount*rule.coinPerCorrect };
    }

    // CSV 파일을 UTF-8 / CP949(EUC-KR) 모두 안전하게 읽는다.
    // WORD3 같은 파일이 CP949로 저장되어 있어도 품사/Day 글자가 깨지지 않게 하기 위함.
    async function fetchCSVText(fileName) {
      const res = await fetch(fileName);
      if (!res.ok) throw new Error(`${fileName} HTTP ${res.status}`);

      const bytes = await res.arrayBuffer();
      let text = '';

      // 1순위: 정상 UTF-8
      try {
        text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      } catch (utf8Error) {
        // 2순위: Windows 한글 CSV에서 흔한 CP949/EUC-KR
        try {
          text = new TextDecoder('euc-kr').decode(bytes);
          console.info(`${fileName}: CP949/EUC-KR 인코딩으로 읽었습니다.`);
        } catch (krError) {
          // 최후 백업
          text = new TextDecoder('utf-8').decode(bytes);
        }
      }

      // UTF-8 BOM 제거
      return text.replace(/^\uFEFF/, '');
    }

    // CSV 파일 자동 로드 및 파싱 함수
    async function loadAllCSVData() {
      BUILTIN_EN = [];
      BUILTIN_JA = [];

      // 1. 영어 CSV 로드
      const enFiles = ['toeic_vocab.csv', 'WORD2.csv', 'WORD3.csv'];
      for (const fn of enFiles) {
        try {
          const text = await fetchCSVText(fn);
          const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
          parsed.data.forEach((row, i) => {
            const w = String(row['word'] || row[' 단어'] || row['단어'] || '').trim();
            const m = String(row['meaning'] || row[' 뜻'] || row['의미'] || '').trim();
            const d = String(row['day'] || row['Day'] || '1').trim();
            if (w && m) {
              BUILTIN_EN.push({
                id: `${fn}_${i}`,
                day: d,
                word: w,
                raw_word: w,
                meaning: m
              });
            }
          });
        } catch (e) {
          console.warn(`Error loading ${fn}:`, e);
        }
      }

      // 업로드한 Power TOEIC 단어를 영어 내장 단어에 추가
      // id에 power_toeic_ 접두사를 붙여 기존 단어 ID와 충돌하지 않게 합니다.
      BUILTIN_EN.push(...POWER_TOEIC_EN.map(x=>({...x})));

      // 2. 일본어 CSV 로드
      const jaFiles = ['japanese_vocabulary.csv', 'japanese_vocabulary2.csv'];
      for (const fn of jaFiles) {
        try {
          const text = await fetchCSVText(fn);
          const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
          parsed.data.forEach((row, i) => {
            const cat = String(row['품사'] || row['분류'] || '명사').trim();
            const kanji = String(row['표기'] || '').trim();
            const yomi = String(row['요미가나'] || '').trim();
            const mean = String(row['한국어 뜻'] || row['뜻'] || '').trim();
            if (kanji && mean) {
              const disp = (yomi && yomi !== kanji) ? `${kanji} (${yomi})` : kanji;
              BUILTIN_JA.push({
                id: `${fn}_${i}`,
                day: cat,
                word: disp,
                raw_word: kanji,
                // 발음은 한자보다 요미가나를 우선 사용
                speech_word: yomi || kanji,
                meaning: mean
              });
            }
          });
        } catch (e) {
          console.warn(`Error loading ${fn}:`, e);
        }
      }
    }

        spacedRepData: (() => { const raw=(src.spacedRepData ?? src.spaced_rep_data)&&typeof (src.spacedRepData ?? src.spaced_rep_data)==='object'?{...(src.spacedRepData ?? src.spaced_rep_data)}:{}; delete raw.__shop; delete raw.__timer; delete raw.__todos; delete raw.__calendarEvents; delete raw.__mistakeNotes; delete raw.__conversationPhrases; delete raw.__customQuizSets; delete raw.__bubbleNotes; return raw; })(),
        customWords: Array.isArray(src.customWords ?? src.custom_words) ? (src.customWords ?? src.custom_words) : [],

    function uniqueByJson(list){
      const out=[], seen=new Set();
      (Array.isArray(list)?list:[]).forEach(v=>{
        const key=JSON.stringify(v);
        if(!seen.has(key)){seen.add(key);out.push(v);}
      });
      return out;
    }

    function mergeCharacterShopData(target={}, source={}){
      const out={...(target&&typeof target==='object'?target:{})};
      Object.entries(source&&typeof source==='object'?source:{}).forEach(([charKey,src])=>{
        if(!out[charKey]){
          out[charKey]=JSON.parse(JSON.stringify(src));
          return;
        }
        const dst=out[charKey];
        dst.ownedItems=Array.from(new Set([...(dst.ownedItems||[]),...(src.ownedItems||[])]));
        dst.ownedCounts={...(dst.ownedCounts||{})};Object.entries(src.ownedCounts||{}).forEach(([id,count])=>{dst.ownedCounts[id]=Math.max(Number(dst.ownedCounts[id]||0),Number(count||0));});
        dst.variantData={...(dst.variantData||{})};
        Object.entries(src.variantData||{}).forEach(([variantId,sv])=>{
          if(!dst.variantData[variantId]){
            dst.variantData[variantId]=JSON.parse(JSON.stringify(sv));
            return;
          }
          const dv=dst.variantData[variantId];
          dv.equipped={...(dv.equipped||{}),...(sv.equipped||{})};
          dv.equippedAccessories=uniqueByJson([...(dv.equippedAccessories||[]),...(sv.equippedAccessories||[])]);
          dv.transforms={...(dv.transforms||{}),...(sv.transforms||{})};
          if(sv.characterTransform) dv.characterTransform={...(dv.characterTransform||{}),...sv.characterTransform};
        });
      });
      return out;
    }

    function mergeUserDataRows(rows){
      const base=getDefaultUserData();
      if(!Array.isArray(rows)||!rows.length) return base;

      let result=getDefaultUserData();
      let newest=null;

      rows.forEach(raw=>{
        const d=normalizeUserData(raw);

        // 숫자 보상은 여러 캐릭터 데이터를 합산하면 중복 지급이 될 수 있어 최대값을 사용
        result.exp=Math.max(result.exp,Number(d.exp||0));
        result.coins=Math.max(result.coins,Number(d.coins||0));
        result.satisfaction=Math.max(result.satisfaction,Number(d.satisfaction||0));
        result.stamina=Math.max(result.stamina,Number(d.stamina||0));

        result.myVocabIds=Array.from(new Set([...(result.myVocabIds||[]),...(d.myVocabIds||[])]));
        result.attendanceDates=Array.from(new Set([...(result.attendanceDates||[]),...(d.attendanceDates||[])]));
        result.studyHistory=uniqueByJson([...(result.studyHistory||[]),...(d.studyHistory||[])]);
        result.customWords=uniqueByJson([...(result.customWords||[]),...(d.customWords||[])]);
        {
          const todoMap=new Map((result.todos||[]).map(x=>[x.id,x]));
          (d.todos||[]).forEach(x=>{
            if(!x||!x.id)return;
            todoMap.set(x.id,{...(todoMap.get(x.id)||{}),...x});
          });
          result.todos=[...todoMap.values()];
        }
        {
          const calMap=new Map((result.calendarEvents||[]).map(x=>[x.id,x]));
          (d.calendarEvents||[]).forEach(x=>{
            if(!x||!x.id)return;
            calMap.set(x.id,{...(calMap.get(x.id)||{}),...x});
          });
          result.calendarEvents=[...calMap.values()];
        }
        result.mistakeNotes=uniqueByJson([...(result.mistakeNotes||[]),...(d.mistakeNotes||[])]);
        result.conversationPhrases=uniqueByJson([...(result.conversationPhrases||[]),...(d.conversationPhrases||[])]);
        {
          const quizMap=new Map((result.customQuizSets||[]).map(x=>[x.id,x]));
          (d.customQuizSets||[]).forEach(x=>{if(x&&x.id)quizMap.set(x.id,{...(quizMap.get(x.id)||{}),...x});});
          result.customQuizSets=[...quizMap.values()];
        }
        result.todayWrongAnswers=uniqueByJson([...(result.todayWrongAnswers||[]),...(d.todayWrongAnswers||[])]).slice(-500);
        result.bubbleNotes={...(result.bubbleNotes||{}),...(d.bubbleNotes||{})};

        result.spacedRepData={...(result.spacedRepData||{}),...(d.spacedRepData||{})};

        result.shop=normalizeShopData(result.shop);
        const s=normalizeShopData(d.shop);
        result.shop.tickets=Math.max(Number(result.shop.tickets||0),Number(s.tickets||0));
        result.shop.ticketClaims={...(result.shop.ticketClaims||{}),...(s.ticketClaims||{})};
        result.shop.ownedItems=Array.from(new Set([...(result.shop.ownedItems||[]),...(s.ownedItems||[])]));
        result.shop.characterData=mergeCharacterShopData(result.shop.characterData,s.characterData);

        const rt=normalizeTimerData(result.timerData), st=normalizeTimerData(d.timerData);
        result.timerData={
          totalStudySeconds:Math.max(rt.totalStudySeconds,st.totalStudySeconds),
          completedPomodoros:Math.max(rt.completedPomodoros,st.completedPomodoros),
          history:uniqueByJson([...(rt.history||[]),...(st.history||[])])
        };

        if(!newest || String(raw.updated_at||'')>String(newest.updated_at||'')) newest=raw;
      });

      // 가장 최근 행의 현재 컨디션 값은 우선 유지
      if(newest){
        const nd=normalizeUserData(newest);
        result.satisfaction=nd.satisfaction;
        result.stamina=nd.stamina;
      }
      return normalizeUserData(result);
    }

    async function loadUserData() {
      const requestedUser = state.user;
      const requestedLang = state.lang;
      const userKey = getUserKey();
      const localBackup = loadLocalBackup(userKey);

      if (!supabaseClient) {
        state.userData = localBackup || getDefaultUserData();
        recordAttendance();
        return;
      }

      try {
        // 1) 새 공유 행이 있으면 그것을 사용
        const { data: sharedRow, error: sharedError } = await supabaseClient
          .from('haikyu_voca_data')
          .select('*')
          .eq('user_name', requestedUser)
          .eq('lang', requestedLang)
          .eq('character', SHARED_STUDY_CHARACTER)
          .maybeSingle();

        if (sharedError) throw sharedError;

        if (state.user !== requestedUser || state.lang !== requestedLang) return;

        if (sharedRow) {
          state.userData = normalizeUserData(sharedRow);
          saveLocalBackup(userKey, state.userData);
        } else {
          // 2) 예전에 캐릭터별로 나뉘어 있던 데이터를 한 번 모아서 공유 데이터로 이전
          const { data: legacyRows, error: legacyError } = await supabaseClient
            .from('haikyu_voca_data')
            .select('*')
            .eq('user_name', requestedUser)
            .eq('lang', requestedLang)
            .neq('character', CUSTOM_CLOUD_CHARACTER)
            .neq('character', SHARED_STUDY_CHARACTER);

          if (legacyError) throw legacyError;

          if (Array.isArray(legacyRows) && legacyRows.length) {
            state.userData = mergeUserDataRows(legacyRows);
          } else {
            state.userData = localBackup || getDefaultUserData();
          }

          saveLocalBackup(userKey, state.userData);
          await saveUserDataToCloud(requestedUser, requestedLang, SHARED_STUDY_CHARACTER, state.userData);
        }
      } catch (e) {
        console.warn('Supabase shared-study load failed. Using local backup:', e);
        state.userData = localBackup || getDefaultUserData();
      }

      recordAttendance();
    }

    async function saveUserDataToCloud(userName, lang, character, data) {
      if (!supabaseClient || !userName || !lang) return false;

      // 일반 공부 데이터는 캐릭터와 무관하게 사용자+언어 공유 행에 저장
      const targetCharacter = character === CUSTOM_CLOUD_CHARACTER
        ? CUSTOM_CLOUD_CHARACTER
        : SHARED_STUDY_CHARACTER;

      const payload = {
        user_name: userName,
        lang,
        character: targetCharacter,
        exp: Number(data.exp || 0),
        coins: Number(data.coins ?? 200),
        satisfaction: Number(data.satisfaction ?? 3),
        stamina: Number(data.stamina ?? 3),
        my_vocab_ids: Array.isArray(data.myVocabIds) ? data.myVocabIds : [],
        attendance_dates: Array.isArray(data.attendanceDates) ? data.attendanceDates : [],
        study_history: Array.isArray(data.studyHistory) ? data.studyHistory : [],
        spaced_rep_data: {
          ...(data.spacedRepData && typeof data.spacedRepData === 'object' ? data.spacedRepData : {}),
          __shop: normalizeShopData(data.shop),
          __timer: normalizeTimerData(data.timerData),
          __todos: Array.isArray(data.todos) ? data.todos : [],
          __calendarEvents: Array.isArray(data.calendarEvents) ? data.calendarEvents : [],
          __mistakeNotes: Array.isArray(data.mistakeNotes) ? data.mistakeNotes : [],
          __conversationPhrases: Array.isArray(data.conversationPhrases) ? data.conversationPhrases : [],
          __customQuizSets: Array.isArray(data.customQuizSets) ? data.customQuizSets : [],
          __todayWrongAnswers: Array.isArray(data.todayWrongAnswers) ? data.todayWrongAnswers.slice(-500) : [],
          __bubbleNotes: data.bubbleNotes && typeof data.bubbleNotes==='object' ? data.bubbleNotes : {}
        },
        custom_words: Array.isArray(data.customWords) ? data.customWords : [],
        updated_at: new Date().toISOString()
      };

      const { error } = await supabaseClient
        .from('haikyu_voca_data')
        .upsert(payload, { onConflict: 'user_name,lang,character' });

      if (error) {
        console.warn('Supabase shared-study save failed:', error);
        return false;
      }
      return true;
    }

    let userDataSaveQueue = Promise.resolve();
    function saveUserData() {
      // 저장 버튼을 누르거나 보상을 받을 때 UI를 기다리게 하지 않도록
      // localStorage는 즉시 저장하고 Supabase는 비동기로 동기화한다.
      const userName = state.user;
      const lang = state.lang;
      const character = SHARED_STUDY_CHARACTER;
      const userKey = getUserKey();
      const snapshot = normalizeUserData(JSON.parse(JSON.stringify(state.userData)));

      saveLocalBackup(userKey, snapshot);

      userDataSaveQueue = userDataSaveQueue
        .catch(()=>{})
        .then(()=>saveUserDataToCloud(userName, lang, character, snapshot))
        .catch(e => { console.warn('Background Supabase sync failed:', e); });
    }

    function recordAttendance() {
      const today = new Date().toISOString().split('T')[0];
      if (!state.userData.attendanceDates.includes(today)) {
        state.userData.attendanceDates.push(today);
        saveUserData();
      }
    }

    function getCombinedVocab() {
      const base = state.lang === 'ja' ? BUILTIN_JA : BUILTIN_EN;
      return [...base, ...state.userData.customWords];
    }

    function getDaysList() {
      const db = getCombinedVocab();
      const raw = Array.from(new Set(db.map(d => String(d.day)))).filter(Boolean);
      
      const numericDays = raw.filter(d => !isNaN(d)).sort((a, b) => Number(a) - Number(b));
      const strDays = raw.filter(d => isNaN(d)).sort((a, b) => a.localeCompare(b));
      
      return ['all', ...numericDays, ...strDays];
    }

    function getFilteredVocab() {
      const db = getCombinedVocab();
      if (state.selectedDay === 'all') return db;
      return db.filter(d => String(d.day) === String(state.selectedDay));
    }


    function getReviewWordIds() {
      const sData = state.userData.spacedRepData || {};
      const todayStr = new Date().toISOString().split('T')[0];
      return Object.keys(sData).filter(k =>
        !k.startsWith('__') &&
        sData[k] &&
        sData[k].nextDate &&
        sData[k].nextDate <= todayStr
      );
    }

    function getWrongDateForWord(id) {
      const rows = (state.userData.todayWrongAnswers || [])
        .filter(x => String(x?.id || '') === String(id) && x?.date)
        .sort((a,b) => String(b.date).localeCompare(String(a.date)));
      return rows[0]?.date || '';
    }

    function getSourceBaseVocab(source=state.testSource) {
      const db = getCombinedVocab();
      if (source === 'myvocab') {
        const ids = new Set(state.userData.myVocabIds || []);
        return db.filter(d => ids.has(d.id));
      }
      if (source === 'review') {
        const ids = new Set(getReviewWordIds());
        return db.filter(d => ids.has(d.id));
      }
      return db;
    }

    function getTestGroupOptions(source=state.testSource, mode=state.testGroupMode) {
      const base = getSourceBaseVocab(source);
      if (mode === 'date') {
        const vals = new Set();
        let hasUnknown = false;
        base.forEach(v => {
          const date = getWrongDateForWord(v.id);
          if (date) vals.add(date);
          else hasUnknown = true;
        });
        const dates = [...vals].sort((a,b) => b.localeCompare(a));
        return hasUnknown ? [...dates, '__unknown__'] : dates;
      }

      const vals = [...new Set(base.map(v => String(v.day ?? '')).filter(Boolean))];
      return vals.sort((a,b) => {
        const na=Number(a), nb=Number(b);
        if(!Number.isNaN(na) && !Number.isNaN(nb)) return na-nb;
        return a.localeCompare(b,'ko');
      });
    }

    function getTestVocab() {
      const db = getCombinedVocab();

      if (state.testSource === 'myvocab' || state.testSource === 'review') {
        let base = getSourceBaseVocab(state.testSource);
        const value = String(state.testGroupValue || 'all');
        if (value !== 'all') {
          if (state.testGroupMode === 'date') {
            if (value === '__unknown__') base = base.filter(v => !getWrongDateForWord(v.id));
            else base = base.filter(v => getWrongDateForWord(v.id) === value);
          } else {
            base = base.filter(v => String(v.day ?? '') === value);
          }
        }
        return base;
      }

      const selected = Array.isArray(state.selectedTestDays) ? state.selectedTestDays : [];
      if (selected.length === 0) return db; // 아무 DAY도 고르지 않으면 전체
      const daySet = new Set(selected.map(String));
      return db.filter(d => daySet.has(String(d.day)));
    }

    function getTestScopeKey() {
      if (state.testSource === 'myvocab' || state.testSource === 'review') {
        const base = state.testSource;
        const group = state.testGroupValue && state.testGroupValue !== 'all'
          ? `:${state.testGroupMode}:${state.testGroupValue}`
          : ':all';
        return `${base}${group}`;
      }
      const days = (state.selectedTestDays || []).map(String).sort((a,b) => {
        const na=Number(a), nb=Number(b);
        if(!isNaN(na) && !isNaN(nb)) return na-nb;
        return a.localeCompare(b);
      });
      return days.length ? `days:${days.join('+')}` : 'days:all';
    }

    function resetCurrentTest() {
      if (state.tab === 'quiz') generateQuiz();
      if (state.tab === 'hard') generateHardQuiz();
      if (state.tab === 'spell') generateSpellQuiz();
      render();
    }

    function setTestSource(source) {
      if (!['days','myvocab','review'].includes(source)) return;
      state.testSource = source;
      if (source !== 'days') {
        state.testGroupMode = state.testGroupMode || 'day';
        state.testGroupValue = 'all';
      }
      resetCurrentTest();
    }

    function setTestGroupMode(mode) {
      if (!['day','date'].includes(mode)) return;
      state.testGroupMode = mode;

    function getCharInfo() {
      const exp = state.userData.exp;
      let lvl = 1;
      for (let i = 0; i < EXP_THRESHOLDS.length; i++) {
        if (exp >= EXP_THRESHOLDS[i]) lvl = i + 1;
      }
      if (lvl > 10) lvl = 10;
      const nextThresh = lvl < 10 ? EXP_THRESHOLDS[lvl] : EXP_THRESHOLDS[9];
      const currThresh = EXP_THRESHOLDS[lvl - 1];
      const remExp = exp - currThresh;
      const reqExp = nextThresh - currThresh;
      const meta = getActiveCharacterMeta(state.char);

      return {
        level: lvl, exp: remExp, maxExp: reqExp, title: STAGE_TITLES[lvl - 1],
        ...meta
      };
    }

      state.userData.exp += expPts;
      state.userData.coins += coinPts;
      const newLvl = getCharInfo().level;
      if (newLvl > oldLvl) {
        alert(`🎉 파트너 승격! [Lv.${newLvl} ${STAGE_TITLES[newLvl - 1]}]`);
      }
      saveUserData();
      render();
    }

    function syncBgmSource(shouldPlay = false) {
      const track = getSelectedBgmTrack();
      const wasPlaying = isBgmPlaying || shouldPlay;

      bgmAudio.pause();
      bgmAudio.src = track.file;
      bgmAudio.loop = true;
      bgmAudio.volume = BGM_FIXED_VOLUME;
      bgmAudio.load();

      if (wasPlaying) {
        bgmAudio.play().then(() => {
          isBgmPlaying = true;
          render();
        }).catch(err => {
          isBgmPlaying = false;
          console.warn('BGM play failed:', err);
          alert(`BGM 파일을 재생할 수 없습니다.\n${track.file}\nGitHub의 bgm 폴더와 파일명을 확인해주세요.`);
          render();

      } else {
        isBgmPlaying = false;
      }
    }

    function selectBgm(trackId) {
      if (!getAllBgmTracks().some(t => t.id === trackId)) return;
      const shouldResume = isBgmPlaying;
      selectedBgmId = trackId;
      localStorage.setItem('haikyu_bgm_track', selectedBgmId);

    function changeBgmBy(step) {
      const all=getAllBgmTracks();
      const idx = Math.max(0, all.findIndex(t => t.id === selectedBgmId));
      const next = (idx + step + all.length) % all.length;
      selectBgm(all[next].id);
    }


    function toggleBgm() {
      if (isBgmPlaying) {
        bgmAudio.pause();

      const track = getSelectedBgmTrack();

      // 현재 Audio 객체가 다른 파일을 가리키고 있으면 선택 곡으로 교체
      const currentSrc = decodeURIComponent(bgmAudio.src || '');
      const wantedFile = track.file;
      if (!currentSrc.includes(wantedFile)) {
        bgmAudio.src = wantedFile;
        bgmAudio.loop = true;
        bgmAudio.volume = BGM_FIXED_VOLUME;
        bgmAudio.load();
      }

      bgmAudio.play().then(() => {

        alert(`BGM 파일을 재생할 수 없습니다.\n${track.file}\nGitHub의 bgm 폴더와 파일명을 확인해주세요.`);

    function pickBestVoice(langCode) {
      const target = langCode.toLowerCase();
      const candidates = availableVoices.filter(v => normalizeVoiceLang(v.lang).startsWith(target));
      if (candidates.length === 0) return null;

      const preferred = candidates.find(v => /Google|Natural|Neural|Enhanced|Premium|Online/i.test(v.name));
      return preferred || candidates[0];
    }

    async function speakWithBrowserTTS(text, langCode) {
      if (!('speechSynthesis' in window)) return false;
      await ensureVoicesLoaded();

      const voice = pickBestVoice(langCode);
      if (!voice && langCode === 'ja-JP') {
        console.warn('Japanese TTS voice is not installed/available in this browser.');
      }

      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = langCode;
      if (voice) u.voice = voice;
      u.rate = langCode === 'ja-JP' ? 0.9 : 0.92;
      u.pitch = 1.0;
      window.speechSynthesis.speak(u);
      return true;
    }

    function stopPronunciation() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      pronunciationAudio.pause();
      pronunciationAudio.onerror = null;
      pronunciationAudio.onended = null;
      pronunciationAudio.currentTime = 0;
    }

    // URL 음원이 실패하면 다음 URL을 시도하고, 모두 실패하면 브라우저 TTS로 넘어간다.
    async function playAudioCandidates(urls, fallbackFn) {
      stopPronunciation();
      let idx = 0;

      const tryNext = async () => {
        if (idx >= urls.length) {
          pronunciationAudio.onerror = null;
          await fallbackFn();
          return;
        }

        const url = urls[idx++];
        pronunciationAudio.src = url;
        pronunciationAudio.load();
        pronunciationAudio.onerror = () => {
          console.warn('Pronunciation source failed:', url);
          tryNext();
        };

        try {
          await pronunciationAudio.play();
        } catch (err) {
          console.warn('Pronunciation play() failed:', url, err);
          await tryNext();
        }
      };

      await tryNext();
    }

    async function playTTS(word, accent) {
      const clean = String(word || '')
        .split('(')[0]
        .replace(/[^a-zA-Z0-9\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF\s'-]/g, '')
        .trim();
      if (!clean) return;

      // 일본어: RStudio Viewer처럼 일본어 시스템 voice가 없는 환경에서도 들리도록
      // 네트워크 일본어 음원을 먼저 재생하고, 실패할 때만 ja-JP 브라우저 TTS를 사용한다.
      // CSV의 요미가나(speech_word)가 전달되므로 한자 오독도 줄어든다.
      if (state.lang === 'ja') {
        const encoded = encodeURIComponent(clean);
        const jaUrls = [
          `https://translate.google.com/translate_tts?ie=UTF-8&client=gtx&tl=ja&q=${encoded}`,
          `https://translate.google.com/translate_tts?ie=UTF-8&client=webapp&tl=ja&q=${encoded}`
        ];
        await playAudioCandidates(jaUrls, () => speakWithBrowserTTS(clean, 'ja-JP'));
        return;
      }

      // 영어: app.R에서 사용하던 실제 US / UK 발음 음원을 사용한다.
      // 호주식은 요청대로 완전히 제거.
      const encodedWord = encodeURIComponent(clean.toLowerCase());
      let audioUrl;
      let fallbackLang;

      if (accent === 'UK') {
        audioUrl = `https://dict.youdao.com/dictvoice?audio=${encodedWord}&type=1`;
        fallbackLang = 'en-GB';
      } else {
        audioUrl = `https://dict.youdao.com/dictvoice?audio=${encodedWord}&type=2`;
        fallbackLang = 'en-US';
      }

      await playAudioCandidates([audioUrl], () => speakWithBrowserTTS(clean, fallbackLang));
    }


    function safeTTSParam(value){
      return encodeURIComponent(String(value||'')).replace(/'/g,'%27');
    }

    function playEncodedTTS(encoded,accent){
      try{
        playTTS(decodeURIComponent(encoded),accent);
      }catch(e){
        console.warn('TTS decode/play failed:',e);
      }
    }

    function getPracticeVocab(){
      const base=getFilteredVocab();
      const ids=Array.isArray(state.practiceShuffleIds)?state.practiceShuffleIds:[];
      if(!ids.length)return base;
      const map=new Map(base.map(x=>[String(x.id),x]));
      const ordered=ids.map(id=>map.get(String(id))).filter(Boolean);
      const used=new Set(ordered.map(x=>String(x.id)));
      base.forEach(x=>{if(!used.has(String(x.id)))ordered.push(x)});
      return ordered;
    }

    function generateQuiz() {
      const db = getTestVocab();
      if (db.length < 4) {
        state.quizQuestions = [];
        return;
      }
      const shuf = [...db].sort(() => 0.5 - Math.random());
      state.quizQuestions = shuf.map(item => {
        const others = db.filter(d => d.id !== item.id).sort(() => 0.5 - Math.random()).slice(0, 3);
        const opts = [item.meaning, ...others.map(o => o.meaning)].sort(() => 0.5 - Math.random());
        return { id: item.id, word: item.word, cAns: item.meaning, opts };
      });
      state.quizIdx = 0;
      state.quizAnswered = false;
      state.quizSelectedOpt = null;
      state.quizScore = { correct: 0, total: state.quizQuestions.length, wrongIds: [], finished: false };
      state.lastTicketGain = 0;
      state.mood = 'normal';

      const shuf = [...db].sort(() => 0.5 - Math.random());
      state.hardQuestions = shuf.map(item => ({ id: item.id, word: item.word, meaning: item.meaning }));
      state.hardIdx = 0;

    function generateSpellQuiz() {
      if (state.lang === 'ja') return;
      const db = getTestVocab();
      if (db.length === 0) {
        state.spellQuestions = [];
        return;
      }
      const shuf = [...db].sort(() => 0.5 - Math.random());
      state.spellQuestions = shuf.map(item => {
        const chars = item.raw_word.split('');
        const maskCount = Math.max(1, Math.round(chars.length * 0.4));
        const maskIndices = [];
        while (maskIndices.length < maskCount) {
          const r = Math.floor(Math.random() * chars.length);
          if (!maskIndices.includes(r)) maskIndices.push(r);
        }
        const masked = chars.map((c, i) => maskIndices.includes(i) ? '_' : c).join(' ');
        return { id: item.id, word: item.raw_word, meaning: item.meaning, maskedWord: masked };
      });
      state.spellIdx = 0;
      state.spellAnswered = false;
      state.spellIsCorrect = false;
      state.spellScore = { correct: 0, total: state.spellQuestions.length, wrongIds: [], finished: false };
      state.lastTicketGain = 0;
      state.mood = 'normal';
    }

    function escHtml(value){
      return String(value??'').replace(/[&<>"']/g,ch=>({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[ch]));
    }

    function getUserBubbleText(){
      const notes=state.userData?.bubbleNotes||{};
      return String(notes[state.char]||'').trim();
    }

    function renderUserCharacterBubble(){
      const text=getUserBubbleText();
      return `<div class="user-char-bubble">
        <span>${text ? escHtml(text) : '여기에 내가 원하는 말을 적을 수 있어요.'}</span>
        <button class="user-char-bubble-edit" title="말풍선 수정" onclick="editUserCharacterBubble()">✎</button>
      </div>`;
    }

    function editUserCharacterBubble(){
      const current=getUserBubbleText();
      const value=prompt(`${getCharInfo().name} 말풍선에 표시할 문장을 입력해주세요.\n비워두면 기본 안내 문구로 돌아가요.`,current);
      if(value===null)return;
      state.userData.bubbleNotes=state.userData.bubbleNotes&&typeof state.userData.bubbleNotes==='object'?state.userData.bubbleNotes:{};
      const trimmed=value.trim();
      if(trimmed)state.userData.bubbleNotes[state.char]=trimmed.slice(0,120);
      else delete state.userData.bubbleNotes[state.char];
      saveUserData();
      render();
    }

    function normalizeTodos(){
      state.userData.todos=Array.isArray(state.userData.todos)?state.userData.todos:[];
      state.userData.todos.forEach(item=>{
        if(item && typeof item==='object' && typeof item.dueDate!=='string') item.dueDate='';
      });
      return state.userData.todos;
    }



    function addTodo(){
      const input=document.getElementById('todo-new-input');
      const value=String(input?.value||'').trim();
      if(!value)return;
      const todos=normalizeTodos();
      const dueDate=String(document.getElementById('todo-new-date')?.value||'').trim();
      todos.unshift({
        id:`todo_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,
        text:value.slice(0,160),
        done:false,
        dueDate,
        createdAt:new Date().toISOString()
      });
      saveUserData();
      render();
    }

    function toggleTodo(id){
      const item=normalizeTodos().find(x=>x.id===id);
      if(!item)return;
      item.done=!item.done;
      item.doneAt=item.done?new Date().toISOString():null;
      saveUserData();
      render();
    }




    function deleteTodo(id){
      state.userData.todos=normalizeTodos().filter(x=>x.id!==id);
      saveUserData();
      render();
    }

    function clearCompletedTodos(){
      const done=normalizeTodos().filter(x=>x.done).length;
      if(!done)return;
      state.userData.todos=normalizeTodos().filter(x=>!x.done);
      saveUserData();
      render();
    }

    function renderTodoList(){
      const todos=normalizeTodos();
      const remaining=todos.filter(x=>!x.done).length;
      const done=todos.length-remaining;
      return `<div class="todo-wrap">
        <div>
          <h3 style="margin:0 0 4px;font-weight:900;">✅ To Do List</h3>
          <div style="font-size:11px;color:#64748B;font-weight:700;">같은 사용자 안에서는 캐릭터를 바꿔도 할 일이 이어져요. 날짜를 지정하면 캘린더에도 함께 표시돼요.</div>
        </div>

        <div class="todo-summary">
          <span>남은 할 일 ${remaining}개</span>
          <span>완료 ${done}개</span>
        </div>

        <div class="todo-add-box" style="display:grid;grid-template-columns:minmax(220px,1fr) 170px 86px;gap:7px;align-items:center;">
          <input id="todo-new-input" class="std-input" maxlength="160" placeholder="할 일을 입력해주세요"
            onkeydown="if(event.key==='Enter'){event.preventDefault();addTodo()}">
          <input id="todo-new-date" class="std-input" type="date" title="날짜 지정 (선택)">

        <div style="font-size:9.5px;color:#94A3B8;font-weight:700;margin-top:-5px;">할 일을 만들 때 날짜를 지정하면 그 날짜의 캘린더에도 자동으로 표시돼요. 날짜는 선택 사항이에요.</div>

        <div class="todo-list">
          ${todos.length?todos.map(item=>`
            <div class="todo-item ${item.done?'done':''}">
