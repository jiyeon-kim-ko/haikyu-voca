<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer" />
  <title>하이큐 영어 일본어 단어 퀴즈</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" />
  <!-- CSV 파싱 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: 'Pretendard', sans-serif;
      background-color: #1E293B;
      color: #1E293B;
    }
    .bg-cover-wrapper {
      min-height: 100vh; width: 100%;
      background-image: url('gym.png');
      background-size: cover; background-position: center; background-repeat: no-repeat;
      background-color: #0F172A;
      display: flex; align-items: center; justify-content: center;
      padding: 20px 10px;
    }

    .login-card-gym {
      max-width: 480px; width: 100%; background: #FFFFFF;
      padding: 35px 30px; border-radius: 20px; border: 3.5px solid #1E293B;
      box-shadow: 8px 8px 0px rgba(0,0,0,0.6); text-align: center;
    }
    .lang-choice-card {
      border: 3px solid #1E293B; border-radius: 16px; padding: 20px; margin: 12px 0;
      cursor: pointer; background: #FFFFFF; transition: all 0.2s ease; display: flex;
      align-items: center; justify-content: space-between; font-weight: 900; font-size: 17px;
      box-shadow: 4px 4px 0px #1E293B;
    }
    .lang-choice-card:hover {
      background: #FFF7ED; border-color: #EA580C; transform: translateY(-3px);
      box-shadow: 6px 6px 0px #EA580C; color: #EA580C;
    }
    .char-select-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-bottom: 20px; }
    .char-radio-card {
      border: 2px solid #D4D4D8; border-radius: 12px; padding: 10px 4px 8px 4px; cursor: pointer;
      background: #FFFFFF; transition: all 0.15s ease; text-align: center;
    }
    .char-radio-card:hover { border-color: #1E293B; transform: translateY(-2px); }
    .char-radio-card.active { border-color: #EA580C; background: #FFF7ED; box-shadow: 2px 2px 0px #EA580C; }
    .mini-avatar-circle {
      width: 46px; height: 46px; border-radius: 50%; border: 2px solid #1E293B;
      background: #FDE047; margin: 0 auto 4px auto; overflow: hidden; display: flex;
      align-items: center; justify-content: center;
    }
    .mini-avatar-circle svg, .mini-avatar-circle img {
      width: 100%; height: 100%; object-fit: cover;
    }

    .minihompy-window {
      width: 1180px; max-width: 98vw;
      background: #FFFFFF; border-radius: 20px;
      border: 3.5px solid #1E293B;
      box-shadow: 0 20px 45px rgba(0,0,0,0.55);
      display: flex; flex-direction: column;
    }
    .window-top-bar {
      background: #1E293B; color: #FFFFFF;
      padding: 12px 22px; display: flex; justify-content: space-between; align-items: center;
      font-weight: 800; font-size: 14.5px;
    }
    .window-url-bar {
      background: #F1F5F9; border-bottom: 2px solid #CBD5E1;
      padding: 8px 20px; font-family: monospace; font-size: 13px; color: #475569;
    }
    .minihompy-body {
      padding: 16px 18px; background: #F8FAFC;
      display: flex; gap: 12px; min-height: 640px; align-items: stretch;
    }
    .hompy-left-side {
      width: 270px; flex-shrink: 0; background: #FFFFFF;
      border: 2px solid #CBD5E1; border-radius: 16px;
      padding: 14px 12px; display: flex; flex-direction: column; gap: 9px;
    }
    .bgm-widget-box {
      background: #F1F5F9; border: 1.5px solid #CBD5E1; border-radius: 10px;
      padding: 6px 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .bgm-title { font-size: 11px; font-weight: 800; color: #1E293B; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 145px; }
    .stat-counter-bar {
      display: flex; justify-content: space-around; font-size: 11.5px; font-weight: 800;
      padding-bottom: 6px; border-bottom: 1.5px dashed #CBD5E1;
    }
    .mini-room-box {
      background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: 12px;
      padding: 10px 4px; text-align: center; position: relative;
    }
    .large-mii-frame {
      width: 115px; height: 115px; border-radius: 50%;
      border: 3px solid #1E293B; background: #FDE047;
      margin: 0 auto; overflow: hidden; display: flex; align-items: center; justify-content: center;
      box-shadow: 2px 2px 0px rgba(0,0,0,0.15);
    }
    .large-mii-frame svg, .large-mii-frame img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .left-emotion-badge {
      position: absolute; top: 18px; right: 40px;
      width: 32px; height: 32px; background: #FFFFFF; border: 2px solid #1E293B;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 16px; box-shadow: 1px 1px 0px #1E293B;
    }
    .char-spec-box {
      background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: 10px;
      padding: 8px 10px; font-size: 11.5px; text-align: left; line-height: 1.4;
    }
    .streak-week-box {
      display: flex; justify-content: space-between; background: #F8FAFC;
      border: 1.5px solid #E2E8F0; border-radius: 10px; padding: 6px 8px;
    }
    .streak-day-item { text-align: center; }
    .streak-day-name { font-size: 10px; color: #64748B; font-weight: 800; }
    .streak-day-icon { font-size: 12px; margin-top: 2px; min-height: 16px; display:flex; align-items:center; justify-content:center; }
    .streak-today-tag { font-size: 9px; color: #EA580C; font-weight: 900; }
    .stamina-progress-bg {
      width: 100%; height: 8px; background: #E2E8F0; border-radius: 6px;
      overflow: hidden; margin-top: 4px; border: 1px solid #CBD5E1;
    }
    .stamina-progress-fill { height: 100%; background: #EA580C; transition: width 0.3s ease; }
    
    .hompy-nav-tabs {
      width: 78px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;
    }
    .btn-tab-menu {
      width: 100%; padding: 12px 4px; background: #1E293B; color: #FFFFFF;
      border: 2px solid #1E293B; border-radius: 10px; font-size: 12.5px; font-weight: 800;
      cursor: pointer; text-align: center; transition: all 0.15s ease;
    }
    .btn-tab-menu:hover, .btn-tab-menu.active {
      background: #EA580C !important; border-color: #EA580C !important; color: #FFFFFF !important;
    }
    .hompy-main-content {
      flex-grow: 1; background: #FFFFFF; border: 2px solid #CBD5E1;
      border-radius: 16px; padding: 20px 22px; display: flex; flex-direction: column;
      min-width: 0; overflow: hidden;
    }
    .main-speech-bubble {
      background: #F8FAFC; border: 2px solid #1E293B; border-radius: 12px;
      padding: 12px 18px; font-weight: 800; font-size: 14px; color: #1E293B;
      margin-bottom: 16px; box-shadow: 2px 2px 0px #1E293B;
    }
    .flashcard-box {
      background: #F8FAFC; border: 2.5px solid #1E293B; border-radius: 16px;
      min-height: 250px; display: flex; flex-direction: column; justify-content: center;
      align-items: center; padding: 25px; text-align: center; box-shadow: 3px 3px 0px #1E293B; cursor: pointer;
    }
    .option-btn {
      width: 100%; text-align: left; margin-bottom: 10px;
      padding: 12px 16px; border-radius: 10px; font-weight: 700;
      border: 2px solid #CBD5E1; background: #FFFFFF; font-size: 14.5px; cursor: pointer;
    }
    .option-btn:hover { background: #F1F5F9; border-color: #1E293B; }
    .btn-correct { background-color: #1E293B !important; color: #FFFFFF !important; }
    .btn-wrong { background-color: #FEE2E2 !important; color: #DC2626 !important; }
    .btn-pixel-black {
      background: #1E293B; border: 2px solid #1E293B; color: #FFFFFF;
      font-weight: 800; border-radius: 8px; padding: 8px 16px; cursor: pointer;
    }
    .btn-pixel-black:hover { background: #EA580C; border-color: #EA580C; }
    .btn-pixel-white {
      background: #FFFFFF; border: 2px solid #1E293B; color: #1E293B;
      font-weight: 800; border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer;
    }
    .btn-pixel-white:hover { background: #F1F5F9; }
    .word-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #E2E8F0; }
    .history-table { width: 100%; border-collapse: collapse; }
    .history-table th { background: #F1F5F9; padding: 8px; font-size: 12.5px; border-bottom: 2px solid #CBD5E1; text-align: center; }
    .history-table td { padding: 10px 8px; border-bottom: 1px solid #E2E8F0; font-size: 13px; text-align: center; }
    .custom-input-row { display: flex; gap: 8px; align-items: center; width: 100%; margin-bottom: 12px; }
    .custom-input-row input, .std-input {
      border: 2px solid #CBD5E1; border-radius: 8px; padding: 8px 10px; font-size: 13.5px; height: 38px; width: 100%;
    }

    .accent-btn-group {
      display: inline-flex; gap: 4px; background: #E2E8F0; padding: 3px; border-radius: 8px;
    }
    .accent-btn {
      border: none; background: transparent; padding: 4px 8px; font-size: 11.5px;
      font-weight: 800; border-radius: 6px; cursor: pointer; color: #475569;
    }
    .accent-btn.active {
      background: #1E293B; color: #FFFFFF;
    }

    @media (max-width: 768px) {
      .bg-cover-wrapper { padding: 8px 4px; }
      .minihompy-window { width: 100%; border-radius: 12px; border-width: 2.5px; }
      .window-top-bar { padding: 8px 12px; font-size: 12px; }
      .window-url-bar { display: none; }
      .minihompy-body { flex-direction: column; padding: 10px; gap: 10px; min-height: auto; }
      .hompy-left-side { width: 100%; padding: 10px; }
      .mini-room-box { display: flex; align-items: center; gap: 12px; text-align: left; padding: 8px; }
      .large-mii-frame { width: 70px; height: 70px; margin: 0; flex-shrink: 0; }
      .left-emotion-badge { top: 2px; right: 2px; width: 24px; height: 24px; font-size: 13px; }
      .hompy-nav-tabs { width: 100%; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 2px; }
      .btn-tab-menu { flex: 1 0 auto; min-width: 60px; padding: 8px 6px; font-size: 11.5px; }
      .hompy-main-content { padding: 14px 12px; }
      .main-speech-bubble { font-size: 12.5px; padding: 8px 12px; margin-bottom: 12px; }
      .flashcard-box { min-height: 190px; padding: 15px; }
      .custom-input-row { flex-direction: column; align-items: stretch; gap: 6px; }
      .custom-input-row input { width: 100% !important; }
      .char-select-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    }
  </style>
</head>
<body>
  <div id="app" class="bg-cover-wrapper"></div>

  <script>
    const CHAR_AVATARS = {
      kageyama: `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="50" fill="#1E293B"/><path d="M25 45 C25 20 75 20 75 45 C75 35 65 25 50 25 C35 25 25 35 25 45 Z" fill="#0F172A"/><circle cx="50" cy="55" r="28" fill="#FDDFB7"/><path d="M22 42 C30 20 70 20 78 42 C70 38 60 35 50 38 C40 35 30 38 22 42 Z" fill="#020617"/><ellipse cx="38" cy="52" rx="4" ry="5" fill="#1E293B"/><ellipse cx="62" cy="52" rx="4" ry="5" fill="#1E293B"/><circle cx="39" cy="50" r="1.5" fill="#FFF"/><circle cx="63" cy="50" r="1.5" fill="#FFF"/><path d="M34 45 L44 48" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/><path d="M66 45 L56 48" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/><path d="M44 68 Q50 64 56 68" stroke="#0F172A" stroke-width="2" fill="none"/><path d="M30 82 L70 82 L65 100 L35 100 Z" fill="#EA580C"/></svg>`,
      oikawa: `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="50" fill="#0D9488"/><circle cx="50" cy="55" r="28" fill="#FDDFB7"/><path d="M20 45 C25 15 75 15 80 45 C72 32 62 28 50 32 C38 28 28 32 20 45 Z" fill="#78350F"/><ellipse cx="38" cy="52" rx="4" ry="5" fill="#451A03"/><ellipse cx="62" cy="52" rx="4" ry="5" fill="#451A03"/><circle cx="39" cy="50" r="1.5" fill="#FFF"/><circle cx="63" cy="50" r="1.5" fill="#FFF"/><path d="M34 46 Q40 43 44 46" stroke="#78350F" stroke-width="2" fill="none"/><path d="M66 46 Q60 43 56 46" stroke="#78350F" stroke-width="2" fill="none"/><path d="M42 66 Q50 72 58 66" stroke="#451A03" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M30 82 L70 82 L65 100 L35 100 Z" fill="#14B8A6"/></svg>`,
      miya: `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="50" fill="#CA8A04"/><circle cx="50" cy="55" r="28" fill="#FDDFB7"/><path d="M22 45 C25 18 75 18 78 45 C65 30 55 32 50 30 C45 32 35 30 22 45 Z" fill="#EAB308"/><path d="M45 25 L75 35 L65 45 Z" fill="#CA8A04"/><ellipse cx="38" cy="52" rx="4" ry="5" fill="#1E293B"/><ellipse cx="62" cy="52" rx="4" ry="5" fill="#1E293B"/><circle cx="39" cy="50" r="1.5" fill="#FFF"/><circle cx="63" cy="50" r="1.5" fill="#FFF"/><path d="M34 46 L44 45" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/><path d="M66 46 L56 45" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/><path d="M44 66 Q50 70 56 66" stroke="#1E293B" stroke-width="2" fill="none"/><path d="M30 82 L70 82 L65 100 L35 100 Z" fill="#18181B"/></svg>`,
      osamu: `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="50" fill="#475569"/><circle cx="50" cy="55" r="28" fill="#FDDFB7"/><path d="M22 45 C25 18 75 18 78 45 C65 30 55 32 50 30 C45 32 35 30 22 45 Z" fill="#64748B"/><ellipse cx="38" cy="52" rx="4" ry="5" fill="#1E293B"/><ellipse cx="62" cy="52" rx="4" ry="5" fill="#1E293B"/><circle cx="39" cy="50" r="1.5" fill="#FFF"/><circle cx="63" cy="50" r="1.5" fill="#FFF"/><path d="M34 47 L44 47" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/><path d="M66 47 L56 47" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/><path d="M45 67 L55 67" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/><path d="M30 82 L70 82 L65 100 L35 100 Z" fill="#18181B"/></svg>`
    };

    const CHAR_META = {
      kageyama: {
        name: "카게야마 토비오", imgFile: "kageyama.jpg",
        num: "9", school: "카라스노 고교", pos: "Setter (세터)", food: "군군 우유", act: "토스 훈련", motto: "볼은 반드시 내가 올린다."
      },
      oikawa: {
        name: "오이카와 토오루", imgFile: "oikawa.jpg",
        num: "1", school: "아오바죠사이", pos: "Setter (주장)", food: "우유빵", act: "살인 서브", motto: "재능은 꽃피우는 것, 센스는 갈고닦는 것!"
      },
      miya: {
        name: "츠무", imgFile: "miya.jpg",
        num: "7", school: "이나리자키", pos: "Setter (세터)", food: "참치 뱃살", act: "2도류 서브", motto: "내 토스 칠 자격 있나? 증명해봐라."
      },
      osamu: {
        name: "사무", imgFile: "osamu.jpg",
        num: "11", school: "이나리자키", pos: "Wing Spiker (WS)", food: "오니기리", act: "스파이크", motto: "밥심으로 단어 끝까지 씹어묵자."
      },
      kenma: {
        name: "켄마", imgFile: "kenma.png",
        num: "5", school: "네코마 고교", pos: "Setter (세터)", food: "애플파이", act: "두뇌 토스", motto: "게임처럼 하나씩 공략하면 돼."
      },
      kita: {
        name: "키타", imgFile: "kita.png",
        num: "1", school: "이나리자키", pos: "Wing Spiker (주장)", food: "두부", act: "기본기 훈련", motto: "매일 제대로 하는 게 결국 전부다."
      },
      goshiki: {
        name: "고시키 ", imgFile: "goshiki.png",
        num: "8", school: "시라토리자와", pos: "Wing Spiker (WS)", food: "밥", act: "직선 스파이크", motto: "에이스가 될 거니까 이 정도는 당연하지!"
      }
    };

    function renderCharacterAvatar(charKey) {
      const meta = CHAR_META[charKey];

      const fallbackAvatar = CHAR_AVATARS[charKey] || `
        <svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="50" fill="#E2E8F0"/>
          <circle cx="50" cy="43" r="22" fill="#FDDFB7"/>
          <path d="M25 42 C28 18 72 18 75 42 C67 31 58 27 50 29 C42 27 33 31 25 42 Z" fill="#475569"/>
          <ellipse cx="42" cy="44" rx="2.5" ry="3.5" fill="#1E293B"/>
          <ellipse cx="58" cy="44" rx="2.5" ry="3.5" fill="#1E293B"/>
          <path d="M43 55 Q50 59 57 55" stroke="#1E293B" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M22 100 C24 73 76 73 78 100 Z" fill="#64748B"/>
        </svg>
      `;

      return `
        <img src="${meta.imgFile}" alt="${meta.name}" 
             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
        <div style="display:none; width:100%; height:100%;">${fallbackAvatar}</div>
      `;
    }

    // 미카사 V200W 느낌의 노랑 + 파랑 배구공 아이콘
    // 외부 이미지 파일 없이 SVG로 그려지므로 기기/브라우저마다 이모지가 다르게 보이는 문제가 없습니다.
    function renderMikasaBall(size = 28, extraStyle = '') {
      return `
        <svg
          width="${size}" height="${size}"
          viewBox="0 0 100 100"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="노랑 파랑 배구공"
          role="img"
          style="display:inline-block; vertical-align:-0.18em; flex-shrink:0; ${extraStyle}"
        >
          <defs>
            <radialGradient id="ballLight" cx="34%" cy="27%" r="76%">
              <stop offset="0%" stop-color="#FFF9A8"/>
              <stop offset="58%" stop-color="#FFD928"/>
              <stop offset="100%" stop-color="#F2B900"/>
            </radialGradient>
            <clipPath id="ballClip">
              <circle cx="50" cy="50" r="46"/>
            </clipPath>
          </defs>

          <!-- 기본 공 -->
          <circle cx="50" cy="50" r="47" fill="url(#ballLight)" stroke="#172033" stroke-width="3"/>

          <g clip-path="url(#ballClip)">
            <!-- 파란 패널 1 -->
            <path
              d="M-4 30
                 C15 5, 39 2, 55 12
                 C45 27, 38 40, 36 54
                 C21 49, 8 42, -4 30 Z"
              fill="#1558B0"
            />

            <!-- 파란 패널 2 -->
            <path
              d="M55 12
                 C77 15, 97 31, 106 50
                 C88 52, 72 58, 60 69
                 C50 57, 41 52, 36 54
                 C38 39, 45 26, 55 12 Z"
              fill="#1B63BD"
            />

            <!-- 파란 패널 3 -->
            <path
              d="M60 69
                 C73 58, 88 52, 106 50
                 C105 73, 90 94, 68 104
                 C63 90, 60 79, 60 69 Z"
              fill="#0E4E9E"
            />

            <!-- 노란 패널 경계 곡선 -->
            <path d="M-2 29 C18 42, 27 48, 36 54"
                  fill="none" stroke="#172033" stroke-width="2.2"/>
            <path d="M55 11 C45 27, 38 40, 36 54"
                  fill="none" stroke="#172033" stroke-width="2.2"/>
            <path d="M36 54 C45 54, 53 60, 60 69"
                  fill="none" stroke="#172033" stroke-width="2.2"/>
            <path d="M60 69 C60 82, 63 93, 68 104"
                  fill="none" stroke="#172033" stroke-width="2.2"/>
            <path d="M60 69 C74 57, 88 52, 106 50"
                  fill="none" stroke="#172033" stroke-width="2.2"/>

            <!-- 밝은 반사광 -->
            <ellipse cx="31" cy="23" rx="13" ry="7" fill="rgba(255,255,255,0.38)" transform="rotate(-28 31 23)"/>
          </g>

          <circle cx="50" cy="50" r="47" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.2"/>
        </svg>
      `;
    }

    function renderSpeechWithBall(text) {
      return String(text).replace(/🏐/g, renderMikasaBall(16));
    }

    const EXP_THRESHOLDS = [0, 100, 250, 450, 700, 1000, 1400, 1850, 2350, 3000];
    const STAGE_TITLES = ["주니어 유소년", "고교 주전 선수", "인터하이 예선", "합숙 원정훈련", "도 대표 결정전", "봄철 전국대회", "유스 강화합숙", "전국대회 8강", "V리그 프로리그", "올림픽 국가대표"];

    let BUILTIN_EN = [];
    let BUILTIN_JA = [];

    // CSV 파일을 UTF-8 / CP949(EUC-KR) 모두 안전하게 읽는다.
    // WORD3 같은 파일이 CP949로 저장되어 있어도 품사/Day 글자가 깨지지 않게 하기 위함.
    async function fetchCSVText(fileName) {
      const res = await fetch(fileName);
      if (!res.ok) throw new Error(`${fileName} HTTP ${res.status}`);

      const bytes = await res.arrayBuffer();
      let text = '';

      // 1순위: 정상 UTF-8
      try {
        text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      } catch (utf8Error) {
        // 2순위: Windows 한글 CSV에서 흔한 CP949/EUC-KR
        try {
          text = new TextDecoder('euc-kr').decode(bytes);
          console.info(`${fileName}: CP949/EUC-KR 인코딩으로 읽었습니다.`);
        } catch (krError) {
          // 최후 백업
          text = new TextDecoder('utf-8').decode(bytes);
        }
      }

      // UTF-8 BOM 제거
      return text.replace(/^\uFEFF/, '');
    }

    // CSV 파일 자동 로드 및 파싱 함수
    async function loadAllCSVData() {
      BUILTIN_EN = [];
      BUILTIN_JA = [];

      // 1. 영어 CSV 로드
      const enFiles = ['toeic_vocab.csv', 'WORD2.csv', 'WORD3.csv'];
      for (const fn of enFiles) {
        try {
          const text = await fetchCSVText(fn);
          const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
          parsed.data.forEach((row, i) => {
            const w = String(row['word'] || row[' 단어'] || row['단어'] || '').trim();
            const m = String(row['meaning'] || row[' 뜻'] || row['의미'] || '').trim();
            const d = String(row['day'] || row['Day'] || '1').trim();
            if (w && m) {
              BUILTIN_EN.push({
                id: `${fn}_${i}`,
                day: d,
                word: w,
                raw_word: w,
                meaning: m
              });
            }
          });
        } catch (e) {
          console.warn(`Error loading ${fn}:`, e);
        }
      }

      // 2. 일본어 CSV 로드
      const jaFiles = ['japanese_vocabulary.csv', 'japanese_vocabulary2.csv'];
      for (const fn of jaFiles) {
        try {
          const text = await fetchCSVText(fn);
          const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
          parsed.data.forEach((row, i) => {
            const cat = String(row['품사'] || row['분류'] || '명사').trim();
            const kanji = String(row['표기'] || '').trim();
            const yomi = String(row['요미가나'] || '').trim();
            const mean = String(row['한국어 뜻'] || row['뜻'] || '').trim();
            if (kanji && mean) {
              const disp = (yomi && yomi !== kanji) ? `${kanji} (${yomi})` : kanji;
              BUILTIN_JA.push({
                id: `${fn}_${i}`,
                day: cat,
                word: disp,
                raw_word: kanji,
                // 발음은 한자보다 요미가나를 우선 사용
                speech_word: yomi || kanji,
                meaning: mean
              });
            }
          });
        } catch (e) {
          console.warn(`Error loading ${fn}:`, e);
        }
      }
    }

    bgmAudio.loop = true;

    }

    async function ensureVoicesLoaded() {
      if (!('speechSynthesis' in window)) return [];
      loadVoices();
      if (availableVoices.length > 0) return availableVoices;

      await new Promise(resolve => {
        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          loadVoices();
          resolve();
        };
        window.speechSynthesis.addEventListener('voiceschanged', finish, { once: true });
        setTimeout(finish, 800);
      });
      return availableVoices;
    }

      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();

    function recordAttendance() {

    function getCombinedVocab() {
      const base = state.lang === 'ja' ? BUILTIN_JA : BUILTIN_EN;
      return [...base, ...state.userData.customWords];
    }

    function getDaysList() {
      const db = getCombinedVocab();
      const raw = Array.from(new Set(db.map(d => String(d.day)))).filter(Boolean);
      
      const numericDays = raw.filter(d => !isNaN(d)).sort((a, b) => Number(a) - Number(b));
      const strDays = raw.filter(d => isNaN(d)).sort((a, b) => a.localeCompare(b));
      
      return ['all', ...numericDays, ...strDays];
    }

    function getFilteredVocab() {
      const db = getCombinedVocab();
      if (state.selectedDay === 'all') return db;
      return db.filter(d => String(d.day) === String(state.selectedDay));
    }

    function getCharInfo() {
      const exp = state.userData.exp;
      let lvl = 1;
      for (let i = 0; i < EXP_THRESHOLDS.length; i++) {
        if (exp >= EXP_THRESHOLDS[i]) lvl = i + 1;
      }
      if (lvl > 10) lvl = 10;
      const nextThresh = lvl < 10 ? EXP_THRESHOLDS[lvl] : EXP_THRESHOLDS[9];
      const currThresh = EXP_THRESHOLDS[lvl - 1];
      const remExp = exp - currThresh;
      const reqExp = nextThresh - currThresh;
      const meta = CHAR_META[state.char] || CHAR_META.kageyama;

      return {
        level: lvl, exp: remExp, maxExp: reqExp, title: STAGE_TITLES[lvl - 1],
        ...meta
      };
    }

    function addRewards(expPts, coinPts) {
      const oldLvl = getCharInfo().level;
      state.userData.exp += expPts;
      state.userData.coins += coinPts;
      const newLvl = getCharInfo().level;
      if (newLvl > oldLvl) {
        alert(`🎉 파트너 승격! [Lv.${newLvl} ${STAGE_TITLES[newLvl - 1]}]`);
      }
      saveUserData();
      render();
    }

    function toggleBgm() {
      if (isBgmPlaying) {
        bgmAudio.pause();
        isBgmPlaying = false;
      } else {
        bgmAudio.play().then(() => {

    }

    function normalizeVoiceLang(lang) {
      return String(lang || '').replace('_', '-').toLowerCase();
    }

    function pickBestVoice(langCode) {
      const target = langCode.toLowerCase();
      const candidates = availableVoices.filter(v => normalizeVoiceLang(v.lang).startsWith(target));
      if (candidates.length === 0) return null;

      const preferred = candidates.find(v => /Google|Natural|Neural|Enhanced|Premium|Online/i.test(v.name));
      return preferred || candidates[0];
    }

    async function speakWithBrowserTTS(text, langCode) {
      if (!('speechSynthesis' in window)) return false;
      await ensureVoicesLoaded();

      const voice = pickBestVoice(langCode);
      if (!voice && langCode === 'ja-JP') {
        console.warn('Japanese TTS voice is not installed/available in this browser.');
      }

      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = langCode;
      if (voice) u.voice = voice;
      u.rate = langCode === 'ja-JP' ? 0.9 : 0.92;
      u.pitch = 1.0;
      window.speechSynthesis.speak(u);
      return true;
    }

    function stopPronunciation() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      pronunciationAudio.pause();
      pronunciationAudio.onerror = null;
      pronunciationAudio.onended = null;
      pronunciationAudio.currentTime = 0;
    }

    // URL 음원이 실패하면 다음 URL을 시도하고, 모두 실패하면 브라우저 TTS로 넘어간다.
    async function playAudioCandidates(urls, fallbackFn) {
      stopPronunciation();
      let idx = 0;

      const tryNext = async () => {
        if (idx >= urls.length) {
          pronunciationAudio.onerror = null;
          await fallbackFn();
          return;
        }

        const url = urls[idx++];
        pronunciationAudio.src = url;
        pronunciationAudio.load();
        pronunciationAudio.onerror = () => {
          console.warn('Pronunciation source failed:', url);
          tryNext();
        };

        try {
          await pronunciationAudio.play();
        } catch (err) {
          console.warn('Pronunciation play() failed:', url, err);
          await tryNext();
        }
      };

      await tryNext();
    }

    async function playTTS(word, accent) {
      const clean = String(word || '')
        .split('(')[0]
        .replace(/[^a-zA-Z0-9\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF\s'-]/g, '')
        .trim();
      if (!clean) return;

      // 일본어: RStudio Viewer처럼 일본어 시스템 voice가 없는 환경에서도 들리도록
      // 네트워크 일본어 음원을 먼저 재생하고, 실패할 때만 ja-JP 브라우저 TTS를 사용한다.
      // CSV의 요미가나(speech_word)가 전달되므로 한자 오독도 줄어든다.
      if (state.lang === 'ja') {
        const encoded = encodeURIComponent(clean);
        const jaUrls = [
          `https://translate.google.com/translate_tts?ie=UTF-8&client=gtx&tl=ja&q=${encoded}`,
          `https://translate.google.com/translate_tts?ie=UTF-8&client=webapp&tl=ja&q=${encoded}`
        ];
        await playAudioCandidates(jaUrls, () => speakWithBrowserTTS(clean, 'ja-JP'));
        return;
      }

      // 영어: app.R에서 사용하던 실제 US / UK 발음 음원을 사용한다.
      // 호주식은 요청대로 완전히 제거.
      const encodedWord = encodeURIComponent(clean.toLowerCase());
      let audioUrl;
      let fallbackLang;

      if (accent === 'UK') {
        audioUrl = `https://dict.youdao.com/dictvoice?audio=${encodedWord}&type=1`;
        fallbackLang = 'en-GB';
      } else {
        audioUrl = `https://dict.youdao.com/dictvoice?audio=${encodedWord}&type=2`;
        fallbackLang = 'en-US';
      }

      await playAudioCandidates([audioUrl], () => speakWithBrowserTTS(clean, fallbackLang));
    }

    function generateQuiz() {
      const db = getFilteredVocab();
      if (db.length < 4) {
        state.quizQuestions = [];
        return;
      }
      const shuf = [...db].sort(() => 0.5 - Math.random());
      state.quizQuestions = shuf.map(item => {
        const others = db.filter(d => d.id !== item.id).sort(() => 0.5 - Math.random()).slice(0, 3);
        const opts = [item.meaning, ...others.map(o => o.meaning)].sort(() => 0.5 - Math.random());
        return { id: item.id, word: item.word, cAns: item.meaning, opts };
      });
      state.quizIdx = 0;
      state.quizAnswered = false;
      state.quizSelectedOpt = null;
      state.quizScore = { correct: 0, total: state.quizQuestions.length, wrongIds: [], finished: false };
      state.mood = 'normal';
    }

    function generateHardQuiz() {
      const db = getFilteredVocab();
      if (db.length === 0) {
        state.hardQuestions = [];
        return;
      }
      const shuf = [...db].sort(() => 0.5 - Math.random());
      state.hardQuestions = shuf.map(item => ({ id: item.id, word: item.word, meaning: item.meaning }));
      state.hardIdx = 0;
      state.hardAnswered = false;
      state.hardIsCorrect = false;
      state.hardScore = { correct: 0, total: state.hardQuestions.length, wrongIds: [], finished: false };
      state.mood = 'normal';
    }

    function generateSpellQuiz() {
      if (state.lang === 'ja') return;
      const db = getFilteredVocab();
      if (db.length === 0) {
        state.spellQuestions = [];
        return;
      }
      const shuf = [...db].sort(() => 0.5 - Math.random());
      state.spellQuestions = shuf.map(item => {
        const chars = item.raw_word.split('');
        const maskCount = Math.max(1, Math.round(chars.length * 0.4));
        const maskIndices = [];
        while (maskIndices.length < maskCount) {
          const r = Math.floor(Math.random() * chars.length);
          if (!maskIndices.includes(r)) maskIndices.push(r);
        }
        const masked = chars.map((c, i) => maskIndices.includes(i) ? '_' : c).join(' ');
        return { id: item.id, word: item.raw_word, meaning: item.meaning, maskedWord: masked };
      });
      state.spellIdx = 0;
      state.spellAnswered = false;
      state.spellIsCorrect = false;
      state.spellScore = { correct: 0, total: state.spellQuestions.length, wrongIds: [], finished: false };
      state.mood = 'normal';
    }

          </div>
          <div class="minihompy-body">
            <div class="hompy-left-side">
              <div class="bgm-widget-box">
                <span class="bgm-title">🎵 BGM</span>
                <button class="btn-pixel-black" style="padding: 2px 8px; font-size: 10px;" onclick="toggleBgm()">${isBgmPlaying ? '⏸ 정지' : '▶ 재생'}</button>
              </div>
              <div class="stat-counter-bar">
                <span style="color: #EA580C;">TODAY ${totC}</span>
                <span style="color: #1E293B;">TOTAL ${totQ}</span>
              </div>
              <div class="mini-room-box">
                <div class="large-mii-frame">
                  ${renderCharacterAvatar(state.char)}
                </div>
                <div style="flex-grow: 1;">
                  <div style="font-size: 11px; font-weight: 800; color: #64748B; display:flex; align-items:center; gap:4px;">GYMNASIUM ${renderMikasaBall(13)}</div>
                  <div style="font-weight: 900; font-size: 14px; margin-top: 2px;">${charInfo.name}</div>
                </div>
                <div class="left-emotion-badge">${state.mood === 'happy' ? '🔥' : (state.mood === 'angry' ? '💢' : '✨')}</div>
              </div>
              <div class="char-spec-box">
                <div><span style="color:#64748B; font-weight:700;">소속:</span> <b>${charInfo.school}</b> | <span style="color:#64748B; font-weight:700;">등번호:</span> <b>#${charInfo.num}</b></div>
                <div><span style="color:#64748B; font-weight:700;">포지션:</span> <b>${charInfo.pos}</b></div>
                <div style="color: #EA580C; font-weight: 800; margin-top: 4px; font-style: italic;">"${charInfo.motto}"</div>
              </div>
              <div class="streak-week-box">${streakHtml}</div>
              <div>
                <div style="display:flex; justify-content:space-between; font-size: 11px; font-weight: 800; color: #475569;">
                  <span>토스 정확도</span><span>${accPct}%</span>
                </div>
                <div class="stamina-progress-bg"><div class="stamina-progress-fill" style="width: ${accPct}%;"></div></div>
                <div style="display:flex; justify-content:space-between; font-size: 11px; font-weight: 800; color: #475569; margin-top: 6px;">
                  <span>Lv.${charInfo.level} ${charInfo.title}</span><span>${charInfo.exp}/${charInfo.maxExp} EXP</span>
                </div>
                <div class="stamina-progress-bg"><div class="stamina-progress-fill" style="width: ${expPct}%; background: #3B82F6;"></div></div>
              </div>
              <div style="display: flex; gap: 4px; margin-top: 4px;">
                <button class="btn-pixel-white" style="flex: 1; padding: 6px; font-size: 11px;" onclick="feedPartner()">🍙 ${charInfo.food}</button>
                <button class="btn-pixel-white" style="flex: 1; padding: 6px; font-size: 11px; display:flex; align-items:center; justify-content:center; gap:4px;" onclick="actionPartner()">${renderMikasaBall(14)} ${charInfo.act}</button>
              </div>
              <div style="margin-top: 2px; display: flex; gap: 4px;">
                <button class="btn-pixel-white" style="flex: 1; padding: 6px; font-size: 11px;" onclick="state.entered=false; render();">🔄 선수 교체</button>
                <button class="btn-pixel-white" style="flex: 1; padding: 6px; font-size: 11px;" onclick="changeLanguage()">🌐 언어 변경</button>
                <button class="btn-pixel-white" style="flex: 1; padding: 6px; font-size: 11px;" onclick="resetToUserSelect()">👥 사용자 변경</button>
              </div>
            </div>

            <div class="hompy-nav-tabs">
              <button class="btn-tab-menu ${state.tab === 'practice' ? 'active' : ''}" onclick="switchTab('practice')">연습</button>
              <button class="btn-tab-menu ${state.tab === 'quiz' ? 'active' : ''}" onclick="switchTab('quiz')">객관식</button>
              <button class="btn-tab-menu ${state.tab === 'hard' ? 'active' : ''}" onclick="switchTab('hard')">주관식</button>
              ${state.lang !== 'ja' ? `<button class="btn-tab-menu ${state.tab === 'spell' ? 'active' : ''}" onclick="switchTab('spell')">스펠링</button>` : ''}
              <button class="btn-tab-menu ${state.tab === 'custom' ? 'active' : ''}" onclick="switchTab('custom')">단어장</button>
              <button class="btn-tab-menu ${state.tab === 'spaced' ? 'active' : ''}" onclick="switchTab('spaced')">복습</button>
              <button class="btn-tab-menu ${state.tab === 'history' ? 'active' : ''}" onclick="switchTab('history')">기록</button>
            </div>

            <div class="hompy-main-content">
              <div class="main-speech-bubble">💬 ${renderSpeechWithBall(state.speech)}</div>
              <div id="tab-content" style="flex-grow: 1; display: flex; flex-direction: column;">
                ${renderTabContent()}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderDaySelect(changeHandler) {
      const days = getDaysList();
      return `
        <select class="std-input" style="width: 150px; height: 34px;" onchange="${changeHandler}(this.value)">
          ${days.map(d => {
            let label = d;
            if (d === 'all') label = '전체 범위';
            else if (!isNaN(d)) label = `Day ${d}`;
            return `<option value="${d}" ${state.selectedDay === d ? 'selected' : ''}>${label}</option>`;
          }).join('')}
        </select>
      `;
    }

    function renderTabContent() {
      if (state.tab === 'practice') {
        const list = getFilteredVocab();
        if (list.length === 0) {
          return `
            <div style="display:flex; justify-content:space-between; margin-bottom:12px;">${renderDaySelect('onDayChange')}</div>
            <p style="color:#64748B; text-align:center; margin-top:50px;">선택된 범위에 단어가 없습니다.</p>
          `;
        }
        const item = list[state.fcIdx] || list[0];
        
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            ${renderDaySelect('onDayChange')}
            <button class="btn-pixel-white" onclick="shuffleFlashcards()">🔀 셔플</button>
          </div>
          <div class="flashcard-box" onclick="toggleFlashcardMeaning()">
            <div style="font-size: 32px; font-weight: 900; color: #1E293B;">${item.word}</div>
            
            <div style="margin: 14px 0;" onclick="event.stopPropagation();">
              ${state.lang === 'ja' ? `
                <button class="btn-pixel-white" onclick="playTTS('${item.speech_word || item.raw_word}', 'JA')">🔊 일본어 발음 듣기</button>
              ` : `
                <div class="accent-btn-group">
                  <button class="accent-btn ${state.selectedAccent === 'US' ? 'active' : ''}" onclick="setAccent('US'); playTTS('${item.raw_word}', 'US');">🇺🇸 미국식</button>
                  <button class="accent-btn ${state.selectedAccent === 'UK' ? 'active' : ''}" onclick="setAccent('UK'); playTTS('${item.raw_word}', 'UK');">🇬🇧 영국식</button>
                </div>
              `}
            </div>

            ${state.fcShowMeaning
              ? `<div style="font-size: 20px; font-weight: 800; color: #EA580C; margin-top: 10px;">${item.meaning}</div>`
              : `<div style="font-size: 13px; color: #94A3B8; margin-top: 10px;">[카드를 탭하여 뜻 확인]</div>`}
          </div>
          <div style="display: flex; justify-content: center; gap: 10px; margin-top: 15px;">
            <button class="btn-pixel-white" ${state.fcIdx === 0 ? 'disabled' : ''} onclick="prevFlashcard()">◀ 이전</button>
            <button class="btn-pixel-black" onclick="toggleFlashcardMeaning()">${state.fcShowMeaning ? '단어만 보기' : '뜻 보기'}</button>
            <button class="btn-pixel-white" ${state.fcIdx >= list.length - 1 ? 'disabled' : ''} onclick="nextFlashcard()">다음 ▶</button>
          </div>
        `;
      }

      if (state.tab === 'quiz') {
        const sc = state.quizScore;
        if (sc.finished) {
          const rate = sc.total > 0 ? ((sc.correct / sc.total) * 100).toFixed(1) : 100;
          return `
            <div style="text-align: center; padding: 40px 20px;">
              <h3 style="font-weight: 900; display:flex; justify-content:center; align-items:center; gap:7px;">${renderMikasaBall(22)} 1세트 객관식 결과</h3>
              <p style="font-size: 16px; color: #4B5563;">성공률: ${rate}% (${sc.correct}/${sc.total})</p>
              <h4 style="color: #EA580C; font-weight: 900;">+${sc.correct * 4} EXP | +${sc.correct * 5} 🪙 획득!</h4>
              <button class="btn-pixel-black" style="margin-top: 15px;" onclick="generateQuiz(); render();">다시 시작하기 ➔</button>
            </div>
          `;
        }
        if (state.quizQuestions.length === 0) return `<p style="padding:20px;">문제를 생성 중이거나 단어가 부족합니다 (최소 4개 필요).</p>`;
        const q = state.quizQuestions[state.quizIdx];
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            ${renderDaySelect('onDayChange')}
            <span style="font-weight: 800;">문제: ${state.quizIdx + 1} / ${state.quizQuestions.length}</span>
          </div>
          <div style="text-align: center; padding: 10px 0;">
            <h2 style="font-weight: 900; color: #1E293B; margin: 5px 0 15px 0;">${q.word}</h2>
          </div>
          <div>
            ${q.opts.map((opt, i) => {
              let cls = "option-btn";
              if (state.quizAnswered) {
                if (opt === q.cAns) cls += " btn-correct";
                else if (opt === state.quizSelectedOpt) cls += " btn-wrong";
              }
              return `<button class="${cls}" onclick="handleQuizOpt('${opt.replace(/'/g, "\\'")}')">${i + 1}.  ${opt}</button>`;
            }).join('')}
          </div>
          ${state.quizAnswered ? `
            <div style="text-align: right; margin-top: 5px;">
              <button class="btn-pixel-black" onclick="nextQuiz()">
                ${state.quizIdx < state.quizQuestions.length - 1 ? '다음 문제 ➔' : '세트 결과 확인 ➔'}
              </button>
            </div>
          ` : ''}
        `;
      }

      if (state.tab === 'hard') {
        const sc = state.hardScore;
        if (sc.finished) {
          return `
            <div style="text-align: center; padding: 40px 20px;">
              <h3 style="font-weight: 900;">🔥 주관식 Hard 세트 완료!</h3>
              <p style="font-size: 16px; color: #4B5563;">적중: ${sc.correct} / ${sc.total}</p>
              <h4 style="color: #EA580C; font-weight: 900;">+${sc.correct * 7} EXP | +${sc.correct * 10} 🪙 획득!</h4>
              <button class="btn-pixel-black" style="margin-top: 15px;" onclick="generateHardQuiz(); render();">다시 시작하기 ➔</button>
            </div>
          `;
        }
        if (state.hardQuestions.length === 0) return `<p style="padding:20px;">단어가 없습니다.</p>`;
        const q = state.hardQuestions[state.hardIdx];
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            ${renderDaySelect('onDayChange')}
            <span style="font-weight: 800;">문제: ${state.hardIdx + 1} / ${state.hardQuestions.length}</span>
          </div>
          <div style="text-align: center; padding: 15px 0;">
            <h2 style="font-weight: 900; color: #1E293B; margin: 0 0 10px 0;">${q.word}</h2>
            <p style="color: #64748B; font-size: 13px;">한국어 뜻을 직접 입력하세요.</p>
          </div>
          <div style="max-width: 440px; margin: 0 auto; width: 100%;">
            <input type="text" id="hard-input" class="std-input" placeholder="한국어 뜻 입력 (예: 잡다)" ${state.hardAnswered ? 'disabled' : ''} onkeydown="if(event.key==='Enter') submitHard();" />
            <div style="margin-top: 10px;">
              ${!state.hardAnswered ? `
                <button class="btn-pixel-black" style="width: 100%;" onclick="submitHard()">정답 확인</button>
              ` : `
                <div style="background: ${state.hardIsCorrect ? '#DCFCE7' : '#FEE2E2'}; color: ${state.hardIsCorrect ? '#166534' : '#991B1B'}; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 8px;">
                  ${state.hardIsCorrect ? '● 정답입니다!' : '✕ 정답: ' + q.meaning}
                </div>
                <button class="btn-pixel-black" style="width: 100%;" onclick="nextHard()">
                  ${state.hardIdx < state.hardQuestions.length - 1 ? '다음 문제 ➔' : '세트 결과 확인 ➔'}
                </button>
              `}
            </div>
          </div>
        `;
      }

      if (state.tab === 'spell' && state.lang !== 'ja') {
        const sc = state.spellScore;
        if (sc.finished) {
          return `
            <div style="text-align: center; padding: 40px 20px;">
              <h3 style="font-weight: 900;">🔤 스펠링 게임 완료!</h3>
              <p style="font-size: 16px; color: #4B5563;">적중: ${sc.correct} / ${sc.total}</p>
              <h4 style="color: #EA580C; font-weight: 900;">+${sc.correct * 6} EXP | +${sc.correct * 8} 🪙 획득!</h4>
              <button class="btn-pixel-black" style="margin-top: 15px;" onclick="generateSpellQuiz(); render();">다시 시작하기 ➔</button>
            </div>
          `;
        }
        if (state.spellQuestions.length === 0) return `<p style="padding:20px;">단어가 없습니다.</p>`;
        const q = state.spellQuestions[state.spellIdx];
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            ${renderDaySelect('onDayChange')}
            <span style="font-weight: 800;">문제: ${state.spellIdx + 1} / ${state.spellQuestions.length}</span>
          </div>
          <div style="text-align: center; padding: 10px 0;">
            <h4 style="font-weight: 800; color: #4B5563; margin: 0;">${q.meaning}</h4>
            <div style="font-family: monospace; font-size: 30px; letter-spacing: 4px; font-weight: 900; margin: 12px 0;">${q.maskedWord}</div>
          </div>
          <div style="max-width: 440px; margin: 0 auto; width: 100%;">
            <input type="text" id="spell-input" class="std-input" placeholder="완성된 영단어 입력" ${state.spellAnswered ? 'disabled' : ''} onkeydown="if(event.key==='Enter') submitSpell();" />
            <div style="margin-top: 10px;">
              ${!state.spellAnswered ? `
                <button class="btn-pixel-black" style="width: 100%;" onclick="submitSpell()">철자 제출</button>
              ` : `
                <div style="background: ${state.spellIsCorrect ? '#DCFCE7' : '#FEE2E2'}; color: ${state.spellIsCorrect ? '#166534' : '#991B1B'}; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 8px;">
                  ${state.spellIsCorrect ? '● 정답: ' + q.word : '✕ 정답: ' + q.word}
                </div>
                <button class="btn-pixel-black" style="width: 100%;" onclick="nextSpell()">
                  ${state.spellIdx < state.spellQuestions.length - 1 ? '다음 문제 ➔' : '세트 결과 확인 ➔'}
                </button>
              `}
            </div>
          </div>
        `;
      }

      if (state.tab === 'custom') {
        const db = getCombinedVocab();
        const myVocab = db.filter(d => state.userData.myVocabIds.includes(d.id));
        return `
          <h4 style="font-weight: 900; margin-top: 0; color: #1E293B;">➕ 나만의 단어 추가</h4>
          <div class="custom-input-row">
            <input type="text" id="c-day" placeholder="${state.lang === 'ja' ? '품사' : 'Day 번호'}" style="width: 20%;" />
            <input type="text" id="c-word" placeholder="${state.lang === 'ja' ? '일본어 단어' : '영어 단어'}" style="width: 35%;" />
            <input type="text" id="c-meaning" placeholder="한국어 뜻 입력" style="width: 45%;" />
            <button class="btn-pixel-black" onclick="addCustomWord()">추가 ➕</button>
          </div>
          <hr style="border: 0; border-top: 1px solid #E2E8F0; margin: 15px 0;" />
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h4 style="font-weight: 900; margin: 0; color: #1E293B;">📑 내 오답 단어장 (${myVocab.length})</h4>
          </div>
          <div style="max-height: 250px; overflow-y: auto; margin-top: 10px;">
            ${myVocab.length === 0 ? '<p style="color: #94A3B8; text-align: center; padding: 25px;">저장된 오답이 없습니다.</p>' :
              myVocab.map(r => `
                <div class="word-row">
                  <div>
                    <span style="font-weight: 800; color: #1E293B;">${r.word}</span>
                    <span style="color: #64748B; margin-left: 10px;">${r.meaning}</span>
                  </div>
                  <button class="btn-pixel-white" onclick="removeMyVocab('${r.id}')">외웠다 ✔</button>
                </div>
              `).join('')}
          </div>
        `;
      }

      if (state.tab === 'spaced') {
        const sData = state.userData.spacedRepData;
        const todayStr = new Date().toISOString().split('T')[0];
        const db = getCombinedVocab();
        const reviewIds = Object.keys(sData).filter(k => sData[k].nextDate <= todayStr);
        const reviewList = db.filter(d => reviewIds.includes(d.id));

        if (reviewList.length === 0) {
          return `<div style="text-align: center; padding: 50px 20px;"><h4 style="font-weight: 800;">오늘 복습할 망각 단어가 없습니다! 🎉</h4></div>`;
        }
        return `
          <h4 style="font-weight: 900; margin-top: 0;">🧠 오늘의 주기 복습 단어 (${reviewList.length}개)</h4>
          <div style="max-height: 380px; overflow-y: auto;">
            ${reviewList.map(r => `
              <div class="word-row">
                <div>
                  <span style="font-weight: 800; color: #1E293B;">${r.word}</span>
                  <span style="color: #64748B; margin-left: 10px;">${r.meaning}</span>
                </div>
                <button class="btn-pixel-black" onclick="passSpacedRep('${r.id}')">복습완료 (+5 EXP)</button>
              </div>
            `).join('')}
          </div>
        `;
      }

      if (state.tab === 'history') {
        const hList = [...state.userData.studyHistory].reverse();
        return `
          <h4 style="font-weight: 900; margin-top: 0;">📊 나의 훈련 통계</h4>
          ${hList.length === 0 ? '<p style="color: #94A3B8; text-align: center; padding: 40px;">기록이 없습니다.</p>' : `
            <table class="history-table">
              <thead>
                <tr><th>날짜</th><th>푼 문제</th><th>성공</th><th>성공률</th></tr>
              </thead>
              <tbody>
                ${hList.map(item => `
                  <tr>
                    <td>${item.date}</td>
                    <td>${item.total}문제</td>
                    <td>${item.correct}개</td>
                    <td>${item.total > 0 ? ((item.correct / item.total) * 100).toFixed(1) : 100}%</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `}
        `;
      }

      return '';
    }

    function selectUser(u) {
      state.user = u;
      state.lang = null;
      state.entered = false;
      state.selectedDay = 'all';
      state.tab = 'practice';
      render();
    }

    function selectLang(l) { state.lang = l; render(); }
    function selectChar(c) { state.char = c; render(); }

    function enterGym() {
      state.entered = true;
      loadUserData();
      const lName = state.lang === 'ja' ? '일본어' : '토익';
      if (state.char === 'kenma') state.speech = `${lName} 단어도 게임처럼 패턴을 찾으면 돼. 천천히 하나씩 하자.`;
      else if (state.char === 'kita') state.speech = `${lName}도 매일 제대로 반복하는 게 중요하다. 오늘 할 것부터 하자.`;
      else if (state.char === 'goshiki') state.speech = `${lName} 단어 정도는 완벽하게 외워야 에이스라고 할 수 있지!`;
      else if (state.char === 'osamu') state.speech = `츠무 녀석보다 ${lName} 잘 외우면 갓 지은 주먹밥 만들어줄게.`;
      else if (state.char === 'miya') state.speech = `내 토스 치고 싶으면 ${lName} 단어 억수로 퍼펙트하게 외워와라!`;
      else if (state.char === 'oikawa') state.speech = `재능은 꽃피우는 것, 센스는 갈고닦는 것! ${lName} 힘내보자구~`;
      else state.speech = `내가 있으면 넌 최강이다! 오늘 ${lName} 단어 훈련 시작이다.`;

      initFlashcards();
      generateQuiz();
      generateHardQuiz();
      generateSpellQuiz();
      render();
    }

    function switchTab(t) {
      state.tab = t;
      if (t === 'practice') initFlashcards();
      if (t === 'quiz') generateQuiz();
      if (t === 'hard') generateHardQuiz();
      if (t === 'spell') generateSpellQuiz();
      render();
    }

    function onDayChange(val) {
      state.selectedDay = val;
      if (state.tab === 'practice') initFlashcards();
      if (state.tab === 'quiz') generateQuiz();
      if (state.tab === 'hard') generateHardQuiz();
      if (state.tab === 'spell') generateSpellQuiz();
      render();
    }

    function feedPartner() {
      if (state.userData.coins < 10) return alert('코인이 부족합니다!');
      state.userData.coins -= 10;
      state.userData.satisfaction = Math.min(4, state.userData.satisfaction + 1);
      state.mood = 'happy';
      state.speech = '우물우물... 기운이 펄펄 난다! (만족도 상승) ✨';
      addRewards(5, 0);
    }

    function actionPartner() {
      state.userData.stamina = Math.min(4, state.userData.stamina + 1);
      state.mood = 'happy';
      state.speech = '몸 제대로 풀렸다! 단어도 스파이크 때리듯 꽂자! 🏐';
      addRewards(3, 0);
    }

    function toggleFlashcardMeaning() { state.fcShowMeaning = !state.fcShowMeaning; render(); }
    function prevFlashcard() { if (state.fcIdx > 0) { state.fcIdx--; state.fcShowMeaning = false; render(); } }
    function nextFlashcard() {
      const list = getFilteredVocab();
      if (state.fcIdx < list.length - 1) {
        state.fcIdx++;
        state.fcShowMeaning = false;
        addRewards(1, 0);
      }
    }
    function shuffleFlashcards() {
      initFlashcards();
      state.speech = '순서 바꿨다. 순서만 외워서 맞히는 꼼수는 코트에서 안 통해.';
      render();
    }

    function handleQuizOpt(opt) {
      if (state.quizAnswered) return;
      const q = state.quizQuestions[state.quizIdx];
      state.quizSelectedOpt = opt;
      state.quizAnswered = true;
      const isCorr = (opt === q.cAns);
      if (isCorr) {
        state.quizScore.correct++;
        state.mood = 'happy';
        state.speech = '나이스 샷! 코트에 남는 건 이긴 녀석뿐이다! 🔥';
      } else {
        if (!state.quizScore.wrongIds.includes(q.id)) state.quizScore.wrongIds.push(q.id);
        state.mood = 'angry';
        state.speech = '보게에에에! 집중 안 하냐?! 오답노트 봐라! 💢';
      }
      render();
    }

    function nextQuiz() {
      if (state.quizIdx < state.quizQuestions.length - 1) {
        state.quizIdx++;
        state.quizAnswered = false;
        state.quizSelectedOpt = null;
      } else {
        state.quizScore.finished = true;
        addRewards(state.quizScore.correct * 4, state.quizScore.correct * 5);
        if (state.quizScore.wrongIds.length > 0) {
          state.userData.myVocabIds = Array.from(new Set([...state.userData.myVocabIds, ...state.quizScore.wrongIds]));
          const tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
          state.quizScore.wrongIds.forEach(id => {
            state.userData.spacedRepData[id] = { stage: 1, nextDate: tmr.toISOString().split('T')[0] };
          });
        }
        state.userData.studyHistory.push({
          date: new Date().toISOString().split('T')[0],
          total: state.quizScore.total,
          correct: state.quizScore.correct
        });
        saveUserData();
      }
      render();
    }

    function submitHard() {
      if (state.hardAnswered) return;
      const input = document.getElementById('hard-input');
      const val = input.value.replace(/\s+/g, '').trim();
      if (!val) return;
      const q = state.hardQuestions[state.hardIdx];
      const meanings = q.meaning.split(/[,/~;]/).map(m => m.replace(/\s+/g, '').trim());
      const isCorr = meanings.some(m => m.includes(val) || val.includes(m));
      state.hardAnswered = true;
      state.hardIsCorrect = isCorr;
      if (isCorr) {
        state.hardScore.correct++;
        state.mood = 'happy';
        state.speech = '주관식을 이렇게 딱 맞히네! 완벽하다! 🏐';
      } else {
        if (!state.hardScore.wrongIds.includes(q.id)) state.hardScore.wrongIds.push(q.id);
        state.mood = 'angry';
        state.speech = '직접 쓰려니까 손이 굳었나?! 오답노트 봐라! 💢';
      }
      render();
    }

    function nextHard() {
      if (state.hardIdx < state.hardQuestions.length - 1) {
        state.hardIdx++;
        state.hardAnswered = false;
        state.hardIsCorrect = false;
      } else {
        state.hardScore.finished = true;
        addRewards(state.hardScore.correct * 7, state.hardScore.correct * 10);
        if (state.hardScore.wrongIds.length > 0) {
          state.userData.myVocabIds = Array.from(new Set([...state.userData.myVocabIds, ...state.hardScore.wrongIds]));
        }
        saveUserData();
      }
      render();
    }

    function submitSpell() {
      if (state.spellAnswered) return;
      const input = document.getElementById('spell-input');
      const val = input.value.trim().toLowerCase();
      if (!val) return;
      const q = state.spellQuestions[state.spellIdx];
      const isCorr = (val === q.word.trim().toLowerCase());
      state.spellAnswered = true;
      state.spellIsCorrect = isCorr;
      if (isCorr) {
        state.spellScore.correct++;
        state.mood = 'happy';
        state.speech = '철자 하나도 안 틀리고 정확하게 꽂았다! 🔥';
      } else {
        if (!state.spellScore.wrongIds.includes(q.id)) state.spellScore.wrongIds.push(q.id);
        state.mood = 'angry';
        state.speech = '스펠링 삐끗했다! 철자가 생명이다! 💢';
      }
      render();
    }

    function nextSpell() {
      if (state.spellIdx < state.spellQuestions.length - 1) {
        state.spellIdx++;
        state.spellAnswered = false;
        state.spellIsCorrect = false;
      } else {
        state.spellScore.finished = true;
        addRewards(state.spellScore.correct * 6, state.spellScore.correct * 8);
        if (state.spellScore.wrongIds.length > 0) {
          state.userData.myVocabIds = Array.from(new Set([...state.userData.myVocabIds, ...state.spellScore.wrongIds]));
        }
        saveUserData();
      }
      render();
    }

    function addCustomWord() {
      const d = document.getElementById('c-day').value.trim();
      const w = document.getElementById('c-word').value.trim();
      const m = document.getElementById('c-meaning').value.trim();
      if (!d || !w || !m) return alert('내용을 모두 입력해주세요.');
      const newWord = { id: `c_${Date.now()}`, day: d, word: w, raw_word: w, speech_word: w, meaning: m };
      state.userData.customWords.push(newWord);
      saveUserData();
      alert('단어가 추가되었습니다!');
      render();
    }

    function removeMyVocab(id) {
      state.userData.myVocabIds = state.userData.myVocabIds.filter(v => v !== id);
      addRewards(2, 2);
    }

    function passSpacedRep(id) {
      const intervals = { 1: 3, 2: 7, 3: 14, 4: 30, 5: 30 };
      const cur = state.userData.spacedRepData[id] || { stage: 1 };
      const nextStage = Math.min(5, cur.stage + 1);
      const d = new Date();
      d.setDate(d.getDate() + (intervals[nextStage] || 30));
      state.userData.spacedRepData[id] = { stage: nextStage, nextDate: d.toISOString().split('T')[0] };
      addRewards(5, 5);
    }

    // 앱 초기화 및 CSV 데이터 자동 로딩
    (async function initApp() {
      await loadAllCSVData();
      render();
    })();
  </script>
</body>
